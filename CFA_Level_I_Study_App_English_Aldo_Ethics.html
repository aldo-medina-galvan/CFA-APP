inition":"Some strong business models collect from customers before paying suppliers. However, a negative CCC caused by involuntary payment delays may indicate stress."},{"id":38,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Use average balance-sheet amounts and the correct flow denominators","trap":"Using ending balances or mixing receivables with COGS and inventory with revenue.","definition":"DOH normally uses average inventory/COGS; DSO uses average receivables/revenue; DPO uses average payables/purchases, with COGS sometimes used as an approximation when purchases are unavailable."},{"id":39,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Current, quick, and cash ratios are not interchangeable","trap":"Treating all liquidity ratios as equivalent measures.","definition":"Current ratio includes all current assets; quick ratio excludes less-liquid items such as inventory; cash ratio includes only cash and marketable securities in the numerator."},{"id":40,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"A higher liquidity ratio is not always better","trap":"Selecting the company with the highest current ratio without further analysis.","definition":"A very high ratio may reflect idle cash, excessive inventory, weak receivable collection, or inefficient use of assets. Compare quality, trend, and industry norms."},{"id":41,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Primary and secondary liquidity sources are different","trap":"Treating asset sales and restructuring as ordinary recurring liquidity.","definition":"Primary sources include operating cash flow, cash balances, marketable securities, and normal credit access. Secondary sources include asset sales, debt renegotiation, operational reductions, and restructuring."},{"id":42,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Liquidity drags and liquidity pulls are different","trap":"Using the terms as synonyms.","definition":"A drag delays cash inflows, such as slower collection or inventory turnover. A pull accelerates cash outflows, such as shorter supplier terms or an earlier debt maturity."},{"id":43,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"A conservative policy reduces risk but may reduce return","trap":"Assuming a conservative working capital policy maximizes both liquidity and profitability.","definition":"Holding more current assets and using more long-term financing lowers liquidity and refinancing risk but increases carrying and financing costs."},{"id":44,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Maturity matching does not mean using only short-term debt","trap":"Financing permanent assets and permanent working capital entirely with short-term borrowing because it is cheaper.","definition":"A moderate policy generally finances permanent needs with long-term capital and seasonal needs with short-term funding."},{"id":45,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Forgoing a supplier discount can have a very high effective annual cost","trap":"Using the discount percentage as the annual borrowing cost or using the full invoice period as the financing period.","definition":"For terms d/b, net c: periodic cost = d/(1-d), and EAR = [1 + d/(1-d)]^[365/(c-b)] - 1. The financing period is c-b days."},{"id":46,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"A required compliance project may have a negative standalone NPV","trap":"Rejecting every negative-NPV project without considering legal or operating consequences.","definition":"A company may need the project to retain a license, avoid fines, or continue operating. The relevant decision may be which compliant alternative has the lowest economic cost."},{"id":47,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"NPV and IRR answer different questions","trap":"Treating them as interchangeable measures.","definition":"NPV measures the currency amount of value created. IRR is the discount rate that makes NPV equal to zero and measures a percentage return."},{"id":48,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"NPV equal to zero is not a failed project","trap":"Interpreting NPV = 0 as earning no return.","definition":"An NPV of zero means the project is expected to earn exactly the required rate of return and neither create nor destroy value."},{"id":49,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Accept all positive-NPV independent projects when capital is unconstrained","trap":"Selecting only the independent project with the largest NPV.","definition":"Independent projects do not compete with one another. If resources are available, every project with NPV > 0 should be accepted."},{"id":50,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"For mutually exclusive projects, the higher NPV normally prevails","trap":"Automatically choosing the project with the higher IRR.","definition":"Only one mutually exclusive project can be selected. When rankings conflict, choose the project that creates the greatest value, which is normally the one with the higher NPV."},{"id":51,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"A higher IRR can create less total value","trap":"Equating the highest percentage return with the best capital allocation decision.","definition":"A small project can have a very high IRR but a modest NPV. A larger project with a lower IRR can add substantially more value."},{"id":52,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Nonconventional cash flows can produce multiple IRRs","trap":"Assuming every project has one economically meaningful IRR.","definition":"Multiple sign changes in the cash-flow sequence can create multiple IRRs or no useful IRR. Use the NPV profile and NPV decision rule."},{"id":53,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"NPV and IRR use different reinvestment assumptions","trap":"Assuming both methods reinvest interim cash flows at the same rate.","definition":"NPV assumes reinvestment at the required return; IRR assumes reinvestment at the IRR. The NPV assumption is generally more realistic."},{"id":54,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"ROIC is not a forward-looking project NPV","trap":"Using company ROIC as though it were the expected IRR of a proposed investment.","definition":"ROIC is largely an accounting-based, historical measure for a company or business unit. NPV and IRR use expected project cash flows."},{"id":55,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Compare ROIC with WACC, not only with the cost of debt","trap":"Concluding that value is created whenever ROIC exceeds the borrowing rate.","definition":"The company must compensate all capital providers. ROIC above WACC indicates value creation; ROIC below WACC indicates value destruction."},{"id":56,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Capital allocation does not end when a project is approved","trap":"Ignoring monitoring and post-investment review because the initial decision cannot be reversed.","definition":"The process includes idea generation, analysis, prioritization, monitoring, and post-investment review to improve forecasts, accountability, and operating performance."},{"id":57,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Use incremental after-tax cash flows, not accounting earnings","trap":"Basing the decision on net income, EPS, EBIT, or EBITDA alone.","definition":"Project value depends on the cash flows that change because of the project after considering taxes. Accounting earnings can contain accruals and noncash items."},{"id":58,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Depreciation is noncash, but its tax shield is valuable","trap":"Either subtracting depreciation as a cash payment or ignoring it completely.","definition":"Depreciation is added back because it is noncash, but the tax saving remains: depreciation tax shield = depreciation x tax rate."},{"id":59,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Exclude sunk costs","trap":"Including research, consulting, or development expenditures that have already been paid and cannot be recovered.","definition":"A sunk cost is unchanged by the accept-reject decision and is therefore irrelevant to incremental project cash flow."},{"id":60,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Include opportunity costs","trap":"Treating a company-owned asset as free because no new purchase is required.","definition":"Use of the asset sacrifices its best alternative sale, rental, or operating use. That forgone benefit is an incremental cost."},{"id":61,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Include cannibalization","trap":"Counting all new-product revenue while ignoring sales lost from an existing product.","definition":"The reduction in the cash flows of existing products is a negative project externality and must be deducted."},{"id":62,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Include positive spillovers","trap":"Analyzing the new project in isolation and ignoring benefits to other divisions or products.","definition":"Additional sales, cost savings, or strategic benefits elsewhere in the company are incremental benefits when caused by the project."},{"id":63,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Include only incremental overhead","trap":"Adding every accounting overhead allocation to the project.","definition":"Include support costs only when total company cash spending increases because the project is accepted. Existing costs that do not change are not incremental."},{"id":64,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Do not double-count financing costs","trap":"Subtracting project interest expense from cash flows and then discounting those cash flows at a WACC that already includes the cost of debt.","definition":"Evaluate operating cash flows separately from financing and discount them at the appropriate required return unless the question explicitly specifies another framework."},{"id":65,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"An increase in net working capital is a cash outflow","trap":"Treating higher inventory or receivables as a positive operating cash flow because they are current assets.","definition":"Additional working capital absorbs cash at project initiation or during growth. Recovery of working capital at the end is a terminal cash inflow."},{"id":66,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Match nominal cash flows with nominal discount rates","trap":"Discounting inflation-adjusted cash flows at a real rate, or real cash flows at a nominal rate.","definition":"Use nominal with nominal and real with real. Also recognize that individual revenues and expenses may experience different inflation rates."},{"id":67,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Internal funds are not economically free","trap":"Using a zero or unusually low hurdle rate because the project is financed with retained earnings.","definition":"Retained earnings belong economically to shareholders and could be distributed, used to repay debt, or invested elsewhere. They have an opportunity cost."},{"id":68,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Short-term EPS or ROE can conflict with value creation","trap":"Rejecting a positive-NPV project because it initially lowers an accounting performance measure.","definition":"Capital allocation should maximize long-term value. A project can reduce current EPS or ROE while still having a positive NPV."},{"id":69,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Pet projects and inertia are behavioral pitfalls","trap":"Classifying optimistic assumptions for a favored executive project, or repeating last year's capital budget, as purely mathematical errors.","definition":"Pet projects receive biased assumptions or weak scrutiny. Inertia allocates capital based on historical budgets rather than current positive-NPV opportunities."},{"id":70,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"A real option is a right, not an obligation","trap":"Assuming management must exercise an abandonment, expansion, timing, or flexibility option.","definition":"Management exercises the option only when it adds value. Project value equals base NPV plus option value minus the cost of acquiring the flexibility."},{"id":71,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Decision-tree probabilities are multiplied along a path","trap":"Adding a conditional probability to the earlier-stage probability or discounting every payoff for the same number of periods.","definition":"For sequential events, P(A and B) = P(A) x P(B|A). Discount each payoff from the date on which it occurs, and solve the tree from the final nodes backward."},{"id":72,"module":"LM 6","moduleTitle":"Capital Structure","term":"WACC uses the after-tax cost of debt","trap":"Using the pretax debt rate or applying the tax adjustment to equity.","definition":"WACC = wd rd(1-T) + wp rp + we re. Interest is generally tax deductible; dividends and the cost of common equity are not tax-adjusted."},{"id":73,"module":"LM 6","moduleTitle":"Capital Structure","term":"WACC weights must represent total capital and sum to 100%","trap":"Using raw debt-to-equity ratios as weights or mixing book and market values inconsistently.","definition":"For a current market-based WACC, use market values of debt, preferred stock, and equity. Target weights may be used when the question specifies the target structure."},{"id":74,"module":"LM 6","moduleTitle":"Capital Structure","term":"Convert D/E into capital weights correctly","trap":"Interpreting D/E = 1.2 as a 120% debt weight.","definition":"If D/E = x, then wd = x/(1+x) and we = 1/(1+x). D/E compares debt with equity, not debt with total capital."},{"id":75,"module":"LM 6","moduleTitle":"Capital Structure","term":"Company WACC is appropriate only for similar-risk projects","trap":"Discounting every project at the issuer's existing WACC.","definition":"A project with greater business risk requires a higher rate; a lower-risk project requires a lower rate. Using the wrong rate can reverse the NPV decision."},{"id":76,"module":"LM 6","moduleTitle":"Capital Structure","term":"Cheaper debt does not imply unlimited debt is optimal","trap":"Concluding that management should maximize leverage because rd is below re.","definition":"Additional debt increases default risk, equity risk, expected distress costs, covenant constraints, and loss of financial flexibility."},{"id":77,"module":"LM 6","moduleTitle":"Capital Structure","term":"Operating leverage is not financial leverage","trap":"Treating fixed operating costs and interest-bearing debt as the same source of risk.","definition":"Operating leverage comes from fixed operating costs; financial leverage comes from fixed financing obligations. High operating leverage generally reduces debt capacity."},{"id":78,"module":"LM 6","moduleTitle":"Capital Structure","term":"Stable cash flows and tangible assets generally support more debt","trap":"Assuming every profitable company has the same borrowing capacity.","definition":"Predictable cash flows improve debt service capacity. Tangible, marketable assets can serve as collateral and reduce loss severity in distress."},{"id":79,"module":"LM 6","moduleTitle":"Capital Structure","term":"Start-ups generally rely more on equity than mature companies","trap":"Recommending debt to a start-up solely because debt has a lower stated required return.","definition":"Start-ups often have negative cash flow, high business risk, and limited collateral. Mature firms with stable cash flows can usually support more conventional debt."},{"id":80,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition I without taxes concerns firm value","trap":"Saying leverage increases value merely because debt is cheaper than equity.","definition":"Under MM's frictionless assumptions and no taxes, VL = VU. Financing changes how operating cash flows are divided, not their total value."},{"id":81,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition II without taxes explains why WACC stays constant","trap":"Assuming more low-cost debt automatically lowers WACC.","definition":"As D/E rises, equity becomes riskier and re rises: re = r0 + (r0-rd)(D/E). The increase in re exactly offsets the use of cheaper debt."},{"id":82,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition I with taxes adds the present value of the tax shield","trap":"Adding annual interest expense directly to the value of the firm.","definition":"For perpetual debt under the simplified model, VL = VU + TD. TD is the present value of the perpetual corporate interest tax shield."},{"id":83,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition II with taxes still has a rising cost of equity","trap":"Assuming the tax shield prevents equity from becoming riskier.","definition":"re = r0 + (r0-rd)(1-T)(D/E). Equity risk still increases, but the tax benefit prevents the increase from fully offsetting the benefit of debt, so WACC falls in the simplified model."},{"id":84,"module":"LM 6","moduleTitle":"Capital Structure","term":"The 100% debt conclusion belongs only to the simplified tax model","trap":"Applying MM with taxes as a realistic recommendation for all companies.","definition":"The result assumes no distress, agency, transaction, or flexibility costs. Real companies face increasing costs as leverage rises."},{"id":85,"module":"LM 6","moduleTitle":"Capital Structure","term":"Financial distress can occur before legal bankruptcy","trap":"Treating distress and bankruptcy as identical events.","definition":"Distress begins when there is serious uncertainty about meeting obligations. Customers, suppliers, employees, and investors may react before any legal filing."},{"id":86,"module":"LM 6","moduleTitle":"Capital Structure","term":"Indirect distress costs may exceed direct legal costs","trap":"Focusing only on court, legal, and restructuring fees.","definition":"Lost customers, tighter supplier terms, employee departures, underinvestment, reputation damage, and management distraction can be economically larger."},{"id":87,"module":"LM 6","moduleTitle":"Capital Structure","term":"Static trade-off theory implies an intermediate optimum","trap":"Concluding that the tax shield always dominates every other leverage effect.","definition":"Firm value = unlevered value + PV(tax shields) - PV(expected distress costs). The optimum occurs where the marginal tax benefit equals the marginal expected distress cost."},{"id":88,"module":"LM 6","moduleTitle":"Capital Structure","term":"Optimal and target capital structure are not identical","trap":"Assuming the observed leverage ratio must always equal the theoretical value-maximizing ratio.","definition":"The optimal structure is a theoretical point. The target is the practical range management seeks over time; actual leverage can fluctuate because of market prices, transactions, and financing timing."},{"id":89,"module":"LM 6","moduleTitle":"Capital Structure","term":"Pecking order theory does not require a fixed optimal debt ratio","trap":"Treating pecking order theory as another version of static trade-off theory.","definition":"The financing preference is internal funds, then debt, then external equity. Observed leverage reflects cumulative financing needs, information asymmetry, signaling, and issuance costs."},{"id":90,"module":"LM 6","moduleTitle":"Capital Structure","term":"Preferred internal funding is not free capital","trap":"Interpreting the first position in the pecking order as a zero required return.","definition":"Internal funds avoid issuance costs and signaling, but they still have an opportunity cost because shareholders could receive or redeploy the cash."},{"id":91,"module":"LM 6","moduleTitle":"Capital Structure","term":"Debt can discipline managers but also create agency conflicts","trap":"Describing debt as either purely beneficial or purely harmful for governance.","definition":"Debt reduces discretionary free cash flow and can limit wasteful investment, but excessive leverage can cause risk shifting, underinvestment, creditor conflicts, and distress."},{"id":92,"module":"LM 7","moduleTitle":"Business Models","term":"A business model is not a detailed financial plan","trap":"Defining the business model as the company's spreadsheet of projected revenue, expenses, and cash flow.","definition":"The business model explains how the company creates, delivers, and captures value. The financial plan translates that logic into detailed numerical forecasts."},{"id":93,"module":"LM 7","moduleTitle":"Business Models","term":"Value proposition is not value chain","trap":"Using the two concepts interchangeably.","definition":"The value proposition explains why the customer buys. The value chain explains how the company organizes activities and resources to deliver that value."},{"id":94,"module":"LM 7","moduleTitle":"Business Models","term":"B2B and B2C often have different customer economics","trap":"Assuming B2B necessarily means more customers or smaller transactions.","definition":"B2B commonly involves fewer customers, larger contracts, longer sales cycles, and customization. B2C commonly involves many customers, smaller purchases, branding, and broad distribution."},{"id":95,"module":"LM 7","moduleTitle":"Business Models","term":"Direct and indirect channels involve a control-cost trade-off","trap":"Assuming direct distribution is always more profitable or indirect distribution is always cheaper overall.","definition":"Direct channels provide customer data and control but require infrastructure. Indirect channels speed reach and reduce direct selling requirements but sacrifice margin and control."},{"id":96,"module":"LM 7","moduleTitle":"Business Models","term":"Freemium, add-on, razor-and-razorblade, penetration, and hidden revenue are different","trap":"Classifying every low-price or free offering as the same model.","definition":"Freemium has a free basic version; add-on starts with a paid base product; razor-and-razorblade earns on repeat consumables; penetration sacrifices early margin for scale; hidden revenue means another party pays."},{"id":97,"module":"LM 7","moduleTitle":"Business Models","term":"A broker is not the same as a retailer, distributor, or manufacturer","trap":"Assuming every intermediary takes ownership of inventory.","definition":"A manufacturer transforms inputs, a distributor resells to businesses, a retailer sells to final consumers, and a broker facilitates transactions for commissions or spreads without necessarily owning the product."},{"id":98,"module":"LM 7","moduleTitle":"Business Models","term":"Licensing is narrower than franchising","trap":"Treating a royalty agreement and a franchise system as equivalent.","definition":"Licensing primarily grants rights to intellectual property. Franchising transfers a broader business format, including brand, operating processes, products, standards, and marketing support."},{"id":99,"module":"LM 7","moduleTitle":"Business Models","term":"Network effects are not the same as economies of scale","trap":"Calling any business with falling average costs a network business.","definition":"Economies of scale reduce unit cost as output rises. Network effects increase the product's value to users as participation grows. A company may have one, both, or neither."},{"id":100,"module":"LM 7","moduleTitle":"Business Models","term":"A two-sided platform must attract both groups","trap":"Evaluating platform growth using only one side of the market.","definition":"More buyers attract sellers and more sellers attract buyers. A platform may face a chicken-and-egg problem and may subsidize one side to build the network."}]}},"alternative":{"label":"Alternative Investments","shortLabel":"Alternative Investments","subtitle":"CFA Level I 2027 · Alternative Investments","data":{"formula":[{"id":1,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"Hard Hurdle Without Catch-Up","definition":"r_GP = max[0, p(r − r_h)]\n\nThe GP earns a performance fee only on return above the hard hurdle."},{"id":2,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"Hurdle With Catch-Up","definition":"r_GP = max[0, r_cu + p(r − r_h − r_cu)]\n\nLPs first receive the preferred return, then the GP receives the catch-up, and remaining profit is split contractually."},{"id":3,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Independent Management and Performance Fees","definition":"R_GP = P₁r_m + max[0, (P₁ − P₀)p]"},{"id":4,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Investor Net Return After Fees","definition":"r_i = (P₁ − P₀ − R_GP) / P₀"},{"id":5,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Performance Fee Net of Management Fee","definition":"R_GP,net = P₁r_m + max{0, [P₁(1 − r_m) − P₀]p}"},{"id":6,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Net Performance Fee With a Hard Hurdle","definition":"R_GP,net,hurdle = P₁r_m + max{0, [P₁(1 − r_m) − P₀(1 + r_h)]p}"},{"id":7,"module":"LM 2","moduleTitle":"Performance and Returns","term":"High-Water Mark Fee","definition":"R_GP,HWM = Pₜr_m + max[0, (Pₜ(1 − r_m) − P_HWM)p]"},{"id":8,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Internal Rate of Return (IRR)","definition":"0 = Σₜ₌₀ⁿ [CFₜ / (1 + IRR)ᵗ]"},{"id":9,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Multiple of Invested Capital (MOIC)","definition":"MOIC = (Realized value + Unrealized value) / Total invested capital"},{"id":10,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Leveraged Return","definition":"r_L = r + (V_b / V_c)(r − r_b)\n\nLeverage helps when asset return exceeds borrowing cost and magnifies losses when it does not."},{"id":11,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"Loan-to-Value Ratio (LTV)","definition":"LTV = Mortgage or loan balance / Property or collateral value"},{"id":12,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"Required Debt Reduction Under an LTV Covenant","definition":"Required loan balance = Maximum LTV × Current collateral value\n\nRequired debt reduction = Current loan balance − Required loan balance"},{"id":13,"module":"LM 5","moduleTitle":"Natural Resources","term":"Commodity Forward Price","definition":"F₀(T) = S₀e^[(r + c − i)T]\n\nr = financing rate · c = carrying cost · i = convenience yield"}],"flashcards":[{"id":1,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What makes an investment an alternative investment?","definition":"It is outside the traditional categories of publicly traded equity, fixed income, and cash. Alternatives are often private, less liquid, less transparent, longer term, and more difficult to value."},{"id":2,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What are the three broad categories of alternative investments in the curriculum?","definition":"Private capital, real assets, and hedge funds. Digital assets are covered separately as an emerging alternative asset class."},{"id":3,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"Why do investors allocate to alternative investments?","definition":"Primarily to improve diversification and seek higher expected returns, including compensation for illiquidity, complexity, leverage, and less efficient markets."},{"id":4,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What are the main disadvantages of alternative investments?","definition":"Longer holding periods, reduced liquidity, high minimum commitments, complex fees, limited transparency, specialized due diligence, and valuation uncertainty."},{"id":5,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What is fund investing in alternatives?","definition":"The investor contributes capital to a professionally managed pool and delegates asset selection, financing, monitoring, and exit decisions to the manager. It offers access and diversification but the least control and usually the highest fee burden."},{"id":6,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What is co-investing?","definition":"An investor commits to a fund and also invests directly in selected portfolio assets alongside the fund. It provides more control and potentially lower fees, but requires additional due diligence and execution capability."},{"id":7,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What is direct investing?","definition":"The investor acquires an alternative asset without a fund intermediary. It offers maximum control and avoids external fund fees, but requires the greatest expertise, capital, governance resources, and tolerance for concentration risk."},{"id":8,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"How do fund investing, co-investing, and direct investing compare?","definition":"From fund to co-investment to direct investment: investor control and required expertise increase, external fees generally decrease, and concentration and execution risk generally increase."},{"id":9,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What are the roles of the general partner and limited partners?","definition":"The general partner (GP) manages the fund and makes investment decisions; it theoretically bears unlimited liability. Limited partners (LPs) supply capital, have limited liability, and normally do not manage the partnership."},{"id":10,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What are committed capital, capital calls, and distributions?","definition":"Committed capital is the amount an LP promises to provide. The GP draws it through capital calls as investments are made. Cash returned to LPs from income or asset sales is a distribution."},{"id":11,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What is the difference between an LPA and a side letter?","definition":"The limited partnership agreement (LPA) governs the fund and applies to all LPs. A side letter modifies selected terms for a specific LP, such as reporting requirements or excusal rights."},{"id":12,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"How do management-fee bases commonly differ between private equity and hedge funds?","definition":"Private equity fees are commonly based on committed capital during the investment period and may later step down. Hedge fund fees are typically based on assets under management or net asset value."},{"id":13,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What is carried interest?","definition":"Carried interest is the GP's performance fee: a percentage of eligible fund profits after applying the agreement's hurdle, high-water mark, waterfall, and other provisions. A 20% rate is common, not universal."},{"id":14,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"What is the difference between a hard hurdle and a soft hurdle?","definition":"With a hard hurdle, the performance fee applies only to return above the hurdle. With a soft hurdle, once the hurdle is exceeded, the fee may apply to the entire return; a catch-up clause can accelerate the GP's share after the hurdle is reached."},{"id":15,"module":"LM 1","moduleTitle":"Features, Methods, and Structures","term":"Compare a high-water mark, clawback, and American versus European waterfalls.","definition":"A high-water mark prevents charging twice for the same gains. A clawback requires the GP to return excess carry after later losses. An American waterfall pays carry deal by deal; a European waterfall pays carry only after LP capital and the required return are recovered at the total-fund level."},{"id":16,"module":"LM 2","moduleTitle":"Performance and Returns","term":"What is the difference between gross return and net return?","definition":"Gross return is the investment return before manager fees. Net return is what the investor retains after management fees, performance fees, and other fund-level charges."},{"id":17,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Why is alternative-investment performance difficult to appraise?","definition":"Assets may be unique, illiquid, and infrequently valued; cash flows are irregular; fee terms differ by investor; benchmarks are imperfect; and reported volatility can be distorted by appraisal or model-based pricing."},{"id":18,"module":"LM 2","moduleTitle":"Performance and Returns","term":"What is the J-curve?","definition":"Private-capital returns are often negative early because fees and investment costs occur before value creation and exits. Returns may turn positive later as portfolio companies mature and distributions are realized."},{"id":19,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Why is IRR commonly used for long-lived alternative investments?","definition":"IRR is the discount rate that sets the net present value of all investor cash flows to zero. It incorporates both the timing and magnitude of irregular capital calls and distributions."},{"id":20,"module":"LM 2","moduleTitle":"Performance and Returns","term":"What are the main limitations of IRR?","definition":"It can be sensitive to cash-flow timing, may produce multiple or misleading solutions, is harder to calculate, and embeds assumptions about financing, reinvestment, and opportunity cost."},{"id":21,"module":"LM 2","moduleTitle":"Performance and Returns","term":"What is multiple of invested capital (MOIC)?","definition":"MOIC = (realized value + unrealized residual value) / invested capital. It is easy to interpret as a money multiple but ignores how long the investment took to create that value."},{"id":22,"module":"LM 2","moduleTitle":"Performance and Returns","term":"How should IRR and MOIC be used together?","definition":"IRR measures the speed and timing of value creation; MOIC measures the amount of value created. A high MOIC over a very long period can have a modest IRR, while a quick exit can create a high IRR with a lower MOIC."},{"id":23,"module":"LM 2","moduleTitle":"Performance and Returns","term":"What is the leveraged return formula?","definition":"rL = r + (VB / VC)(r - rB), where r is the unleveraged asset return, VB is borrowed capital, VC is investor equity, and rB is the borrowing rate. Leverage magnifies both gains and losses."},{"id":24,"module":"LM 2","moduleTitle":"Performance and Returns","term":"What are Level 1, Level 2, and Level 3 fair-value inputs?","definition":"Level 1: quoted prices in active markets. Level 2: observable inputs other than direct quoted prices. Level 3: unobservable assumptions and models. Alternatives frequently rely on Level 3 inputs."},{"id":25,"module":"LM 2","moduleTitle":"Performance and Returns","term":"How do stale pricing and return smoothing affect reported performance?","definition":"Infrequent or model-based valuations delay recognition of market changes, which can understate volatility and correlation, inflate risk-adjusted performance, and exaggerate diversification benefits."},{"id":26,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Distinguish selection, survivorship, and backfill bias in alternative indexes.","definition":"Selection bias arises because reporting is voluntary. Survivorship bias excludes failed or discontinued funds. Backfill bias adds the favorable pre-entry history of successful funds. All can bias reported index returns upward."},{"id":27,"module":"LM 2","moduleTitle":"Performance and Returns","term":"How are fees calculated when management and performance fees are independent?","definition":"RGP = P1 × rm + max[0, (P1 - P0) × p]. Investor return = (P1 - P0 - RGP) / P0. Here P0 is beginning value, P1 ending value before fees, rm the management-fee rate, and p the performance-fee rate."},{"id":28,"module":"LM 2","moduleTitle":"Performance and Returns","term":"How are fees calculated when the performance fee is based on profit net of the management fee?","definition":"RGP = P1 × rm + max{0, [P1(1 - rm) - P0] × p}. Calculating the performance fee after the management fee produces a slightly higher net return for the investor than calculating both independently."},{"id":29,"module":"LM 2","moduleTitle":"Performance and Returns","term":"How is a hard hurdle incorporated into an after-fee calculation?","definition":"RGP = P1 × rm + max{0, [P1(1 - rm) - P0(1 + rh)] × p}, where rh is the hurdle rate. Only profit above the hurdle and after the management fee is eligible for the performance fee."},{"id":30,"module":"LM 2","moduleTitle":"Performance and Returns","term":"How does a high-water mark change the performance-fee calculation?","definition":"The performance fee applies only to value above the highest prior after-fee fund value: RGP = Pt × rm + max[0, Pt(1 - rm) - PHWM] × p. Losses must be recovered before new incentive fees are earned."},{"id":31,"module":"LM 2","moduleTitle":"Performance and Returns","term":"Distinguish a lockup period, notice period, redemption gate, and redemption fee.","definition":"A lockup restricts early withdrawals; a notice period requires advance redemption notice; a gate limits how much may be withdrawn at a time; and a redemption fee compensates the fund for costs or discourages short-term exits."},{"id":32,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What are the main private-equity strategies?","definition":"Leveraged buyouts, venture capital, and growth capital. They differ primarily by company life-cycle stage, ownership stake, use of leverage, business risk, and expected return."},{"id":33,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is an LBO, and how do MBO and MBI differ?","definition":"An LBO acquires a mature company using substantial debt placed in the target's capital structure. In an MBO, existing management participates; in an MBI, an outside management team is brought in."},{"id":34,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What are the main venture-capital financing stages?","definition":"Formative or pre-seed financing, seed financing, early-stage financing, later-stage financing, and mezzanine-stage or pre-IPO financing."},{"id":35,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"How do risk and required return change across VC stages?","definition":"Earlier-stage companies have greater product, market, financing, and execution uncertainty, so investors require higher expected returns. Later-stage companies have more operating evidence and generally lower required returns."},{"id":36,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is growth capital?","definition":"A usually minority equity investment in an established private company seeking funds to expand, enter new markets, make acquisitions, or strengthen its balance sheet without a full buyout."},{"id":37,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What are the primary drivers of private-equity returns?","definition":"Revenue and EBITDA growth, margin and operational improvement, debt repayment or deleveraging, and a change in the exit valuation multiple. Leverage magnifies the equity impact of each driver."},{"id":38,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What are the major private-equity exit routes?","definition":"Trade sale to a strategic buyer; public listing through an IPO, direct listing, or SPAC; sale to another financial sponsor; management buyout; recapitalization; or liquidation/write-off."},{"id":39,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What are the principal risks of private equity?","definition":"Illiquidity, leverage, long holding periods, operational and execution risk, uncertain exit timing, Level 3 valuation risk, limited transparency, concentration, and vintage-year exposure."},{"id":40,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is a fund's vintage year, and why diversify across vintages?","definition":"The vintage year is when fund deployment begins. Economic conditions and entry valuations differ across vintages, so committing across multiple years reduces dependence on one business-cycle or valuation environment."},{"id":41,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What are the major private-debt categories?","definition":"Direct lending, leveraged lending, venture debt, mezzanine debt, unitranche debt, and distressed debt. They span a continuum from senior secured income strategies to subordinated and restructuring-oriented strategies."},{"id":42,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is direct lending?","definition":"Non-bank lenders provide loans directly to companies, often as senior secured debt with negotiated covenants, amortization, and floating rates. Returns include interest, fees, and an illiquidity premium."},{"id":43,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is venture debt?","definition":"Debt financing for venture-backed start-ups or early-stage companies, commonly structured as a line of credit or term loan and often including warrants or other equity-linked compensation for high default risk."},{"id":44,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is mezzanine debt?","definition":"Subordinated private credit positioned below senior debt and above equity. It offers higher coupons and often an equity kicker, such as warrants, to compensate for lower priority and greater loss risk."},{"id":45,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is unitranche debt?","definition":"A single loan that combines senior and subordinated risk into one facility with one blended interest rate, simplifying the borrower's capital structure while giving the lender a return between senior and mezzanine debt."},{"id":46,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What is distressed-debt investing?","definition":"Purchasing debt of financially troubled, defaulted, restructuring, or bankrupt companies at a discount. Returns depend on recovery value, creditor priority, restructuring skill, and the ability to influence the workout."},{"id":47,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"How do private-debt risk and return generally rank?","definition":"Senior secured direct lending generally has the lowest private-debt risk and more stable income. Mezzanine, venture, and distressed debt have greater default, subordination, or restructuring risk and therefore higher expected returns."},{"id":48,"module":"LM 3","moduleTitle":"Private Capital: Equity and Debt","term":"What diversification can private capital provide, and what is the caveat?","definition":"It gives exposure to companies, life-cycle stages, and return drivers unavailable in public markets and may show lower measured correlation. However, appraisal smoothing can overstate diversification, and correlations and losses can rise during market stress."},{"id":49,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What features make real estate different from traded financial assets?","definition":"Properties are heterogeneous, fixed in location, long lived, fragmented across local markets, expensive and slow to transact, management intensive, and difficult to price continuously."},{"id":50,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the two main real-estate sectors?","definition":"Residential real estate and commercial real estate. Commercial property includes offices, retail centers, industrial facilities, warehouses, hotels, and other income-producing property."},{"id":51,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the two primary sources of real-estate equity return?","definition":"Rental or operating income and capital appreciation. Income is generally more stable through the cycle; appreciation is more sensitive to interest rates, market rents, occupancy, and capitalization rates."},{"id":52,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the main forms of real-estate investment?","definition":"Direct or indirect; public or private; equity or debt. Examples include direct property ownership, private funds, REITs, mortgages, mortgage REITs, and mortgage-backed securities."},{"id":53,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What is a REIT, and how do equity and mortgage REITs differ?","definition":"A REIT is a pooled vehicle that owns or finances income-producing real estate and may be public or private. Equity REITs own and operate property; mortgage REITs hold real-estate loans or mortgage securities. Tax rules vary by jurisdiction."},{"id":54,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"How do core, core-plus, value-add, and opportunistic real-estate strategies differ?","definition":"Risk generally increases from core to core-plus to value-add to opportunistic. Stable occupancy and income dominate core; renovation, leasing, redevelopment, development, or distress become increasingly important at higher-risk levels."},{"id":55,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Why can appraisal-based real-estate returns look unusually stable?","definition":"Properties are valued infrequently and appraisals adjust gradually, creating stale prices and return smoothing. Reported volatility and correlation may be understated relative to true economic risk."},{"id":56,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the major risks of real-estate investment?","definition":"Location and tenant risk, vacancy, lease rollover, operating and capital-expenditure needs, leverage, interest-rate and cap-rate changes, obsolescence, illiquidity, environmental and legal risk, and development or construction risk."},{"id":57,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What is infrastructure, and what are economic versus social infrastructure?","definition":"Infrastructure consists of capital-intensive, long-lived assets providing essential public services. Economic infrastructure includes transportation, energy, and utilities; social infrastructure includes schools, hospitals, and public-service facilities."},{"id":58,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the main forms of infrastructure investment?","definition":"Direct ownership, private infrastructure funds, listed infrastructure companies or funds, infrastructure debt or bonds, and public-private partnerships. Direct assets are concentrated and illiquid; listed vehicles offer greater liquidity."},{"id":59,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Compare greenfield, brownfield, and secondary-stage infrastructure.","definition":"Greenfield develops new assets and has the highest construction and demand risk. Brownfield expands or redevelops operating assets and has intermediate risk. Secondary-stage assets are fully operational, require little development, and generally have the lowest risk and return."},{"id":60,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are a public-private partnership and the build-operate-transfer model?","definition":"A PPP combines government and private capital or expertise to provide public infrastructure. In a BOT project, the private investor builds the asset, operates it under a concession, and later transfers or sells it according to agreed terms."},{"id":61,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the three common infrastructure revenue structures?","definition":"Availability payments compensate the operator for keeping the asset available and meeting standards; usage fees depend on volume, such as tolls; take-or-pay contracts require the customer to pay for a minimum amount regardless of actual use."},{"id":62,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the main return and diversification characteristics of infrastructure?","definition":"Returns are primarily long-term contractual or regulated income, with possible capital appreciation. Revenues may adjust with inflation or economic growth, and the assets can diversify portfolios because their cash-flow drivers differ from public stocks and bonds."},{"id":63,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"What are the major risks of infrastructure investing?","definition":"Construction and completion risk, demand or volume risk, operating risk, regulation and political intervention, concession renewal, counterparty risk, financing and interest-rate risk, currency risk, environmental risk, and technological obsolescence."},{"id":64,"module":"LM 5","moduleTitle":"Natural Resources","term":"How do natural-resource land investments differ from developed real estate?","definition":"Farmland, timberland, and raw land derive value from biological production, resource scarcity, development potential, or land appreciation rather than primarily from leases on developed buildings."},{"id":65,"module":"LM 5","moduleTitle":"Natural Resources","term":"What are the sources of return and risk for farmland?","definition":"Returns come from crop or lease income and land appreciation. Key risks include weather, water availability, crop disease, commodity prices, operating costs, government policy, and geographic concentration."},{"id":66,"module":"LM 5","moduleTitle":"Natural Resources","term":"Why is timberland described as both a factory and a warehouse?","definition":"Trees create biological growth like a factory, while harvest can often be delayed so timber remains stored 'on the stump' like inventory. Returns come from biological growth, timber prices, land value, and harvest timing."},{"id":67,"module":"LM 5","moduleTitle":"Natural Resources","term":"What drives raw-land returns?","definition":"Raw land usually produces little or no current income. Returns depend mainly on appreciation from scarcity, rezoning, development potential, resource discovery, infrastructure improvements, or growth in surrounding economic activity."},{"id":68,"module":"LM 5","moduleTitle":"Natural Resources","term":"What are hard and soft commodities?","definition":"Hard commodities are mined or extracted, such as oil, gold, and copper. Soft commodities are grown or raised, such as grains, coffee, sugar, and livestock."},{"id":69,"module":"LM 5","moduleTitle":"Natural Resources","term":"How can investors obtain commodity exposure?","definition":"Through physical ownership, spot or forward contracts, futures, swaps, commodity indexes and exchange-traded products, managed futures, or equity and debt securities of commodity producers."},{"id":70,"module":"LM 5","moduleTitle":"Natural Resources","term":"What is the commodity cost-of-carry relationship?","definition":"A useful approximation is F0(T) ≈ S0(1 + r + c - i)^T, where r is financing cost, c is storage and other carrying cost, and i is convenience yield. Higher carrying costs raise futures prices; higher convenience yield lowers them."},{"id":71,"module":"LM 5","moduleTitle":"Natural Resources","term":"What is convenience yield?","definition":"The non-cash benefit of having the physical commodity immediately available for production, delivery, or protection against shortages. It is high when inventories are scarce or operational need is strong."},{"id":72,"module":"LM 5","moduleTitle":"Natural Resources","term":"What are contango and backwardation?","definition":"Contango occurs when longer-dated futures prices exceed spot or near-term prices, often because carrying costs dominate. Backwardation occurs when near-term prices exceed longer-dated prices, often because convenience yield is high."},{"id":73,"module":"LM 5","moduleTitle":"Natural Resources","term":"What is roll yield for a long futures investor?","definition":"It is the gain or loss from replacing an expiring contract. It is generally positive when the new contract is cheaper in backwardation and negative when the new contract is more expensive in contango."},{"id":74,"module":"LM 5","moduleTitle":"Natural Resources","term":"What are the components and portfolio role of commodity-futures return?","definition":"Total return is commonly viewed as spot return + roll yield + collateral yield. Commodities may hedge unexpected inflation and diversify a portfolio, but results depend on the commodity, curve shape, investment vehicle, and market regime."},{"id":75,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What distinguishes hedge funds from other pooled vehicles?","definition":"They are private, lightly regulated vehicles defined mainly by investment approach rather than asset class. Managers may use leverage, derivatives, short selling, concentrated positions, and flexible mandates to seek absolute or risk-adjusted returns."},{"id":76,"module":"LM 6","moduleTitle":"Hedge Funds","term":"How do hedge funds differ from mutual funds and private-equity funds?","definition":"Compared with mutual funds, hedge funds have fewer constraints, less liquidity, and performance-based fees. Compared with private equity, they generally invest in more liquid securities, trade more frequently, and have shorter investment horizons."},{"id":77,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are the five broad hedge-fund strategy categories?","definition":"Equity hedge, event driven, relative value, opportunistic, and multi-manager."},{"id":78,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are the principal equity-hedge strategies?","definition":"Long/short equity buys undervalued securities and shorts overvalued ones; short-biased funds maintain net short exposure; market-neutral funds offset long and short positions to minimize net market beta and earn security-selection alpha."},{"id":79,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are the principal event-driven strategies?","definition":"Merger arbitrage, distressed investing, special situations, and activism. Merger arbitrage buys the target to capture the deal spread and may short the acquirer in a stock-for-stock transaction—not necessarily in a cash deal."},{"id":80,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are relative-value hedge-fund strategies?","definition":"They exploit pricing differences between related securities while limiting broad market exposure. Examples include convertible-bond arbitrage, fixed-income arbitrage, and multi-strategy relative value."},{"id":81,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are opportunistic hedge-fund strategies?","definition":"Global macro takes positions based on top-down economic, interest-rate, currency, or political views. Managed futures or CTAs systematically trade futures and forwards, often using trend-following models."},{"id":82,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What is a fund of hedge funds?","definition":"A vehicle that allocates to multiple hedge funds or strategies. It offers manager access and diversification with lower minimums, but adds another fee layer, reduces transparency, and may dilute the best managers' returns."},{"id":83,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are the three broad sources of hedge-fund return?","definition":"Market beta from broad asset exposure, strategy beta from systematic exposure specific to the strategy, and alpha from manager skill or security selection."},{"id":84,"module":"LM 6","moduleTitle":"Hedge Funds","term":"How do leverage and short selling affect hedge-fund risk?","definition":"Leverage magnifies gains, losses, margin calls, and forced liquidation risk. Short positions can lose more than the initial investment, face borrow recalls and short squeezes, and require continuous collateral management."},{"id":85,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What is liquidity mismatch in a hedge fund?","definition":"The fund offers investors redemption terms that are more liquid than the underlying assets. Heavy withdrawals may force sales at depressed prices, so funds use lockups, notice periods, gates, side pockets, or suspended redemptions."},{"id":86,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What other risks are important in hedge funds?","definition":"Counterparty, derivative, model, basis, operational, fraud, key-person, valuation, concentration, crowding, and tail risk. Complex strategies can show small steady gains followed by rare, severe losses."},{"id":87,"module":"LM 6","moduleTitle":"Hedge Funds","term":"What are the diversification and benchmarking caveats for hedge funds?","definition":"Strategy returns can have low normal-period correlation with traditional assets, but correlation and liquidity pressure may rise in crises. Benchmarks are difficult to construct and can be upward biased by voluntary reporting, survivorship, and backfill."},{"id":88,"module":"LM 7","moduleTitle":"Digital Assets","term":"What is distributed ledger technology (DLT), and how can finance use it?","definition":"DLT is a shared database replicated across network participants and secured by consensus and cryptography. Applications include payments, ownership records, tokenization, post-trade processing, compliance, custody, and smart contracts."},{"id":89,"module":"LM 7","moduleTitle":"Digital Assets","term":"What is a blockchain?","definition":"A form of DLT in which validated transactions are grouped into sequential blocks linked cryptographically, creating a difficult-to-alter record of prior transactions."},{"id":90,"module":"LM 7","moduleTitle":"Digital Assets","term":"How do proof of work and proof of stake differ?","definition":"Proof of work validates blocks through energy-intensive computational work performed by miners. Proof of stake selects validators based partly on assets committed or staked, generally using less energy but creating different governance and concentration risks."},{"id":91,"module":"LM 7","moduleTitle":"Digital Assets","term":"How do permissionless and permissioned networks differ?","definition":"Permissionless networks are open, decentralized, and allow broad participation in validation and record access. Permissioned networks restrict membership or activities, use more centralized governance, and can process transactions more efficiently."},{"id":92,"module":"LM 7","moduleTitle":"Digital Assets","term":"What are smart contracts and decentralized finance (DeFi)?","definition":"Smart contracts are programs that automatically execute agreed actions when conditions are met. DeFi combines open-source smart contracts into decentralized applications for trading, lending, payments, storage of value, and other financial services."},{"id":93,"module":"LM 7","moduleTitle":"Digital Assets","term":"What is the difference between a cryptocurrency and a crypto-token?","definition":"A cryptocurrency is the native unit of its own blockchain and may serve as a medium of exchange or store of value. A token is created on an existing blockchain and can represent ownership, access, voting rights, or another claim."},{"id":94,"module":"LM 7","moduleTitle":"Digital Assets","term":"What are the main types of digital assets?","definition":"Cryptocurrencies; stablecoins; central bank digital currencies; security, utility, and governance tokens; and non-fungible tokens. Their economic claims, legal rights, and valuation drivers differ substantially."},{"id":95,"module":"LM 7","moduleTitle":"Digital Assets","term":"How do stablecoins and CBDCs differ?","definition":"A stablecoin is privately issued and seeks to maintain a value linked to a fiat currency, commodity, or algorithmic mechanism. A CBDC is a digital form of central-bank money and represents a direct claim under the issuing monetary system."},{"id":96,"module":"LM 7","moduleTitle":"Digital Assets","term":"What are tokenization and NFTs?","definition":"Tokenization records ownership rights to a physical or financial asset on a distributed ledger, potentially enabling fractional ownership and faster transfer. An NFT is a unique, non-interchangeable token used to establish authenticity or ownership of a specific digital or physical item."},{"id":97,"module":"LM 7","moduleTitle":"Digital Assets","term":"How do centralized and decentralized cryptocurrency exchanges differ?","definition":"A centralized exchange is operated through private servers by an intermediary and may provide custody and order matching. A decentralized exchange uses distributed protocols and smart contracts, reducing single-point failure but often offering less investor protection and regulatory oversight."},{"id":98,"module":"LM 7","moduleTitle":"Digital Assets","term":"What are direct and indirect ways to invest in digital assets?","definition":"Direct investment includes buying coins or tokens and holding them in a wallet or exchange account. Indirect exposure includes futures, trusts, exchange-traded products, hedge funds, listed exchanges, miners, and blockchain-related companies."},{"id":99,"module":"LM 7","moduleTitle":"Digital Assets","term":"What are the main wallet and custody risks?","definition":"Loss or theft of private keys, phishing, hacking, exchange failure, poor operational controls, irreversible transfers, and uncertainty over legal ownership. Cold storage reduces online attack exposure but introduces physical and access risk."},{"id":100,"module":"LM 7","moduleTitle":"Digital Assets","term":"What are the risk, return, and diversification characteristics of digital assets?","definition":"Historically they have shown very high returns, extreme volatility, and relatively low correlations with traditional assets in some periods. Value is largely appreciation driven, while regulation, fraud, market manipulation, technology, concentration, custody, and changing correlations create substantial risk."}],"standard":[{"id":1,"difficulty":"standard","question":"Which investment is most accurately classified as an alternative investment?","options":{"A":"A publicly traded investment-grade bond fund","B":"A hedge fund that trades only listed equity securities","C":"A broad public equity index fund"},"answer":"B","explanation":"Hedge funds are classified as alternatives because of their private pooled structure and investment approach, even when the underlying holdings are traditional listed securities.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":2,"difficulty":"standard","question":"An investor with limited internal investment staff and little experience evaluating private assets is most likely to select:","options":{"A":"Fund investment.","B":"Co-investment.","C":"Direct investment."},"answer":"A","explanation":"Fund investment outsources sourcing, due diligence, asset management, and exit decisions. Direct and co-investment require greater internal capability.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":3,"difficulty":"standard","question":"Compared with fund investment, direct investment most likely provides:","options":{"A":"Greater control and greater internal operating requirements.","B":"Greater diversification and lower concentration risk.","C":"Lower control and higher external management fees."},"answer":"A","explanation":"Direct investors control asset selection, financing, and management but must supply the capital, staff, expertise, and governance themselves.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":4,"difficulty":"standard","question":"A private equity fund’s management fee during its investment period is most commonly based on:","options":{"A":"Committed capital.","B":"Realized profit.","C":"Year-end public market value."},"answer":"A","explanation":"Private equity fees are commonly charged on committed capital, whereas hedge fund management fees are normally charged on AUM.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":5,"difficulty":"standard","question":"Which provision most directly prevents a hedge fund manager from earning a second performance fee merely because the fund recovered from a prior loss?","options":{"A":"Catch-up clause","B":"High-water mark","C":"Capital call"},"answer":"B","explanation":"A high-water mark requires the fund to exceed the investor’s previous net peak before another incentive fee is charged.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":6,"difficulty":"standard","question":"A whole-of-fund waterfall is generally more protective of LPs because it:","options":{"A":"Pays the GP carried interest after each successful exit.","B":"Eliminates management fees.","C":"Returns aggregate contributed capital and the preferred return before carry is paid."},"answer":"C","explanation":"A European or whole-of-fund waterfall delays carry until LPs have recovered capital and the contractual preference at the fund level.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":7,"difficulty":"standard","question":"The J-curve effect most accurately describes:","options":{"A":"Initially negative private investment returns followed by later gains and distributions.","B":"A continuously declining commodity forward curve.","C":"A hedge fund’s use of increasing gross leverage."},"answer":"A","explanation":"Early fees, costs, and write-downs can make returns negative before portfolio maturation and exits generate gains.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":8,"difficulty":"standard","question":"Which return measure explicitly incorporates the timing of private investment cash flows?","options":{"A":"MOIC","B":"IRR","C":"Gross exposure"},"answer":"B","explanation":"IRR discounts irregular contributions and distributions through time. MOIC ignores when cash flows occur.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":9,"difficulty":"standard","question":"A private fund has invested $80 million. It has distributed $60 million and reports remaining unrealized value of $44 million. Its MOIC is closest to:","options":{"A":"1.05x.","B":"1.30x.","C":"1.55x."},"answer":"B","explanation":"MOIC = (60 + 44) / 80 = 104 / 80 = 1.30x.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":10,"difficulty":"standard","question":"Return smoothing caused by infrequent appraisals most likely results in:","options":{"A":"Understated measured volatility and correlation.","B":"Overstated measured volatility and correlation.","C":"Elimination of valuation uncertainty."},"answer":"A","explanation":"Stale or gradually adjusted valuations make reported returns appear more stable and less correlated with public markets than their economics warrant.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":11,"difficulty":"standard","question":"A fund begins reporting to a database only after two strong years and adds those two years of history. This most likely creates:","options":{"A":"Backfill bias.","B":"Duration bias.","C":"Look-through bias."},"answer":"A","explanation":"Backfill bias arises when favorable pre-inclusion returns are retroactively added to a database.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":12,"difficulty":"standard","question":"A company with stable cash flows, low existing leverage, and tangible assets is most likely suited for:","options":{"A":"A leveraged buyout.","B":"Pre-seed venture capital.","C":"A commodity index strategy."},"answer":"A","explanation":"LBO debt must be serviced from portfolio company cash flow, making stability and collateral desirable.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":13,"difficulty":"standard","question":"In a management buy-in:","options":{"A":"The existing management team acquires the company.","B":"An external management team participates in the acquisition and replaces or supplements management.","C":"A private debt lender converts a loan into equity automatically."},"answer":"B","explanation":"An MBI involves a new outside management team. An MBO involves the incumbent team.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":14,"difficulty":"standard","question":"Which financing instrument is most commonly associated with subordinated private debt and an equity kicker?","options":{"A":"Mezzanine debt","B":"Senior direct lending","C":"Commercial paper"},"answer":"A","explanation":"Mezzanine debt is subordinated and often includes warrants or conversion rights to raise potential return.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":15,"difficulty":"standard","question":"The principal purpose of venture debt is most likely to:","options":{"A":"Finance a mature buyout using the target’s assets as collateral.","B":"Extend a startup’s runway while reducing immediate equity dilution.","C":"Provide permanent common equity capital."},"answer":"B","explanation":"Venture debt supplies interim financing to young companies and delays the need for another equity round.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":16,"difficulty":"standard","question":"Vintage-year diversification is achieved by:","options":{"A":"Committing to private capital funds that begin investment in different years.","B":"Reclassifying a fund’s vintage after poor performance.","C":"Holding only funds formed during recessions."},"answer":"A","explanation":"Different vintages face different entry valuations, financing conditions, and exit markets.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":17,"difficulty":"standard","question":"A stabilized, well-leased property in a strong market is most consistent with which real estate strategy?","options":{"A":"Core","B":"Value-add","C":"Opportunistic"},"answer":"A","explanation":"Core real estate emphasizes existing income, quality locations, high occupancy, and limited redevelopment risk.","module":"LM 4","moduleTitle":"Real Estate and Infrastructure"},{"id":18,"difficulty":"standard","question":"Which infrastructure investment generally has the greatest construction and completion risk?","options":{"A":"Greenfield project","B":"Secondary operational asset","C":"Fully regulated brownfield utility with no expansion"},"answer":"A","explanation":"Greenfield assets have not yet been built and face planning, construction, financing, and ramp-up uncertainty.","module":"LM 4","moduleTitle":"Real Estate and Infrastructure"},{"id":19,"difficulty":"standard","question":"Payments made by a government because a facility is maintained and available for use are best described as:","options":{"A":"Availability payments.","B":"Spot payments.","C":"Residual payments."},"answer":"A","explanation":"Availability payments depend primarily on meeting service and availability standards rather than actual usage volume.","module":"LM 4","moduleTitle":"Real Estate and Infrastructure"},{"id":20,"difficulty":"standard","question":"A timberland manager’s ability to postpone harvest when timber prices are weak illustrates timberland’s:","options":{"A":"Factory-and-warehouse feature.","B":"Lack of biological growth.","C":"Requirement for annual liquidation."},"answer":"A","explanation":"Trees continue to grow while standing and can often be stored biologically until market conditions improve.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":21,"difficulty":"standard","question":"All else equal, an increase in convenience yield will most likely:","options":{"A":"Increase the commodity forward price.","B":"Decrease the commodity forward price.","C":"Leave the forward price unchanged."},"answer":"B","explanation":"Convenience yield is a benefit of physical ownership and therefore reduces the no- arbitrage forward price.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":22,"difficulty":"standard","question":"For a long-only commodity futures investor, persistent contango most likely produces:","options":{"A":"A favorable roll effect.","B":"An unfavorable roll effect.","C":"No difference between spot and futures returns."},"answer":"B","explanation":"The investor repeatedly sells a lower-priced expiring contract and buys a more expensive later contract, all else equal.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":23,"difficulty":"standard","question":"An equity market-neutral hedge fund primarily seeks to:","options":{"A":"Maintain large positive market beta.","B":"Earn security-selection returns while minimizing broad market exposure.","C":"Hold only government securities."},"answer":"B","explanation":"Market-neutral strategies offset market exposure but remain exposed to selection, factor, liquidity, and model risks.","module":"LM 6","moduleTitle":"Hedge Funds"},{"id":24,"difficulty":"standard","question":"A merger arbitrage fund commonly:","options":{"A":"Buys the acquisition target and may short the acquirer.","B":"Shorts both the target and acquirer.","C":"Buys only the acquirer after the deal closes."},"answer":"A","explanation":"The strategy seeks to earn the spread between the target’s trading price and the deal consideration while hedging stock consideration where appropriate.","module":"LM 6","moduleTitle":"Hedge Funds"},{"id":25,"difficulty":"standard","question":"A fund of hedge funds most likely offers:","options":{"A":"Manager diversification accompanied by an additional fee layer.","B":"Direct control over every underlying trade with no fees.","C":"Guaranteed daily liquidity."},"answer":"A","explanation":"A fund of funds can provide access and diversification but charges fees in addition to those of the underlying funds.","module":"LM 6","moduleTitle":"Hedge Funds"},{"id":26,"difficulty":"standard","question":"Which hedge fund term limits the amount investors may redeem during a particular period?","options":{"A":"Gate","B":"Hurdle rate","C":"Catch-up"},"answer":"A","explanation":"A gate caps redemptions to reduce forced liquidation. A lockup instead prevents redemption during an initial period.","module":"LM 6","moduleTitle":"Hedge Funds"},{"id":27,"difficulty":"standard","question":"Proof of work differs from proof of stake because proof of work primarily relies on:","options":{"A":"Computational mining.","B":"Fiat reserve custody.","C":"Government-approved validators only."},"answer":"A","explanation":"Proof of work uses computing power to solve cryptographic problems and validate blocks.","module":"LM 7","moduleTitle":"Digital Assets"},{"id":28,"difficulty":"standard","question":"A permissioned distributed ledger most likely:","options":{"A":"Restricts participation and validation to approved entities.","B":"Allows any person to validate anonymously without restrictions.","C":"Cannot be used by financial institutions."},"answer":"A","explanation":"Permissioned networks trade some decentralization for greater control, privacy, and compliance.","module":"LM 7","moduleTitle":"Digital Assets"},{"id":29,"difficulty":"standard","question":"Which digital asset is designed to maintain a value linked to an external reference such as a fiat currency?","options":{"A":"Stablecoin","B":"Governance token","C":"Non-fungible token"},"answer":"A","explanation":"Stablecoins use reserves, collateral, or algorithms to attempt to maintain a peg, although the peg can fail.","module":"LM 7","moduleTitle":"Digital Assets"},{"id":30,"difficulty":"standard","question":"Tokenization of a real estate asset most accurately:","options":{"A":"Eliminates the underlying property’s valuation and legal risks.","B":"Converts ownership rights into a digital form that may improve divisibility and transfer.","C":"Guarantees an active secondary market."},"answer":"B","explanation":"Tokenization changes the representation and transfer mechanism. It does not remove property risk, legal enforceability issues, or illiquidity.","module":"LM 7","moduleTitle":"Digital Assets"}],"advanced":[{"id":31,"difficulty":"advanced","question":"A hedge fund begins the year with NAV of $100 million and earns a 25% gross return. It charges a 2% management fee on year-end AUM and a 20% performance fee. The two fees are calculated independently. Total manager fees are closest to:","options":{"A":"$5.0 million.","B":"$7.5 million.","C":"$9.5 million."},"answer":"B","explanation":"Gross ending NAV is $125 million. Management fee = 125 x 2% = $2.5 million. Performance fee = (125 - 100) x 20% = $5.0 million. Total = $7.5 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":32,"difficulty":"advanced","question":"Using the facts in Question 31, if the performance fee is calculated net of the management fee, total manager fees are closest to:","options":{"A":"$7.0 million.","B":"$7.5 million.","C":"$8.0 million."},"answer":"A","explanation":"Management fee = $2.5 million. Net value before incentive fee = 125 x 0.98 = 122.5. Performance fee = (122.5 - 100) x 20% = $4.5 million. Total = $7.0 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":33,"difficulty":"advanced","question":"A fund begins with $100 million and ends before fees at $125 million. It charges a 2% management fee on year-end AUM, a 20% performance fee calculated net of management fees, and an 8% hard hurdle. Total fees are closest to:","options":{"A":"$4.0 million.","B":"$5.4 million.","C":"$7.0 million."},"answer":"B","explanation":"Management fee = 125 x 2% = 2.5. Net value before incentive = 125 x 0.98 = 122.5. Hurdle value = 100 x 1.08 = 108. Excess = 14.5. Performance fee = 14.5 x 20% = 2.9. Total fees = 2.5 + 2.9 = $5.4 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":34,"difficulty":"advanced","question":"A hedge fund’s investor-specific high-water mark is $110 million. The fund’s current gross value is $118 million. It charges a 1% management fee on year-end value and a 20% performance fee calculated after the management fee. Total fees are closest to:","options":{"A":"$1.18 million.","B":"$2.54 million.","C":"$2.78 million."},"answer":"B","explanation":"Management fee = 118 x 1% = 1.18. Value after management fee = 116.82. New value above HWM = 116.82 - 110 = 6.82. Performance fee = 6.82 x 20% = 1.364. Total = 1.18 + 1.364 = $2.544 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":35,"difficulty":"advanced","question":"A private fund makes a $100 million investment and receives cash flows of $30
