      const orderKey=`${ui.subject}:${ui.view}`; const order=ui.shuffled[orderKey];
      if(order){ const pos=new Map(order.map((k,i)=>[k,i]));deck.sort((a,b)=>(pos.get(a.key)??99999)-(pos.get(b.key)??99999)); }
      return deck;
    }
    function renderStudy(type){
      const deck=getDeck(type,ui.subject); if(type==='traps'&&!deck.length){renderPendingTraps();return;}
      const modules=modulesFor(ui.subject,type),filtered=filteredDeck();ui.index=clamp(ui.index,0,Math.max(0,filtered.length-1));const item=filtered[ui.index];
      const isQuestion=type==='standard'||type==='advanced';
      document.getElementById('mainPanel').innerHTML=`
        <div class="view-title-row"><div><h2 class="view-title">${TYPE_LABELS[type]}</h2><p class="view-subtitle">${APP_DATA.subjects[ui.subject].label} · ${deck.length} items</p></div>${item?`<span class="mastery-chip">Mastery ${pFor(item.key).mastery}%</span>`:''}</div>
        <div class="toolbar">
          <select id="moduleFilter"><option value="all">All Learning Modules</option>${modules.map(([m,t])=>`<option value="${esc(m)}" ${ui.module===m?'selected':''}>${esc(m)} · ${esc(t)}</option>`).join('')}</select>
          <select id="statusFilter"><option value="all">All</option><option value="unseen" ${ui.filter==='unseen'?'selected':''}>Unreviewed</option><option value="partial" ${ui.filter==='partial'?'selected':''}>Partially Confident</option>${isQuestion?`<option value="mistakes" ${ui.filter==='mistakes'?'selected':''}>Active Mistakes</option>`:''}</select>
          <button class="btn" id="shuffleButton">Shuffle</button><button class="btn" id="randomButton">Random</button>
        </div>
        <div class="progress-meta"><span>${filtered.length?`Item ${ui.index+1} of ${filtered.length}`:'No Items'}</span><span>${filtered.length?Math.round((ui.index+1)/filtered.length*100):0}% of the list</span></div><div class="progress-track"><div class="progress-bar" style="width:${filtered.length?(ui.index+1)/filtered.length*100:0}%"></div></div>
        <div class="study-stage" id="studyStage">${item?renderItemHTML(item,false):`<div class="empty">No items match this filter.</div>`}</div>
        ${item?renderNavigationHTML(item,false):''}<p class="status" id="statusText"></p>`;
      bindStudyEvents(item,filtered,false);
    }

    function renderItemHTML(item,daily){
      if(item.type==='standard'||item.type==='advanced') return renderQuestionHTML(item,daily);
      return renderCardHTML(item,daily);
    }
    function renderCardHTML(item,daily){
      const isTrap=item.type==='traps';const back=isTrap?`<div class="trap-copy"><strong>Trap</strong><br>${esc(item.trap)}<br><br><strong>Correct rule</strong><br>${esc(item.definition)}</div>`:`<p class="definition ${item.type==='formula'?'formula-text':''}">${esc(item.definition)}</p>`;
      return `<div class="card-scene"><article class="study-card ${ui.flipped?'flipped':''}" id="studyCard" tabindex="0" role="button">
        <section class="face front"><div class="card-top"><span>${esc(item.module)}</span><span>${TYPE_LABELS[item.type]}</span></div><div class="card-content"><div class="card-label">${isTrap?'Exam trap':item.type==='formula'?'Formula Name':'Question / Term'}</div><h2 class="term">${esc(item.term)}</h2></div><div class="card-hint">Click to reveal the answer</div></section>
        <section class="face back"><div class="card-top"><span>${esc(item.module)}</span><span>Answer</span></div><div class="card-content"><div class="card-label">${esc(item.term)}</div>${back}</div><div class="card-hint">Rate your confidence before continuing</div></section>
      </article></div>`;
    }
    function renderQuestionHTML(item,daily){
      return `<article class="question-card"><div class="question-body"><div class="card-top"><span>${esc(item.module)} · ${item.type==='advanced'?'Advanced':'Standard'}</span><span>Question ${item.id}</span></div><h2 class="question-text">${esc(item.question)}</h2>
        <div class="options">${Object.entries(item.options).map(([letter,text])=>{let c='option';if(ui.selected===letter)c+=' selected';if(ui.submitted&&letter===item.answer)c+=' correct';if(ui.submitted&&letter===ui.selected&&letter!==item.answer)c+=' incorrect';return `<button class="${c}" data-option="${letter}" ${ui.submitted?'disabled':''}><span class="option-letter">${letter}</span><span class="option-text">${esc(text)}</span></button>`}).join('')}</div>
        <div class="confidence-box"><p class="confidence-title">How confident are you before viewing the answer?</p><div class="confidence-buttons"><button class="btn confidence-choice sure ${ui.confidence==='sure'?'active':''}" data-confidence="sure" ${ui.submitted?'disabled':''}>Confident</button><button class="btn confidence-choice partial ${ui.confidence==='partial'?'active':''}" data-confidence="partial" ${ui.submitted?'disabled':''}>Partially Confident</button></div></div>
        <div class="feedback ${ui.submitted?'visible':''} ${ui.lastCorrect?'good':'bad'}">${ui.submitted?`<h3>${ui.lastCorrect?'Correct':'Incorrect'} · Answer ${item.answer}</h3><p>${esc(item.explanation)}</p>${!ui.lastCorrect&&ui.confidence==='sure'?'<div class="danger-note">High-priority mistake: you selected an incorrect answer while marked “Confident.” It was added to the Mistake Book as a high-confidence mistake.</div>':''}`:''}</div>
      </div></article>`;
    }
    function renderNavigationHTML(item,daily){
      const isQuestion=item.type==='standard'||item.type==='advanced';
      if(daily){
        if(isQuestion) return `<div class="navigation"><button class="btn" id="dailyExit">Exit</button><button class="btn primary main-action" id="mainAction" ${(!ui.selected||!ui.confidence||ui.submitted)?'disabled':''}>Check Answer</button><button class="btn" id="dailyNext" ${ui.submitted?'':'disabled'}>Next →</button></div>`;
        return `<div class="navigation"><button class="btn" id="dailyExit">Exit</button><button class="btn primary main-action" id="mainAction">${ui.flipped?'Hide Answer':'Show Answer'}</button><button class="btn" id="dailySkip">Skip →</button></div>${ui.flipped?`<div class="confidence-rating"><button class="btn success" data-rate="sure">Confident</button><button class="btn warning" data-rate="partial">Partially Confident</button></div>`:''}`;
      }
      if(isQuestion) return `<div class="navigation"><button class="btn" id="previousButton">← Previous</button><button class="btn primary main-action" id="mainAction" ${(!ui.selected||!ui.confidence||ui.submitted)?'disabled':''}>Check Answer</button><button class="btn" id="nextButton">Next →</button></div>`;
      return `<div class="navigation"><button class="btn" id="previousButton">← Previous</button><button class="btn primary main-action" id="mainAction">${ui.flipped?'Hide Answer':'Show Answer'}</button><button class="btn" id="nextButton">Next →</button></div>${ui.flipped?`<div class="confidence-rating"><button class="btn success" data-rate="sure">Confident</button><button class="btn warning" data-rate="partial">Partially Confident</button></div>`:''}`;
    }
    function bindStudyEvents(item,filtered,daily){
      if(!item) return;
      document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{if(ui.submitted)return;ui.selected=b.dataset.option;renderCurrent(item,daily);});
      document.querySelectorAll('[data-confidence]').forEach(b=>b.onclick=()=>{if(ui.submitted)return;ui.confidence=b.dataset.confidence;renderCurrent(item,daily);});
      const card=document.getElementById('studyCard');if(card)card.onclick=()=>{ui.flipped=!ui.flipped;renderCurrent(item,daily);};
      const main=document.getElementById('mainAction');if(main)main.onclick=()=>{if(item.type==='standard'||item.type==='advanced')submitCurrentQuestion(item,daily);else{ui.flipped=!ui.flipped;renderCurrent(item,daily);}};
      document.querySelectorAll('[data-rate]').forEach(b=>b.onclick=()=>rateCurrentCard(item,b.dataset.rate,daily));
      if(daily){
        const exit=document.getElementById('dailyExit');if(exit)exit.onclick=()=>{ui.view='dashboard';save();render();};
        const skip=document.getElementById('dailySkip');if(skip)skip.onclick=()=>advanceDaily(false);
        const next=document.getElementById('dailyNext');if(next)next.onclick=()=>advanceDaily(true);
      }else{
        const prev=document.getElementById('previousButton');if(prev)prev.onclick=()=>move(-1,filtered);
        const next=document.getElementById('nextButton');if(next)next.onclick=()=>move(1,filtered);
        const mf=document.getElementById('moduleFilter');if(mf)mf.onchange=e=>{ui.module=e.target.value;ui.index=0;resetQuestionUI();render();};
        const sf=document.getElementById('statusFilter');if(sf)sf.onchange=e=>{ui.filter=e.target.value;ui.index=0;resetQuestionUI();render();};
        const sh=document.getElementById('shuffleButton');if(sh)sh.onclick=()=>{const orderKey=`${ui.subject}:${ui.view}`;ui.shuffled[orderKey]=shuffle(filtered.map(x=>x.key));ui.index=0;resetQuestionUI();render();};
        const rb=document.getElementById('randomButton');if(rb)rb.onclick=()=>{if(filtered.length){ui.index=Math.floor(Math.random()*filtered.length);resetQuestionUI();render();}};
      }
    }
    function renderCurrent(item,daily){
      const stage=document.getElementById('studyStage');if(!stage)return;stage.innerHTML=renderItemHTML(item,daily);
      const oldNav=document.querySelector('.navigation');const oldRating=document.querySelector('.confidence-rating');if(oldNav)oldNav.outerHTML=renderNavigationHTML(item,daily);if(oldRating)oldRating.remove();
      bindStudyEvents(item,daily?[]:filteredDeck(),daily);
    }
    function resetQuestionUI(){ui.flipped=false;ui.selected=null;ui.confidence=null;ui.submitted=false;ui.lastCorrect=null;}
    function move(direction,filtered){if(!filtered.length)return;ui.index=(ui.index+direction+filtered.length)%filtered.length;resetQuestionUI();render();}
    function rateCurrentCard(item,confidence,daily){recordCard(item,confidence);toast(confidence==='sure'?'Marked as Confident.':'Marked as Partially Confident.');if(daily)advanceDaily(true);else{const f=filteredDeck();move(1,f);}}
    function submitCurrentQuestion(item,daily){if(!ui.selected||!ui.confidence||ui.submitted)return;ui.lastCorrect=recordQuestion(item,ui.selected,ui.confidence);ui.submitted=true;renderCurrent(item,daily);}

    function renderPendingTraps(){
      const subject=APP_DATA.subjects[ui.subject].label;
      document.getElementById('mainPanel').innerHTML=`<div class="view-title-row"><div><h2 class="view-title">Exam Traps</h2><p class="view-subtitle">${subject}</p></div><span class="mastery-chip">Pending</span></div><div class="placeholder"><h3>Section Ready — Content Pending</h3><p>The structure, filters, confidence tracking, Daily Review, and Dashboard are ready. ${subject} Exam Traps will be added when the corresponding material is provided.</p></div>`;
    }

    function renderMistakes(){
      const all=Object.values(progress.mistakes).filter(m=>m.subject===ui.subject);const modules=modulesFor(ui.subject);
      const list=all.filter(m=>(ui.mistakeStatus==='all'||(ui.mistakeStatus==='active'?!m.resolved:m.resolved))&&(ui.mistakeModule==='all'||findByKey(m.key)?.module===ui.mistakeModule)).sort((a,b)=>new Date(b.lastDate)-new Date(a.lastDate));
      document.getElementById('mainPanel').innerHTML=`<div class="view-title-row"><div><h2 class="view-title">Automatic Mistake Book</h2><p class="view-subtitle">Every incorrect answer is recorded; a later correct answer marks it as resolved.</p></div><span class="mastery-chip">${all.filter(m=>!m.resolved).length} active</span></div>
        <div class="mistake-controls"><select id="mistakeStatus"><option value="active" ${ui.mistakeStatus==='active'?'selected':''}>Active Mistakes</option><option value="resolved" ${ui.mistakeStatus==='resolved'?'selected':''}>Resolved</option><option value="all" ${ui.mistakeStatus==='all'?'selected':''}>All</option></select><select id="mistakeModule"><option value="all">All Learning Modules</option>${modules.map(([m,t])=>`<option value="${esc(m)}" ${ui.mistakeModule===m?'selected':''}>${esc(m)} · ${esc(t)}</option>`).join('')}</select><button class="btn danger" id="clearResolved">Delete Resolved</button></div>
        <div class="mistake-list">${list.length?list.map(renderMistakeCard).join(''):`<div class="empty">No mistakes match this filter.</div>`}</div>`;
      document.getElementById('mistakeStatus').onchange=e=>{ui.mistakeStatus=e.target.value;render();};document.getElementById('mistakeModule').onchange=e=>{ui.mistakeModule=e.target.value;render();};
      document.getElementById('clearResolved').onclick=()=>{if(confirm('Delete all resolved mistakes from the log?')){Object.keys(progress.mistakes).forEach(k=>{if(progress.mistakes[k].resolved)delete progress.mistakes[k];});save();render();}};
      document.querySelectorAll('[data-practice]').forEach(b=>b.onclick=()=>openItem(b.dataset.practice));
    }
    function renderMistakeCard(m){
      const item=findByKey(m.key);if(!item)return'';return `<article class="mistake-card ${m.dangerous&&!m.resolved?'dangerous':''}"><div class="mistake-head"><strong>${esc(item.module)} · ${TYPE_LABELS[item.type]}</strong><span class="badge ${m.resolved?'resolved':'active'}">${m.resolved?'Resolved':m.dangerous?'High-Confidence Mistake':'Active'}</span></div><p class="mistake-question">${esc(item.question)}</p><div class="mistake-detail"><span><strong>Your Last Answer:</strong> ${esc(m.lastSelected)} · ${esc(item.options[m.lastSelected]||'')}</span><span><strong>Correct Answer:</strong> ${item.answer} · ${esc(item.options[item.answer])}</span><span><strong>Explanation:</strong> ${esc(item.explanation)}</span><span><strong>Recorded Mistakes:</strong> ${m.count}</span></div><div class="mistake-actions"><button class="btn info small" data-practice="${m.key}">Practice Now</button></div></article>`;
    }
    function openItem(key){const item=findByKey(key);if(!item)return;ui.subject=item.subject;ui.view=item.type;ui.module='all';ui.filter='all';resetQuestionUI();const deck=filteredDeck();ui.index=Math.max(0,deck.findIndex(x=>x.key===key));save();render();}

    function candidateScore(item){
      const p=progress.items[item.key],m=progress.mistakes[item.key];let score=Math.random()*15;
      if(m&&!m.resolved)score+=220+Math.min(40,m.count*8);if(p?.lastResult===false)score+=90;if(p?.lastConfidence==='partial')score+=70;if(!p?.seen)score+=38;
      if(p?.lastReviewed){score+=Math.min(35,(Date.now()-new Date(p.lastReviewed).getTime())/86400000);}else score+=20;
      return score;
    }
    function startDailyReview(scope='all',size=25){
      const subjects=scope==='current'?[ui.subject]:Object.keys(APP_DATA.subjects);const quotas={formula:.16,flashcards:.24,standard:.24,advanced:.16,traps:.20};let keys=[];
      for(const [type,ratio] of Object.entries(quotas)){
        const pool=subjects.flatMap(s=>getDeck(type,s).map(x=>attach(x,s,type))).sort((a,b)=>candidateScore(b)-candidateScore(a));const take=Math.max(1,Math.round(size*ratio));keys.push(...pool.slice(0,take).map(x=>x.key));
      }
      keys=[...new Set(keys)];if(keys.length<size){const used=new Set(keys),pool=subjects.flatMap(getAllItems).filter(x=>!used.has(x.key)).sort((a,b)=>candidateScore(b)-candidateScore(a));keys.push(...pool.slice(0,size-keys.length).map(x=>x.key));}
      keys=shuffle(keys).slice(0,size);ui.daily={date:today(),scope,keys,index:0,completed:0,correct:0,incorrect:0,sure:0,partial:0,skipped:0};ui.view='daily';resetQuestionUI();save();render();
    }
    function currentDailyItem(){return ui.daily?.keys?.[ui.daily.index]?findByKey(ui.daily.keys[ui.daily.index]):null;}
    function dailyRecord(result){if(!ui.daily)return;ui.daily.completed++;if(result.confidence)ui.daily[result.confidence]++;if(result.correct===true)ui.daily.correct++;if(result.correct===false)ui.daily.incorrect++;save();}
    function advanceDaily(recorded){if(!ui.daily)return;if(!recorded)ui.daily.skipped++;ui.daily.index++;resetQuestionUI();if(ui.daily.index>=ui.daily.keys.length)finishDaily();else{save();render();}}
    function finishDaily(){const summary={date:isoNow(),scope:ui.daily.scope,total:ui.daily.keys.length,completed:ui.daily.completed,correct:ui.daily.correct,incorrect:ui.daily.incorrect,sure:ui.daily.sure,partial:ui.daily.partial,skipped:ui.daily.skipped};progress.daily.sessions=(progress.daily.sessions||[]).slice(-59);progress.daily.sessions.push(summary);ui.daily={...ui.daily,finished:true};progress.daily.active=null;save();render();}
    function renderDaily(){
      if(!ui.daily){startDailyReview('all',25);return;}if(ui.daily.finished){
        const qTotal=ui.daily.correct+ui.daily.incorrect,acc=Math.round(ui.daily.correct/Math.max(1,qTotal)*100);document.getElementById('mainPanel').innerHTML=`<div class="daily-complete"><div class="big">${ui.daily.completed}</div><h2>Daily Review Complete</h2><p class="view-subtitle">Question Accuracy ${acc}% · Confident ${ui.daily.sure} · Partially Confident ${ui.daily.partial} · Skipped ${ui.daily.skipped}</p><button class="btn primary" id="finishReviewButton">Return to Dashboard</button></div>`;document.getElementById('finishReviewButton').onclick=()=>{ui.daily=null;ui.view='dashboard';save();render();};return;
      }
      const item=currentDailyItem();if(!item){finishDaily();return;}const pct=Math.round((ui.daily.index+1)/ui.daily.keys.length*100);
      document.getElementById('mainPanel').innerHTML=`<div class="view-title-row"><div><h2 class="view-title">Daily Review</h2><p class="view-subtitle">${APP_DATA.subjects[item.subject].label} · ${TYPE_LABELS[item.type]} · ${item.module}</p></div><span class="mastery-chip">${ui.daily.index+1}/${ui.daily.keys.length}</span></div><div class="daily-progress"><span>Adaptive Priority</span><span>${pct}%</span></div><div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div><div class="study-stage" id="studyStage">${renderItemHTML(item,true)}</div>${renderNavigationHTML(item,true)}<p class="status" id="statusText"></p>`;
      bindStudyEvents(item,[],true);
    }

    function renderSide(){
      const m=subjectMetrics(ui.subject),active=Object.values(progress.mistakes).filter(x=>x.subject===ui.subject&&!x.resolved).length,dangerous=Object.values(progress.mistakes).filter(x=>x.subject===ui.subject&&!x.resolved&&x.dangerous).length;
      const sessions=progress.daily.sessions||[],last=sessions.at(-1);const totalAttempts=Object.entries(progress.items).filter(([k])=>k.startsWith(ui.subject+':')).reduce((a,[,p])=>a+(p.attempts||0),0);
      document.getElementById('sidePanel').innerHTML=`<h2 class="side-title">${APP_DATA.subjects[ui.subject].label} Progress</h2><div class="stat-grid"><div class="stat"><span class="stat-value">${m.mastery}%</span><span class="stat-label">Overall Mastery</span></div><div class="stat"><span class="stat-value">${m.coverage}%</span><span class="stat-label">Coverage</span></div><div class="stat"><span class="stat-value">${m.accuracy}%</span><span class="stat-label">Accuracy</span></div><div class="stat"><span class="stat-value">${m.sureRate}%</span><span class="stat-label">“Confident” Ratings</span></div></div>
        <div class="side-section"><h3 class="side-title">Mistake Book</h3><div class="mini-row"><span>Active Mistakes</span><strong>${active}</strong></div><div class="mini-row"><span>High-Confidence Mistakes</span><strong>${dangerous}</strong></div><div class="mini-row"><span>Total Attempts</span><strong>${totalAttempts}</strong></div></div>
        <div class="side-section"><h3 class="side-title">Daily Review</h3><div class="mini-row"><span>Completed Sessions</span><strong>${sessions.length}</strong></div><div class="mini-row"><span>Last Session</span><strong>${last?new Date(last.date).toLocaleDateString('en-US'):'—'}</strong></div></div>
        <div class="side-section"><h3 class="side-title">Confidence tracking</h3><p class="view-subtitle">“Confident” requires clear recall. “Partially Confident” keeps the item prioritized in Daily Review.</p></div>`;
    }

    function exportProgress(){
      const payload={...progress,exportedAt:isoNow()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CFA_Study_App_Progress_${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Progress exported.');
    }
    function importProgress(file){
      const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=="CFA Level I Study App"||!obj.items||!obj.mistakes)throw new Error('Unrecognized file format');if(!confirm('Importing will replace your current progress. Continue?'))return;progress={...blankProgress(),...obj,version:APP_VERSION};progress.items=obj.items||{};progress.mistakes=obj.mistakes||{};progress.daily=obj.daily||{sessions:[],active:null};ui.daily=progress.daily.active||null;save();toast('Progress imported successfully.');render();}catch(e){alert('The file could not be imported: '+e.message);}};reader.readAsText(file);
    }
    function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function esc(value){return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    let toastTimer;function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}

    document.getElementById('dailyTopButton').onclick=()=>startDailyReview('all',25);
    document.getElementById('exportButton').onclick=exportProgress;
    document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(f)importProgress(f);e.target.value='';};
    document.addEventListener('keydown',e=>{
      if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
      if(ui.view==='daily'||Object.keys(TYPE_LABELS).includes(ui.view)){
        const item=ui.view==='daily'?currentDailyItem():filteredDeck()[ui.index];if(!item)return;
        if(e.key==='ArrowLeft'&&ui.view!=='daily')move(-1,filteredDeck());else if(e.key==='ArrowRight'&&ui.view!=='daily')move(1,filteredDeck());
        else if(!(item.type==='standard'||item.type==='advanced')&&e.code==='Space'){e.preventDefault();ui.flipped=!ui.flipped;renderCurrent(item,ui.view==='daily');}
        else if((item.type==='standard'||item.type==='advanced')&&!ui.submitted){const k=e.key.toUpperCase();if(['A','B','C'].includes(k)){ui.selected=k;renderCurrent(item,ui.view==='daily');}else if(e.key==='1'||e.key==='2'){ui.confidence=e.key==='1'?'sure':'partial';renderCurrent(item,ui.view==='daily');}else if(e.key==='Enter')submitCurrentQuestion(item,ui.view==='daily');}
      }
    });

    load();render();
  </script>
</body>
</html>
