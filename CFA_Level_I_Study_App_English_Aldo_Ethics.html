million, $40 million, and $50 million at the ends of Years 1, 2, and 3, respectively. The IRR is closest to:","options":{"A":"5.7%.","B":"8.9%.","C":"12.0%."},"answer":"B","explanation":"Enter CF0 = -100, C01 = 30, C02 = 40, and C03 = 50 in the BA II Plus Professional cash flow worksheet. IRR CPT gives approximately 8.90%.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":36,"difficulty":"advanced","question":"An investor contributes $120 million and borrows $60 million at 5%. The combined portfolio earns 11% before financing cost. The investor’s leveraged return is closest to:","options":{"A":"11%.","B":"14%.","C":"17%."},"answer":"B","explanation":"Leveraged return = 11% + (60 / 120) × (11% − 5%) = 14%.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":37,"difficulty":"advanced","question":"A private debt fund has a $78 million mortgage secured by property currently worth $96 million. The loan covenant requires a maximum LTV of 75%. The required debt paydown is closest to:","options":{"A":"$4 million.","B":"$6 million.","C":"$8 million."},"answer":"B","explanation":"Maximum permitted loan = 96 x 75% = $72 million. Required paydown = 78 - 72 = $6 million.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":38,"difficulty":"advanced","question":"A commodity has a spot price of $80. The annual continuously compounded risk-free rate is 3%, carrying costs are 4%, convenience yield is 2%, and maturity is one year. The forward price is closest to:","options":{"A":"$76.10.","B":"$80.00.","C":"$84.10."},"answer":"C","explanation":"F0=80e (0.03+0.04−0.02)=80e 0.05≈80 (1.05127)=84.10. Carry exceeds convenience yield, so the market is in contango.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":39,"difficulty":"advanced","question":"A long commodity index position earns a 9% spot return, a 3% collateral return, and a -6% roll return. Before fees, total return is closest to:","options":{"A":"0%.","B":"6%.","C":"18%."},"answer":"B","explanation":"Approximate total return = spot return + collateral return + roll return = 9% + 3% - 6% = 6%.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":40,"difficulty":"advanced","question":"A real estate fund invests $100 million and sells its only property one year later for $150 million. The waterfall provides an 8% soft hurdle, 20% carried interest, and a full catch-up. Ignoring management fees, the GP distribution is:","options":{"A":"$8.4 million.","B":"$10.0 million.","C":"$12.5 million."},"answer":"B","explanation":"LP first receives $100 million capital and $8 million preferred return. GP receives a $2 million catch-up so it owns 20% of the first $10 million of profit. Remaining proceeds are $40 million, split 80/20, giving another $8 million to GP. Total GP = $10 million, equal to 20% of the $50 million total profit.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":41,"difficulty":"advanced","question":"Using the facts in Question 40, assume instead an 8% hard hurdle with no catch-up. The GP distribution is:","options":{"A":"$8.4 million.","B":"$10.0 million.","C":"$12.0 million."},"answer":"A","explanation":"After $100 million capital and $8 million hurdle, excess profit is $42 million. GP receives 20% x 42 = $8.4 million.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":42,"difficulty":"advanced","question":"A deal-by-deal private equity fund earns a $15 million profit on its first investment and pays the GP 20% carry. A second investment later loses $11 million. Ignoring other terms, the whole-fund carry should be $0.8 million. The clawback amount is closest to:","options":{"A":"$0.8 million.","B":"$2.2 million.","C":"$3.0 million."},"answer":"B","explanation":"Initial carry = 15 x 20% = $3.0 million. Aggregate profit = 15 - 11 = $4 million. Correct whole-fund carry = 4 x 20% = $0.8 million. Clawback = 3.0 - 0.8 = $2.2 million.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":43,"difficulty":"advanced","question":"An investor can invest directly in a hedge fund earning 18% before fees under a “2 and 20” structure, with both fees independently calculated on beginning AUM and profit. Alternatively, a fund of funds invests in that hedge fund and charges an additional “1 and 10” on beginning AUM and its net profit. The investor’s return through the fund of funds is closest to:","options":{"A":"10.16%.","B":"12.40%.","C":"14.40%."},"answer":"A","explanation":"Underlying hedge fund net return = 18% - 2% - (18% x 20%) = 12.4%. Fund of funds fees = 1% + (12.4% x 10%) = 2.24%. Investor return = 12.4% - 2.24% = 10.16%.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":44,"difficulty":"advanced","question":"A private company has negative free cash flow but expects another equity financing round within 12 months. It wants to extend its runway without issuing common shares today. The most appropriate financing is:","options":{"A":"Venture debt.","B":"Senior syndicated investment-grade bonds.","C":"A dividend recapitalization."},"answer":"A","explanation":"Venture debt is designed for young companies that need interim financing and want to postpone equity dilution. It usually relies on future financing or business progress for repayment.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":45,"difficulty":"advanced","question":"An infrastructure investor wants the lowest demand risk. Which asset is most appropriate?","options":{"A":"A greenfield toll road paid solely from traffic volume","B":"A completed hospital receiving government availability payments","C":"An uncontracted merchant power plant"},"answer":"B","explanation":"Availability payments depend on making the facility available and meeting performance standards, not on end-user volume. Construction is already complete, further reducing risk.","module":"LM 4","moduleTitle":"Real Estate and Infrastructure"},{"id":46,"difficulty":"advanced","question":"A venture investor expects a company to move toward an IPO and wants downside priority while preserving the ability to participate in upside. The most suitable security is:","options":{"A":"Convertible preferred stock.","B":"Unsecured trade credit.","C":"Nonconvertible senior bank debt."},"answer":"A","explanation":"Convertible preferred stock combines liquidation preference and contractual protections with the option to convert into common equity.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":47,"difficulty":"advanced","question":"A hedge fund has 140% long exposure and 90% short exposure. Its gross and net exposures are, respectively:","options":{"A":"50% and 230%.","B":"230% and 50%.","C":"140% and 90%."},"answer":"B","explanation":"Gross exposure = 140% + 90% = 230%. Net exposure = 140% - 90% = 50% long.","module":"LM 6","moduleTitle":"Hedge Funds"},{"id":48,"difficulty":"advanced","question":"Two investors enter the same hedge fund at different dates. The fund has a high-water-mark provision. Compared with the earlier investor, the new investor most likely:","options":{"A":"Automatically inherits the earlier investor’s lower high-water mark.","B":"Has an investor-specific high-water mark based on the new entry value.","C":"Is exempt from all performance fees until the fund’s liquidation."},"answer":"B","explanation":"High-water marks are investor-specific. A new investor generally begins with a high- water mark related to the entry NAV and may therefore pay incentive fees while an older investor remains below a higher prior peak.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":49,"difficulty":"advanced","question":"A stablecoin is fully backed by short-term securities, but investors cannot verify reserve ownership and redemptions are temporarily suspended. The most immediate risks are:","options":{"A":"Reserve transparency and liquidity risk.","B":"Biological growth and harvest risk.","C":"Merger completion and short-squeeze risk."},"answer":"A","explanation":"Even apparently high-quality reserves do not protect holders if ownership, custody, reporting, and redemption mechanisms are uncertain.","module":"LM 7","moduleTitle":"Digital Assets"},{"id":50,"difficulty":"advanced","question":"A large pension fund has extensive private-market staff. It wants to retain a diversified primary fund relationship but invest additional capital only in selected transactions at reduced fees. The most appropriate method is:","options":{"A":"Co-investment.","B":"A public index fund.","C":"A complete replacement of the fund relationship with an unmanaged direct portfolio."},"answer":"A","explanation":"Co-investment allows an experienced LP to invest directly alongside the GP in selected assets, often with lower fees, while maintaining the diversified fund relationship.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"}],"traps":[]}},"ethics":{"label":"Ethics","shortLabel":"Ethics","subtitle":"CFA Level I 2027 · Ethics","data":{"formula":[{"id":1,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"Universal Ethical Decision Framework","definition":"Identify: relevant facts, stakeholders, duties, applicable laws and Standards, and conflicts.\n\nConsider: situational pressures, missing facts, guidance, alternatives, and consequences.\n\nDecide and act: implement the most ethical permissible action.\n\nReflect: compare the outcome with the intended result and improve the process.\n\nPriority principle: identify every Standard that may apply."},{"id":2,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Applicable-Law Rule — Standard I(A)","definition":"Applicable requirement = the most restrictive applicable requirement.\n\nIf local law is stricter, follow local law. If the Code and Standards are stricter, follow them. If no law applies, follow the Code and Standards. For an ongoing violation, do not participate or assist and dissociate."},{"id":3,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"Material Nonpublic Information Decision Rule","definition":"Public information: may analyze and trade, whether material or nonmaterial.\n\nNonpublic and nonmaterial information: may analyze and may use as part of a mosaic, provided the conclusion is not based on material nonpublic information.\n\nMaterial nonpublic information: do not act or cause others to act."},{"id":4,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Gifts, Compensation, and Referral Fees","definition":"Lavish third-party benefit that could compromise objectivity: refuse; disclosure alone may not cure the issue.\n\nToken third-party gift: generally acceptable if immaterial and not intended to influence.\n\nAdditional compensation or outside work that may conflict: obtain written consent from all parties before accepting.\n\nReferral fee: disclose its nature and value, as appropriate, before the formal engagement."},{"id":5,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"Priority of Interests and Transactions","definition":"Market integrity and law cannot be overridden by a client instruction.\n\nSubject to that constraint, general priority is: client interests, employer interests in employment matters, then personal interests.\n\nTrade priority under VI(B): client and employer transactions before transactions in which the member or candidate is a beneficial owner."},{"id":6,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Fair Dealing and Trade Allocation","definition":"Fair does not mean identical. Give affected clients a fair opportunity to act.\n\nDifferent disclosed service levels are permitted if they do not create an unfair trading advantage.\n\nUse a pre-established, objective allocation method for oversubscribed or partially filled trades. Personal beneficial accounts must not receive scarce allocations ahead of clients."},{"id":7,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Suitability Decision Rule — Standard III(C)","definition":"Advisory relationship: obtain and update client information; assess objectives, constraints, risk tolerance, and suitability in total-portfolio context and against the IPS.\n\nStated mandate or strategy: invest consistently with the mandate.\n\nUnsolicited unsuitable request: explain and document the conflict. If immaterial, execution may be considered under firm policy; if material, update the IPS or decline the trade."},{"id":8,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Confidentiality Decision Rule — Standard III(E)","definition":"Preserve confidentiality unless the information concerns illegal client activity, disclosure is required by law, or the client or prospective client permits disclosure.\n\nFollow stricter applicable law and share information internally only with people who have a legitimate need to know."},{"id":9,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"Leaving an Employer — Standard IV(A)","definition":"Permitted before departure: financial and logistical preparation, leasing office space, forming a company, arranging financing, and accepting another position.\n\nProhibited before departure: soliciting clients, taking client lists or proprietary work, diverting opportunities, reducing service, or misusing confidential information.\n\nAfter departure, general skill, experience, and public information may be used."},{"id":10,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"Research, Communication, and Records","definition":"V(A): investigate thoroughly; understand third-party research and model assumptions; a bad outcome is not itself a violation.\n\nV(B): disclose services and costs, the basic process, material risks and limitations, and significant changes; distinguish fact from opinion.\n\nV(C): maintain supporting records. If no stricter rule applies, CFA Institute recommends at least seven years."},{"id":11,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"Conflict Disclosure Rule — Standard VI(A)","definition":"Best practice is to avoid a conflict. If avoidance is not reasonable, make full and fair disclosure that is prominent, specific, in plain language, timely, effective, and updated when circumstances change.\n\nDisclosure does not legitimize conduct that must be avoided, such as fraud, market manipulation, misuse of MNPI, or a benefit that compromises objectivity."},{"id":12,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"CFA Program and Designation Rules","definition":"Acceptable: “Jane Doe, CFA” while active; “Passed Level I of the CFA Program”; “Candidate in the CFA Program” only when accurately enrolled or awaiting results.\n\nNot acceptable: using CFA as a noun or altered designation, claiming a partial designation, implying superior performance, or revealing specific questions, formulas, or broad topic coverage from an exam."},{"id":13,"module":"LM 10","moduleTitle":"Introduction to GIPS","term":"GIPS Quick Rules","definition":"Compliance is voluntary, but any claim requires complete, firmwide compliance—never partial compliance.\n\nA composite groups portfolios managed to a similar strategy, objective, or mandate. Assign portfolios before performance is known.\n\nVerification is optional, independent, and firmwide; it does not guarantee every number. Only investment management firms managing actual assets may claim compliance."},{"id":14,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Most-Tested Numbers and Words","definition":"7 years: recommended record-retention period when no stricter requirement exists.\n\nWritten consent from all parties: additional compensation arrangements.\n\nBefore engagement: referral-fee disclosure.\n\nMost restrictive: law-versus-Standards rule.\n\nIntent to mislead: central to market manipulation.\n\nFirmwide and fully compliant: valid GIPS claim."}],"flashcards":[{"id":1,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What is ethics?","definition":"Ethics is a set of shared beliefs about acceptable behavior and the study of how to make good choices based on moral principles."},{"id":2,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What distinguishes a profession from an ordinary occupation?","definition":"A profession has specialized knowledge, high entry standards, ethical and professional standards, continuing education, monitoring of conduct, and a commitment to serve clients and society."},{"id":3,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"Why are high ethical standards especially important in investment management?","definition":"Investment services are intangible and clients entrust professionals with wealth. Trust supports capital formation, lowers financing costs, and improves the allocation of capital."},{"id":4,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"How does a code of ethics differ from standards of conduct?","definition":"A code states broad ethical principles. Standards of conduct translate those principles into minimum requirements and guidance for specific professional behavior."},{"id":5,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"Which situational influences commonly challenge ethical behavior?","definition":"Social pressure, loyalty to colleagues or supervisors, large financial rewards, prestige, short-term incentives, and a rules-only compliance culture."},{"id":6,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What is ethical overconfidence?","definition":"People tend to overrate the ethical quality of their own behavior and overemphasize personal character while underestimating situational pressures."},{"id":7,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"How do ethical standards compare with legal standards?","definition":"Ethical standards often require more judgment and may be stricter than law. An action can be legal but unethical, and in limited cases an illegal act may be viewed as ethical."},{"id":8,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What are the four phases of the ethical decision-making framework?","definition":"Identify relevant facts, stakeholders, duties, principles, and conflicts; consider situational influences, guidance, and alternatives; decide and act; then reflect on the outcome and lessons learned."},{"id":9,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What are the first three principles of the CFA Institute Code of Ethics?","definition":"Act with integrity, competence, diligence, respect, and ethics; place the integrity of the profession and client interests above personal interests; use reasonable care and independent professional judgment."},{"id":10,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What are the final three principles of the CFA Institute Code of Ethics?","definition":"Practice and encourage ethical professionalism; promote the integrity and viability of global capital markets for society; maintain and improve personal and industry competence."},{"id":11,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What are the seven Standards of Professional Conduct?","definition":"I Professionalism; II Integrity of Capital Markets; III Duties to Clients; IV Duties to Employers; V Investment Analysis, Recommendations, and Actions; VI Conflicts of Interest; VII Responsibilities as a CFA Institute Member or CFA Candidate."},{"id":12,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"Who is responsible for the Professional Conduct Program?","definition":"The CFA Institute Board of Governors has overall responsibility. Professional Conduct staff investigate cases, and the Disciplinary Review Committee and its panels review and enforce contested or agreed matters."},{"id":13,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What can trigger a Professional Conduct inquiry?","definition":"Self-disclosure; a written complaint; public information such as media or regulatory notices; testing-center or proctor reports; and CFA Institute analysis of exam scores/materials or online and social media activity."},{"id":14,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What can happen after a Professional Conduct inquiry begins?","definition":"Staff may request a written explanation, interview the subject and third parties, and collect records. The matter may close without sanction, end with a cautionary letter, or proceed to discipline."},{"id":15,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What sanctions may CFA Institute impose?","definition":"Public censure; suspension of membership and use of the CFA designation; revocation of membership and the right to use the designation; or suspension/prohibition from further CFA Program participation."},{"id":16,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Under Standard I(A), which rule applies when requirements conflict?","definition":"Follow the strictest applicable requirement among relevant law, regulation, professional rules, and the Code and Standards. When no law applies, follow the Code and Standards."},{"id":17,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"What must a member or candidate do after discovering an ongoing violation?","definition":"Do not participate or assist, and dissociate from the activity. Internal reporting is usually appropriate and external reporting may be required by law, but the Standard's mandatory action is dissociation."},{"id":18,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"How are gifts from clients treated?","definition":"A gift for past performance may be accepted if it does not compromise objectivity and is disclosed to the employer. Compensation tied to future performance requires prior written consent under Standard IV(B)."},{"id":19,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"How are gifts or benefits from issuers, brokers, or other third parties treated?","definition":"Refuse anything that reasonably could compromise independence or objectivity. Modest customary items may be acceptable, but lavish gifts, entertainment, or favorable arrangements create a serious threat."},{"id":20,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Who should pay travel expenses for issuer-sponsored research?","definition":"Best practice is for the analyst's firm to pay. Issuer-paid travel may be acceptable only when arrangements are modest, necessary, and unlikely to impair objectivity."},{"id":21,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Can an omission constitute misrepresentation?","definition":"Yes. Knowingly omitting a material fact, presenting stale information as current, or leaving out information needed to avoid a misleading impression violates Standard I(C)."},{"id":22,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"What is plagiarism, and what attribution exception commonly appears on the exam?","definition":"Plagiarism is using another person's ideas, words, charts, or work without attribution. Factual data from recognized financial or statistical reporting services may generally be used without citation."},{"id":23,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Can a member guarantee investment results or imply that past performance will repeat?","definition":"No. Guarantees, certainty claims, or statements that past results will necessarily recur are misrepresentations unless the result is contractually guaranteed by a reliable third party and fully explained."},{"id":24,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Can conduct outside work violate Standard I(D) Misconduct?","definition":"Yes, if it involves dishonesty, fraud, deceit, or otherwise reflects adversely on professional reputation, integrity, or competence. Minor unrelated offenses, such as an ordinary speeding ticket, usually do not."},{"id":25,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"What does Standard I(E) Competence require?","definition":"Members and candidates must act with and maintain the knowledge, skills, and abilities needed for their professional responsibilities, including when roles, products, methods, or supervisory duties change."},{"id":26,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"When is information material?","definition":"When its disclosure would likely affect a security's price or when a reasonable investor would consider it important in making an investment decision."},{"id":27,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"When is information considered public?","definition":"After it has been disseminated broadly enough that the market has a reasonable opportunity to receive and act on it, such as through an official filing, press release, or widely available news source."},{"id":28,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"What is the mosaic theory?","definition":"An analyst may combine public information with nonmaterial nonpublic information to reach an investment conclusion. Acting on material nonpublic information remains prohibited."},{"id":29,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"What is transaction-based market manipulation?","definition":"Trades or orders intended to distort prices or artificially inflate volume, such as wash trades, matched orders, marking the close, or creating false liquidity."},{"id":30,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"What is information-based market manipulation?","definition":"Spreading false or misleading information, rumors, or projections with the intent to mislead market participants and affect prices or trading volume."},{"id":31,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Does Standard III(A) make every member or candidate a legal fiduciary?","definition":"No. Legal fiduciary status depends on law and the relationship. The Standard nevertheless requires loyalty, prudence, care, and work in the client's best interest regardless of job title."},{"id":32,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"To whom is loyalty owed when managing a pension plan or pooled fund?","definition":"For a pension plan, generally to the beneficiaries rather than the sponsor's management. For a pooled fund, the manager follows the fund's stated mandate rather than the objectives of an individual investor."},{"id":33,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"When may client brokerage or soft commissions be used?","definition":"Only when the purchased research or service benefits the client whose brokerage generated the commission and the arrangement is consistent with best execution and applicable law."},{"id":34,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Does fair dealing require identical treatment of every client?","definition":"No. It requires fair and objective treatment. Different service levels are permitted if disclosed, available on fair terms, and not used to disadvantage other clients."},{"id":35,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How should limited investment opportunities, such as oversubscribed IPOs, be allocated?","definition":"Use a fair, objective, and consistently applied allocation process. Do not favor personal, family, or selected client accounts, and document the allocation method."},{"id":36,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How often must client objectives and the IPS be updated?","definition":"Regularly and whenever material changes in client circumstances occur. The Standard does not impose a universal once-a-year rule."},{"id":37,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How is suitability evaluated for an advisory client?","definition":"Gather and update investment experience, objectives, risk tolerance, and constraints; judge the investment in the context of the total portfolio; and confirm consistency with the written IPS."},{"id":38,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How should an unsolicited unsuitable trade request be handled?","definition":"Explain why it conflicts with the IPS. If the portfolio impact is immaterial, follow firm policy and document the client's acknowledgment. If material, update the IPS, use a separate client-directed account if permitted, or reconsider the relationship."},{"id":39,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"What does Standard III(D) require for performance presentations?","definition":"Make reasonable efforts to ensure performance is fair, accurate, and complete. GIPS compliance is the best method, but it is not mandatory for compliance with the Standard."},{"id":40,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"When may confidential client information be disclosed?","definition":"When it concerns illegal client activity, disclosure is required by law, or the client or prospective client permits it. The duty extends to current, former, and prospective clients."},{"id":41,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"What are two recurring duties under loyalty, prudence, and care besides selecting investments?","definition":"Seek best execution and vote material proxies in the clients' best interests, considering costs and benefits. Follow governing documents and client instructions."},{"id":42,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"May an employee prepare to leave a firm before resigning?","definition":"Yes. The employee may make logistical preparations, but may not solicit current clients, misuse confidential information, divert business, or otherwise compete with the employer before the relationship ends."},{"id":43,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"Who owns models, research, client lists, and records created for an employer?","definition":"Generally the employer. A departing employee may use general knowledge and experience but may not take records, files, or proprietary work without permission."},{"id":44,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"When may a member undertake outside work or compete with an employer?","definition":"Only after disclosing the activity and obtaining the employer's consent when the activity could compete, create a conflict, use employer resources, or interfere with job responsibilities."},{"id":45,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"What is required before accepting additional compensation tied to future performance?","definition":"Obtain written consent from all parties involved before entering the arrangement, including the employer and the party offering the compensation."},{"id":46,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"What should a prospective supervisor do if compliance procedures are inadequate?","definition":"Raise the deficiency with management and decline supervisory responsibility in writing until adequate procedures are adopted, if the role cannot otherwise be performed properly."},{"id":47,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"What must a supervisor do after detecting a possible violation?","definition":"Investigate promptly and take steps to prevent further harm, such as restricting the employee's activities or increasing monitoring. Merely reporting or warning the employee is not enough."},{"id":48,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"Can a recommendation be wrong without violating Standard V(A)?","definition":"Yes. Compliance depends on having a reasonable and adequate basis, appropriate diligence, and independent judgment at the time - not on whether the forecast later proves correct."},{"id":49,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What diligence is required before relying on third-party research?","definition":"Assess the provider's independence, assumptions, methodology, data quality, timeliness, and objectivity. A member need not guarantee accuracy but must have a reasonable basis for relying on it."},{"id":50,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What diligence is required when using quantitative models?","definition":"Understand the model's assumptions, inputs, limitations, and sensitivity to abnormal conditions; test outputs where appropriate; and avoid relying blindly on vendor or internally generated models."},{"id":51,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What must be communicated about services and costs under Standard V(B)?","definition":"Clearly disclose the nature of the services provided and the costs clients will bear, including relevant fee structures and material limitations."},{"id":52,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What must clients know about the investment process?","definition":"The basic format and general principles of the process, material risks and limitations, and significant changes that could affect recommendations or portfolio management."},{"id":53,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"How should facts and opinions be presented in research?","definition":"Clearly distinguish verifiable facts from forecasts, estimates, judgments, and opinions. Reasonable assumptions may be used, but they must not be presented as established facts."},{"id":54,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"How long should investment records be retained?","definition":"Follow applicable law and firm policy. When neither specifies a period, CFA Institute recommends at least seven years."},{"id":55,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What does Standard VI(A) Avoid or Disclose Conflicts require?","definition":"Avoid conflicts when reasonably possible. Otherwise make full and fair disclosure of matters that could impair independence or objectivity or interfere with duties to clients, prospective clients, or the employer."},{"id":56,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What makes a conflict disclosure effective?","definition":"It must be prominent, written in plain language, complete enough to explain the nature and potential effect of the conflict, timely, and communicated effectively."},{"id":57,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What is beneficial ownership?","definition":"Ultimately owning, controlling, directing, voting, disposing of, or having a material direct or indirect financial interest in an investment. Family accounts are included when such an interest or control exists."},{"id":58,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What is the priority of transactions under Standard VI(B)?","definition":"Transactions for clients and employers must have priority over transactions in which the member or candidate is a beneficial owner. Personal trading is allowed only after clients and the employer have had an adequate opportunity to act."},{"id":59,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What is front-running?","definition":"Trading personally or for another favored account before an anticipated client or employer transaction in order to benefit from the expected market impact."},{"id":60,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"When and to whom must referral compensation be disclosed?","definition":"Disclose to the employer, clients, and prospective clients, as appropriate, before they enter the relevant service relationship so they can evaluate total cost and possible bias. Disclose all forms of consideration."},{"id":61,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"What CFA exam information is confidential?","definition":"Actual questions, formulas required or not required, and both broad and specific topics tested or not tested. Soliciting, sharing, or using such information violates Standard VII(A)."},{"id":62,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"May candidates criticize CFA Institute or say an exam was difficult?","definition":"Yes. Personal opinions about policies, procedures, difficulty, or the program are allowed as long as no confidential exam content or tested subject matter is disclosed."},{"id":63,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"How should the CFA designation be used?","definition":"Use CFA as an adjective after a person's name or in 'CFA charterholder.' Do not use it as a noun, company name, nickname, social media handle, or partial designation."},{"id":64,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"How may someone describe candidacy in the CFA Program?","definition":"Use factual language such as 'Level II candidate in the CFA Program' only while registered for that exam or awaiting results. Passing a level does not create a partial designation."},{"id":65,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"What happens if a charterholder does not pay dues or complete the annual Professional Conduct Statement?","definition":"The person becomes inactive and may not use the CFA designation until membership requirements are restored. The charter is not automatically revoked or permanently forfeited."},{"id":66,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"What claims about the CFA designation are prohibited?","definition":"Claims or implications of superior investment performance, guaranteed competence, lower risk, or better results because of the charter. Factual descriptions of the program or completion history are acceptable."},{"id":67,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Does client confidentiality prevent cooperation with a CFA Institute Professional Conduct investigation?","definition":"No. The confidentiality standard is not intended to block cooperation with an authorized Professional Conduct investigation, subject to applicable law."},{"id":68,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"What is the 'legal but unethical' exam trap?","definition":"Local law may permit conduct that the Code and Standards prohibit. When the Code or another applicable rule is stricter, the member or candidate must follow the stricter requirement."},{"id":69,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Can a client's instruction justify insider trading, manipulation, or another Standards violation?","definition":"No. Duties to clients never authorize violating law, the Code and Standards, or market integrity. Refuse the instruction and dissociate when necessary."},{"id":70,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"What is the recurring Ethics exam sequence for handling a conflict or violation?","definition":"Identify the client and duties, apply the strictest rule, avoid the conflict when possible, disclose fully when avoidance is impractical, obtain required written consent, document the action, and dissociate from ongoing violations."}],"standard":[{"id":1,"difficulty":"standard","question":"A member works in a jurisdiction with no law prohibiting trading on material nonpublic information. The member receives reliable nonpublic information that a company will be acquired and purchases shares. The member most likely:","options":{"A":"complies because local law is silent.","B":"violates Standard I(A) and Standard II(A).","C":"violates Standard II(B) only."},"answer":"B","explanation":"The Code and Standards apply when local law is less strict or silent. Trading on material nonpublic information violates II(A), and failure to follow the stricter Standards also implicates I(A).","module":"LM 11","moduleTitle":"Application of the Code and Standards"},{"id":2,"difficulty":"standard","question":"A broker gives an analyst a modest promotional notebook bearing the broker's logo. The analyst accepts it. This action is most likely:","options":{"A":"acceptable because the item is token and unlikely to compromise objectivity.","B":"a violation unless every client consents in writing.","C":"a violation because all broker gifts are prohibited."},"answer":"A","explanation":"I(B) applies a reasonableness test. Token promotional items are generally acceptable when they are not intended or likely to influence judgment.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":3,"difficulty":"standard","question":"An analyst uses several paragraphs from an industry consultant's unpublished report without attribution but changes some words. The analyst most likely violates:","options":{"A":"I(C) Misrepresentation.","B":"II(A) Material Nonpublic Information only.","C":"V(C) Record Retention only."},"answer":"A","explanation":"Paraphrasing does not eliminate the obligation to attribute another person's original analysis. The conduct is plagiarism and misrepresentation.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":4,"difficulty":"standard","question":"A candidate receives a speeding ticket while driving on vacation. No client or professional activity is involved. The ticket most likely:","options":{"A":"violates I(D) because all illegal conduct is misconduct.","B":"does not violate I(D) absent an adverse implication for professional integrity or competence.","C":"violates VII(A) because candidates must disclose all legal infractions publicly."},"answer":"B","explanation":"I(D) does not cover every personal legal violation. The relevant question is whether the act involves dishonesty or reflects adversely on professional integrity or competence.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":5,"difficulty":"standard","question":"A newly promoted manager is assigned to approve complex structured products but does not understand their material risks. The most directly applicable Standard is:","options":{"A":"I(E) Competence.","B":"III(B) Fair Dealing.","C":"VI(C) Referral Fees."},"answer":"A","explanation":"The manager lacks the role-specific knowledge and skills needed to perform the responsibility competently.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":6,"difficulty":"standard","question":"An analyst combines public supplier data with nonmaterial nonpublic observations from store managers and reaches a material earnings conclusion. Trading on the conclusion is most likely:","options":{"A":"prohibited because the conclusion is material.","B":"permitted under mosaic theory if no component is material nonpublic information.","C":"permitted only after the issuer confirms the conclusion privately."},"answer":"B","explanation":"Mosaic theory allows conclusions based on public information plus nonmaterial nonpublic information.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":7,"difficulty":"standard","question":"A trader places matched buy and sell orders solely to create the appearance of activity in an illiquid security. The trader violates:","options":{"A":"II(B) Market Manipulation.","B":"III(C) Suitability.","C":"IV(B) Additional Compensation Arrangements."},"answer":"A","explanation":"The transaction is intended to mislead market participants about volume and possibly price.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":8,"difficulty":"standard","question":"A manager of a defined benefit pension plan receives instructions from the sponsoring company's CFO to invest heavily in the company's stock. The manager's primary loyalty is owed to:","options":{"A":"the CFO.","B":"the sponsoring company's shareholders.","C":"plan beneficiaries."},"answer":"C","explanation":"The beneficiaries are the actual clients for purposes of III(A).","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":9,"difficulty":"standard","question":"A firm provides enhanced reporting to clients who pay an additional fee and discloses the service tiers to all clients. This practice is most likely:","options":{"A":"prohibited because every client must receive identical service.","B":"permitted if recommendations are still disseminated fairly.","C":"permitted only for institutional clients."},"answer":"B","explanation":"Fair dealing does not require identical service. Different disclosed service levels are acceptable if no group receives an unfair trading advantage.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":10,"difficulty":"standard","question":"A client requests a trade that would materially violate the client's IPS. The adviser explains the issue, but the client refuses to amend the IPS. The adviser should most likely:","options":{"A":"execute after obtaining a general waiver.","B":"refuse the trade.","C":"execute because all unsolicited trades are exempt from suitability."},"answer":"B","explanation":"A materially unsuitable trade that conflicts with the mandate should not be executed unless the IPS is appropriately revised.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":11,"difficulty":"standard","question":"A manager advertises a single account's 30% return as “our clients earned 30% last year” without explaining that most accounts earned substantially less. The manager most likely violates:","options":{"A":"III(D) Performance Presentation.","B":"IV(C) Responsibilities of Supervisors only.","C":"VII(B) Reference to CFA Institute."},"answer":"A","explanation":"The statement is not fair, accurate, and complete because it cherry-picks one account and generalizes the result.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":12,"difficulty":"standard","question":"A client gives written permission for a manager to discuss the client's investment experience at an educational seminar. Disclosure is most likely:","options":{"A":"prohibited under all circumstances.","B":"permitted within the scope of the client's authorization and applicable law.","C":"permitted only if the client's name is included."},"answer":"B","explanation":"Client consent is an exception to confidentiality, subject to law and the terms of the permission.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":13,"difficulty":"standard","question":"Before resigning, an employee leases office space for a future advisory firm but does not solicit clients or use employer records. The employee most likely:","options":{"A":"violates IV(A) merely by preparing to compete.","B":"complies with IV(A).","C":"violates VI(B) Priority of Transactions."},"answer":"B","explanation":"Preparations to compete are generally permissible if the employee continues to perform duties and does not solicit clients or harm the employer.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":14,"difficulty":"standard","question":"A client offers a portfolio manager an annual performance bonus. Before accepting, the manager must most likely obtain:","options":{"A":"oral permission from the client only.","B":"written consent from all parties involved.","C":"approval from CFA Institute."},"answer":"B","explanation":"IV(B) requires written consent from all parties, including the employer and client, for additional compensation that may create a conflict.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":15,"difficulty":"standard","question":"A supervisor delegates daily trade monitoring to a compliance officer. The delegation:","options":{"A":"eliminates the supervisor's responsibility.","B":"is prohibited because supervision can never be delegated.","C":"is permitted, but the supervisor remains responsible for reasonable overall controls."},"answer":"C","explanation":"Tasks may be delegated, but the supervisor must ensure that the system is adequate and functioning.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":16,"difficulty":"standard","question":"A manager changes a recommendation solely because another analyst at a reputable firm changed hers. Without additional investigation, the manager most likely violates:","options":{"A":"V(A) Diligence and Reasonable Basis.","B":"VI(C) Referral Fees.","C":"III(E) Preservation of Confidentiality."},"answer":"A","explanation":"Reputation alone does not substitute for assessing the basis and quality of third-party research.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":17,"difficulty":"standard","question":"A research report states, “The dividend will rise next quarter,” when the increase depends on uncertain legislation. The report most likely violates:","options":{"A":"V(B) because it presents an opinion as fact.","B":"II(A) because legislation is always MNPI.","C":"IV(A) because it harms the employer."},"answer":"A","explanation":"The uncertain forecast should be identified as opinion and its assumptions explained.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":18,"difficulty":"standard","question":"A member purchases a security for a personal account immediately before entering a large client buy order. The member most likely violates:","options":{"A":"VI(B) Priority of Transactions.","B":"III(E) Preservation of Confidentiality only.","C":"VII(A) Conduct as a Participant."},"answer":"A","explanation":"The member has front-run the client order and placed personal interests ahead of the client.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":19,"difficulty":"standard","question":"A financial adviser receives a fee from an external manager for every referred client. The adviser must disclose the arrangement most appropriately:","options":{"A":"after the client has invested.","B":"before the formal engagement, including the nature of the benefit.","C":"only to the employer."},"answer":"B","explanation":"VI(C) requires timely disclosure to relevant employers, clients, and prospects so they can evaluate cost and bias.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":20,"difficulty":"standard","question":"A firm has independently verified one composite but not its firmwide processes. It states, “Our growth composite is GIPS verified and compliant.” The statement is most likely:","options":{"A":"proper because verification may apply to one composite.","B":"improper because GIPS compliance and verification are firmwide concepts.","C":"proper if the composite has positive returns."},"answer":"B","explanation":"A firm cannot claim partial GIPS compliance, and verification applies to the firm as a whole rather than a selected composite.","module":"LM 10","moduleTitle":"Introduction to GIPS"}],"advanced":[{"id":21,"difficulty":"advanced","question":"An analyst accepts a luxury trip from an issuer after promising to publish independent research. The analyst discloses the trip in the report. Which statement is most accurate?","options":{"A":"Disclosure cures any potential violation.","B":"The analyst may still violate I(B) because a benefit that compromises objectivity should be refused.","C":"Only VI(C) applies because the trip is a referral fee."},"answer":"B","explanation":"Some conflicts may be disclosed, but I(B) requires independence and objectivity. A lavish issuer-paid benefit that could influence judgment should not be accepted merely because it is disclosed.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":22,"difficulty":"advanced","question":"A member learns from a director that a company lost a major customer. The director says the information is confidential. Separately, public shipping data already show a sharp decline, and the member had independently reached a sell conclusion before the conversation. The member should most likely:","options":{"A":"trade because the conclusion was independently reached.","B":"refrain from trading until the material confidential information becomes public.","C":"trade only in client accounts, not personally."},"answer":"B","explanation":"Once the member possesses material nonpublic information, the member may not act even if a similar conclusion had previously been reached through a mosaic.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":23,"difficulty":"advanced","question":"A manager uses a tax-loss sale that temporarily increases reported market volume. The purpose is to realize a tax loss, and no effort is made to mislead others. The transaction most likely:","options":{"A":"violates II(B) because volume changed.","B":"does not violate II(B) absent intent to mislead.","C":"violates II(A) because tax information is nonpublic."},"answer":"B","explanation":"Market impact alone is not manipulation. Legitimate economic purpose and lack of misleading intent are decisive.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":24,"difficulty":"advanced","question":"A pension manager is instructed by the plan sponsor to direct trades to a broker that provides services to the sponsor but not to the plan. The broker's execution quality is acceptable but more expensive. The manager should most likely:","options":{"A":"comply because the sponsor hired the manager.","B":"evaluate whether the arrangement benefits beneficiaries and seek best execution within any valid direction.","C":"comply after disclosing the arrangement only to the sponsor."},"answer":"B","explanation":"The manager's duty is to beneficiaries. Directed brokerage must be evaluated for client benefit, cost, and best execution.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":25,"difficulty":"advanced","question":"A portfolio manager allocates an oversubscribed IPO pro rata among client accounts and the manager's personal account. The allocation policy treats all accounts identically. The manager most likely:","options":{"A":"complies because the allocation is mathematically equal.","B":"violates VI(B) because client accounts must have priority over beneficial personal accounts.","C":"violates III(C) only."},"answer":"B","explanation":"Fair allocation among clients does not place a personal account on the same priority level when the security is scarce.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":26,"difficulty":"advanced","question":"A client asks an adviser to purchase a speculative security. The position would equal 0.1% of a diversified portfolio and would not affect the portfolio's ability to meet objectives. The adviser believes the security is unsuitable viewed alone. The best response is to:","options":{"A":"automatically refuse the trade.","B":"discuss and document the concern and may execute if the total portfolio remains suitable.","C":"revise the client's risk tolerance upward permanently."},"answer":"B","explanation":"Suitability is judged in total-portfolio context. An unsolicited immaterial position may be executed after appropriate discussion and documentation.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":27,"difficulty":"advanced","question":"A former employee presents a six-year track record earned at a prior firm. The former employer gives written permission. The advertisement identifies the prior firm but omits that the employee was one of ten team members. The presentation most likely:","options":{"A":"complies because permission was obtained.","B":"violates III(D) because the person's role is material to a fair and complete presentation.","C":"violates IV(A) only."},"answer":"B","explanation":"Permission addresses use of records but does not eliminate the need to accurately describe source and role.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":28,"difficulty":"advanced","question":"A manager suspects an elderly client is being exploited by a relative. The client has not authorized disclosure, and no law clearly requires reporting. The manager's best initial action is to:","options":{"A":"send full account statements to the relative.","B":"follow firm procedures, consult legal or compliance staff, and contact an authorized trusted contact if permitted.","C":"immediately close the account and publish the concern."},"answer":"B","explanation":"Confidentiality still applies. A controlled process using authorized contacts and legal guidance balances protection and privacy.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":29,"difficulty":"advanced","question":"Before resigning, an analyst memorizes the names of several clients and, after departure, contacts them using publicly available contact details. No agreement prohibits solicitation. The analyst most likely:","options":{"A":"automatically violates IV(A) because former clients can never be contacted.","B":"may contact them after departure if no confidential records were taken and law and agreements permit it.","C":"violates V(C) because memory is an employer record."},"answer":"B","explanation":"General memory and public information may be used after employment ends, subject to contracts and law. Taking records or soliciting before departure would differ.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":30,"difficulty":"advanced","question":"A supervisor learns that an employee may have allocated profitable trades to favored accounts. The supervisor asks the employee, who denies it, and takes no further action. The supervisor most likely:","options":{"A":"complies because the employee denied wrongdoing.","B":"violates IV(C) by failing to investigate and respond reasonably to a warning sign.","C":"violates II(A) only."},"answer":"B","explanation":"Reasonable supervision requires investigation, evidence review, and corrective action rather than reliance on an unsupported denial.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":31,"difficulty":"advanced","question":"A quantitative investment committee adopts a vendor model. Committee members understand the strategy but not the code. They review assumptions, validation results, data quality, stress behavior, and limitations. The members most likely:","options":{"A":"comply with V(A); writing the code themselves is not required.","B":"violate I(E) because every user must be a programmer.","C":"violate V(C) because vendor models cannot be documented."},"answer":"A","explanation":"Members need sufficient understanding to evaluate and use the model responsibly, not necessarily the ability to program it.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":32,"difficulty":"advanced","question":"A research analyst states that a security has “a 95% probability of losing no more than 4% next month” based on a VaR model. The report does not state that losses can exceed the estimate or describe the historical assumptions. The analyst most likely violates:","options":{"A":"V(B) Communication with Clients and Prospective Clients.","B":"VI(B) Priority of Transactions.","C":"VII(B) Reference to CFA Institute."},"answer":"A","explanation":"Material assumptions and limitations must be disclosed so the model is not presented with misleading precision.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":33,"difficulty":"advanced","question":"A member keeps employer research files on a personal laptop for weekend work. After being terminated, the member uses the files as work samples without permission. Which combination is most relevant?","options":{"A":"IV(A) Loyalty and V(C) Record Retention.","B":"II(B) Market Manipulation and III(C) Suitability.","C":"VI(C) Referral Fees and VII(A) Conduct as a Participant."},"answer":"A","explanation":"The files belong to the employer and are supporting records. Using them after termination without permission violates duties concerning employer property and records.","module":"LM 11","moduleTitle":"Application of the Code and Standards"},{"id":34,"difficulty":"advanced","question":"A manager owns shares in a company and recommends the shares to clients. The ownership is disclosed in small print on the final page of a lengthy report. The manager most likely:","options":{"A":"complies because any disclosure is sufficient.","B":"violates VI(A) because the disclosure is not prominent or effective.","C":"violates VI(B) even if no personal trade occurs."},"answer":"B","explanation":"Conflict disclosures must be prominent, plain, and effective, not technically present but concealed.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":35,"difficulty":"advanced","question":"A client offers a manager a performance bonus, and the employer provides written consent. The manager accepts but does not disclose the arrangement to other relevant clients whose accounts might receive less attention. The manager most likely:","options":{"A":"has fully complied because employer consent is enough.","B":"may violate VI(A) because the arrangement creates a conflict that requires effective disclosure to affected parties.","C":"violates VII(A) only."},"answer":"B","explanation":"IV(B) consent addresses the employer relationship, while VI(A) may require disclosure of the resulting conflict to other affected clients.","module":"LM 11","moduleTitle":"Application of the Code and Standards"},{"id":36,"difficulty":"advanced","question":"A member pays a consultant for client referrals. The consultant does not receive compensation unless a client signs. The member discloses the arrangement after the first advisory meeting but before assets are transferred. The disclosure is most likely:","options":{"A":"timely because no assets have moved.","B":"potentially too late because referral compensation should be disclosed before the formal engagement or agreement.","C":"unnecessary because the member pays rather than receives the fee."},"answer":"B","explanation":"VI(C) applies to compensation paid or received and requires disclosure early enough for the prospect to evaluate the relationship before engagement.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":37,"difficulty":"advanced","question":"A candidate posts, “The exam was harder than expected, and candidates should spend more time on formulas.” The candidate does not identify a formula, question, or topic. This statement most likely:","options":{"A":"violates VII(A) because all exam discussion is prohibited.","B":"does not violate VII(A) because it expresses a general opinion without confidential content.","C":"violates VII(B) because the candidate mentions the exam."},"answer":"B","explanation":"General opinions are permitted. Revealing specific or broad tested content is not.","module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate"},{"id":38,"difficulty":"advanced","question":"A person passed Level II several years ago but is not currently enrolled for an exam and is not awaiting results. The person's résumé states “CFA Program candidate.” The statement is most likely:","options":{"A":"proper because passing any level creates permanent candidacy.","B":"improper because current candidacy depends on enrollment or awaiting results under CFA Institute rules.","C":"proper if the person plans to register next year."},"answer":"B","explanation":"Candidacy is not permanent and cannot be based only on future intent.","module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate"},{"id":39,"difficulty":"advanced","question":"A firm defines itself for GIPS purposes as only its high-performing equity office, although the same brand markets fixed- income services from another office. The definition most likely:","options":{"A":"is acceptable because each office chooses independently.","B":"is inappropriate because the firm definition should reflect the distinct business entity held out to clients and cannot be narrowed to omit poor results.","C":"is acceptable if independently verified."},"answer":"B","explanation":"Verification cannot cure an inappropriate definition. Firmwide compliance requires a defensible business-entity definition.","module":"LM 10","moduleTitle":"Introduction to GIPS"},{"id":40,"difficulty":"advanced","question":"A firm assigns portfolios to a growth composite after year-end, placing strong performers in the composite and weak performers in a broad-market composite. The firm most likely:","options":{"A":"complies if all portfolios appear in some composite.","B":"violates GIPS principles because composite assignment must be determined before performance is known and follow the actual strategy.","C":"complies if the composite returns are asset weighted."},"answer":"B","explanation":"Ex post classification enables cherry-picking and defeats the purpose of composite reporting.","module":"LM 10","moduleTitle":"Introduction to GIPS"}],"traps":[]}}}};
    const STORAGE_KEY = "cfa-level-1-study-app-v5";
    const OLD_STORAGE_KEY = "cfa-corporate-finance-study-app-v2";
    const APP_VERSION = 5;
    const TYPE_LABELS = {
      formula:"Formula Sheet", flashcards:"Flashcards", standard:"Standard Questions",
      advanced:"Advanced Questions", traps:"Exam Traps"
    };
    const VIEW_CONFIG = [
      ["dashboard","Dashboard"],["formula","Formula Sheet"],["flashcards","Flashcards"],
      ["standard","Standard Questions"],["advanced","Advanced Questions"],
      ["traps","Exam Traps"],["mistakes","Mistake Book"]
    ];

    const ui = {
      subject:"corporate", view:"dashboard", index:0, module:"all", filter:"all",
      flipped:false, selected:null, confidence:null, submitted:false, lastCorrect:null,
      shuffled:{}, mistakeStatus:"active", mistakeModule:"all", daily:null
    };

    function blankProgress(){
      return {app:"CFA Level I Study App",version:APP_VERSION,items:{},mistakes:{},daily:{sessions:[],active:null},settings:{subject:"corporate",view:"dashboard"}};
    }
    let progress = blankProgress();

    function subjectData(subject=ui.subject){ return APP_DATA.subjects[subject].data; }
    function getDeck(type,subject=ui.subject){ return subjectData(subject)[type] || []; }
    function itemKey(subject,type,id){ return `${subject}:${type}:${id}`; }
    function attach(item,subject,type){ return {...item,subject,type,key:itemKey(subject,type,item.id)}; }
    function getAllItems(subject){
      return Object.keys(TYPE_LABELS).flatMap(type=>getDeck(type,subject).map(item=>attach(item,subject,type)));
    }
    function findByKey(key){
      const [subject,type,idText]=key.split(":");
      const item=getDeck(type,subject).find(x=>String(x.id)===idText);
      return item?attach(item,subject,type):null;
    }
    function pFor(key){
      if(!progress.items[key]) progress.items[key]={attempts:0,correct:0,incorrect:0,sure:0,partial:0,mastery:0,lastConfidence:null,lastResult:null,lastReviewed:null,lastSelected:null,seen:false};
      return progress.items[key];
    }
    function isoNow(){ return new Date().toISOString(); }
    function today(){ return new Date().toISOString().slice(0,10); }
    function save(){
      progress.settings={subject:ui.subject,view:ui.view};
      progress.daily.active=(ui.daily&&!ui.daily.finished)?ui.daily:null;
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){console.warn('Progress could not be saved locally.',e);}
    }
    function load(){
      try{
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
        if(saved&&saved.version===APP_VERSION){ progress={...blankProgress(),...saved}; progress.items=saved.items||{}; progress.mistakes=saved.mistakes||{}; progress.daily=saved.daily||{sessions:[],active:null}; }
        else migrateOld();
        if(progress.settings?.subject in APP_DATA.subjects) ui.subject=progress.settings.subject;
        if(VIEW_CONFIG.some(([v])=>v===progress.settings?.view)) ui.view=progress.settings.view;
        if(progress.daily?.active?.keys?.length) ui.daily=progress.daily.active;
      }catch(e){ console.warn(e); progress=blankProgress(); }
    }
    function migrateOld(){
      try{
        const old=JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)||"null");
        if(!old) return;
        const cardSets=[['formulaSheet','formula',old.formulaRatings],['flashcards','flashcards',old.cardRatings]];
        cardSets.forEach(([,type,ratings])=>{
          Object.entries(ratings||{}).forEach(([id,rating])=>{
            const key=itemKey('corporate',type,id),p=pFor(key); p.attempts=1;p.seen=true;p.lastReviewed=isoNow();p.lastConfidence=rating==='known'?'sure':'partial';p.mastery=rating==='known'?100:55;p[rating==='known'?'sure':'partial']=1;
          });
        });
        ['standard','advanced'].forEach(type=>{
          Object.entries(old.quizResponses?.[type]||{}).forEach(([id,r])=>{
            const key=itemKey('corporate',type,id),p=pFor(key);p.attempts=1;p.seen=true;p.lastReviewed=isoNow();p.lastResult=!!r.correct;p.lastSelected=r.selected;p.correct=r.correct?1:0;p.incorrect=r.correct?0:1;p.mastery=r.correct?75:0;p.partial=1;p.lastConfidence='partial';
            if(!r.correct){ const item=findByKey(key); addMistake(item,r.selected,'partial'); }
          });
        });
        toast('Progress from the previous version was migrated.');
      }catch(e){ console.warn('Migration failed',e); }
    }

    function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
    function updateMastery(p,newScore){ p.mastery=p.attempts<=1?newScore:Math.round(p.mastery*.6+newScore*.4); }
    function recordCard(item,confidence){
      const p=pFor(item.key);p.attempts++;p.seen=true;p.lastReviewed=isoNow();p.lastConfidence=confidence;p.lastResult=null;p[confidence]++;updateMastery(p,confidence==='sure'?100:55);save();
      if(ui.daily) dailyRecord({confidence,correct:null});
    }
    function recordQuestion(item,selected,confidence){
      const correct=selected===item.answer,p=pFor(item.key);p.attempts++;p.seen=true;p.lastReviewed=isoNow();p.lastConfidence=confidence;p.lastResult=correct;p.lastSelected=selected;p[confidence]++;p[correct?'correct':'incorrect']++;
      const score=correct?(confidence==='sure'?100:76):(confidence==='sure'?0:18);updateMastery(p,score);
      if(correct){ if(progress.mistakes[item.key]){progress.mistakes[item.key].resolved=true;progress.mistakes[item.key].resolvedAt=isoNow();} }
      else addMistake(item,selected,confidence);
      save(); if(ui.daily) dailyRecord({confidence,correct}); return correct;
    }
    function addMistake(item,selected,confidence){
      if(!item) return; const m=progress.mistakes[item.key]||{key:item.key,subject:item.subject,type:item.type,id:item.id,count:0,resolved:false,history:[]};
      m.count++;m.resolved=false;m.lastDate=isoNow();m.lastSelected=selected;m.correctAnswer=item.answer;m.explanation=item.explanation;m.dangerous=confidence==='sure';m.history=(m.history||[]).slice(-9);m.history.push({date:m.lastDate,selected,confidence});progress.mistakes[item.key]=m;
    }

    function categoryMetrics(subject,type,module=null){
      const items=getDeck(type,subject).filter(x=>!module||x.module===module); if(!items.length) return {total:0,seen:0,mastery:0,coverage:0,attempts:0,correct:0,sure:0,partial:0};
      let seen=0,sum=0,attempts=0,correct=0,sure=0,partial=0;
      items.forEach(item=>{const p=progress.items[itemKey(subject,type,item.id)];if(p?.seen) seen++;sum+=p?.mastery||0;attempts+=p?.attempts||0;correct+=p?.correct||0;sure+=p?.sure||0;partial+=p?.partial||0;});
      return {total:items.length,seen,mastery:Math.round(sum/items.length),coverage:Math.round(seen/items.length*100),attempts,correct,sure,partial};
    }
    function subjectMetrics(subject){
      const cats=Object.keys(TYPE_LABELS).map(type=>categoryMetrics(subject,type)).filter(x=>x.total);
      const mastery=Math.round(cats.reduce((a,c)=>a+c.mastery,0)/Math.max(1,cats.length));
      const total=cats.reduce((a,c)=>a+c.total,0),seen=cats.reduce((a,c)=>a+c.seen,0),attempts=cats.reduce((a,c)=>a+c.attempts,0),sure=cats.reduce((a,c)=>a+c.sure,0);
      const q=['standard','advanced'].map(t=>categoryMetrics(subject,t)); const qAttempts=q.reduce((a,c)=>a+c.attempts,0),qCorrect=q.reduce((a,c)=>a+c.correct,0);
      return {mastery,total,seen,coverage:Math.round(seen/Math.max(1,total)*100),attempts,sureRate:Math.round(sure/Math.max(1,attempts)*100),accuracy:Math.round(qCorrect/Math.max(1,qAttempts)*100)};
    }
    function moduleMetrics(subject,module){
      const cats=Object.keys(TYPE_LABELS).map(type=>categoryMetrics(subject,type,module)).filter(c=>c.total);
      const total=cats.reduce((a,c)=>a+c.total,0),seen=cats.reduce((a,c)=>a+c.seen,0);
      return {mastery:cats.length?Math.round(cats.reduce((a,c)=>a+c.mastery,0)/cats.length):0,total,seen,coverage:Math.round(seen/Math.max(1,total)*100)};
    }
    function modulesFor(subject,type=null){
      const items=type?getDeck(type,subject):getAllItems(subject);const map=new Map();items.forEach(x=>map.set(x.module,x.moduleTitle));
      return [...map.entries()].sort((a,b)=>{const na=parseInt(a[0].replace(/\D/g,''))||99,nb=parseInt(b[0].replace(/\D/g,''))||99;return na-nb||a[0].localeCompare(b[0]);});
    }

    function renderChrome(){
      document.getElementById('subjectSwitch').innerHTML=Object.entries(APP_DATA.subjects).map(([key,s])=>`<button class="subject-button ${ui.subject===key?'active':''}" data-subject="${key}">${s.label}</button>`).join('');
      document.querySelectorAll('[data-subject]').forEach(b=>b.onclick=()=>switchSubject(b.dataset.subject));
      const tabs=[...VIEW_CONFIG]; if(ui.view==='daily') tabs.unshift(['daily','Daily Review']);
      document.getElementById('sectionTabs').innerHTML=tabs.map(([key,label])=>`<button class="section-tab ${ui.view===key?'active':''}" data-view="${key}">${label}</button>`).join('');
      document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>setView(b.dataset.view));
      document.getElementById('appSubtitle').textContent=`${APP_DATA.subjects[ui.subject].subtitle} · Progress is saved locally.`;
    }
    function switchSubject(subject){ ui.subject=subject;ui.view='dashboard';resetStudyUI();save();render(); }
    function setView(view){ if(view==='daily'&&!ui.daily){startDailyReview('all',25);return;}ui.view=view;resetStudyUI();save();render(); }
    function resetStudyUI(){ui.index=0;ui.module='all';ui.filter='all';ui.flipped=false;ui.selected=null;ui.confidence=null;ui.submitted=false;ui.lastCorrect=null;}

    function render(){ renderChrome(); if(ui.view==='dashboard')renderDashboard(); else if(ui.view==='mistakes')renderMistakes(); else if(ui.view==='daily')renderDaily(); else renderStudy(ui.view); renderSide(); }

    function renderDashboard(){
      const cur=subjectMetrics(ui.subject);
      const activeMistakes=Object.values(progress.mistakes).filter(m=>!m.resolved).length;
      const dangerous=Object.values(progress.mistakes).filter(m=>!m.resolved&&m.dangerous).length;
      const categories=Object.keys(TYPE_LABELS).map(type=>[type,categoryMetrics(ui.subject,type)]);
      const modules=modulesFor(ui.subject);
      const subjectSummaries=Object.entries(APP_DATA.subjects).map(([key,subject])=>[key,subject,subjectMetrics(key)]);
      const sessions=progress.daily.sessions||[]; const last7=sessions.filter(s=>(Date.now()-new Date(s.date).getTime())<7*86400000).length;
      document.getElementById('mainPanel').innerHTML=`
        <div class="view-title-row"><div><h2 class="view-title">Mastery Dashboard</h2><p class="view-subtitle">Mastery combines coverage, accuracy, and confidence level by category.</p></div><span class="mastery-chip">Mastery ${cur.mastery}%</span></div>
        <div class="review-launch">
          <div><h3>Start Daily Review</h3><p>An adaptive session that prioritizes mistakes, partially confident answers, and unreviewed content.</p></div>
          <select id="reviewScope"><option value="all">All Topics</option><option value="current">Only ${APP_DATA.subjects[ui.subject].label}</option></select>
          <select id="reviewSize"><option value="15">15 items</option><option value="25" selected>25 items</option><option value="40">40 items</option></select>
          <button class="btn primary" id="startReviewButton">Start</button>
        </div>
        <div class="dashboard-grid">
          ${subjectSummaries.map(([key,subject,m])=>`<div class="summary-card ${key===ui.subject?'current-subject':''}"><h3>${subject.label}</h3><div class="summary-score">${m.mastery}%</div><div class="summary-meta">Coverage ${m.coverage}% · Accuracy ${m.accuracy}% · Confident ${m.sureRate}%</div></div>`).join('')}
        </div>
        <div class="section-heading"><h3>Mastery by Study Tool</h3><span>${activeMistakes} active mistakes · ${dangerous} high-confidence mistakes</span></div>
        <div class="category-grid">${categories.map(([type,m])=>`<div class="category-card"><small>${TYPE_LABELS[type]}</small><strong>${m.mastery}%</strong><span>${m.seen}/${m.total} reviewed · coverage ${m.coverage}%</span></div>`).join('')}</div>
        <div class="section-heading"><h3>Mastery by Learning Module</h3><span>${last7} Daily Reviews in 7 days</span></div>
        <div class="module-list">${modules.map(([module,title])=>{const m=moduleMetrics(ui.subject,module);return `<div class="module-row"><div class="module-label"><strong>${module}</strong><span>${title} · ${m.seen}/${m.total}</span></div><div class="bar"><span style="width:${m.mastery}%"></span></div><div class="module-score">${m.mastery}%</div></div>`}).join('')}</div>`;
      document.getElementById('startReviewButton').onclick=()=>startDailyReview(document.getElementById('reviewScope').value,Number(document.getElementById('reviewSize').value));
    }

    function deckForCurrent(){ return getDeck(ui.view,ui.subject).map(x=>attach(x,ui.subject,ui.view)); }
    function filteredDeck(){
      let deck=deckForCurrent();
      if(ui.module!=='all') deck=deck.filter(x=>x.module===ui.module);
      if(ui.filter==='unseen') deck=deck.filter(x=>!progress.items[x.key]?.seen);
      if(ui.filter==='partial') deck=deck.filter(x=>progress.items[x.key]?.lastConfidence==='partial');
      if(ui.filter==='mistakes') deck=deck.filter(x=>progress.mistakes[x.key]&&!progress.mistakes[x.key].resolved);
