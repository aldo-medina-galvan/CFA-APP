id":70,"module":"LM 6","moduleTitle":"International Trade","term":"A quota and tariff can have similar quantity effects but different rent recipients","trap":"Treating quota rents as government revenue in every case.","definition":"A quota restricts quantity and can raise the domestic price similarly to a tariff. The rents accrue to whoever owns the import licenses unless the government auctions them."},{"id":71,"module":"LM 6","moduleTitle":"International Trade","term":"An export subsidy raises the domestic price of the subsidized good","trap":"Assuming a subsidy makes the product cheaper for domestic consumers.","definition":"The subsidy encourages firms to sell abroad, increasing domestic price, expanding domestic production, and reducing domestic consumption. The government bears the fiscal cost and national welfare falls under standard assumptions."},{"id":72,"module":"LM 6","moduleTitle":"International Trade","term":"Protection preserves specific jobs but does not create free national gains","trap":"Counting protected employment as a benefit without considering consumer costs, input costs, retaliation, and displaced activity elsewhere.","definition":"Trade restrictions redistribute income and can preserve targeted industries, but they reduce efficiency and impose costs on consumers and downstream producers."},{"id":73,"module":"LM 6","moduleTitle":"International Trade","term":"Trade creation and trade diversion have opposite welfare implications","trap":"Assuming every increase in trade among bloc members raises welfare.","definition":"Trade creation replaces higher-cost domestic production with lower-cost member imports and tends to improve welfare. Trade diversion replaces lower-cost non-member imports with higher-cost member imports and can reduce welfare."},{"id":74,"module":"LM 6","moduleTitle":"International Trade","term":"A free trade area does not have a common external tariff","trap":"Using free trade area and customs union as synonyms.","definition":"An FTA removes internal trade barriers while members retain separate policies toward non-members. A customs union adds a common external trade policy."},{"id":75,"module":"LM 6","moduleTitle":"International Trade","term":"Deeper integration adds factor mobility and policy coordination","trap":"Assuming a common market differs from a customs union only by adopting a common currency.","definition":"A common market adds free movement of labor and capital. An economic union adds coordinated institutions and economic policies. A monetary union adds a common currency and removes individual monetary and exchange-rate policy tools."},{"id":76,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"In an X/Y quote, X is the price currency and Y is the base currency","trap":"Reading USD/EUR as euros per US dollar.","definition":"USD/EUR means units of US dollars per one euro. If the quote rises, the base currency, EUR, appreciates against the price currency, USD."},{"id":77,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"A direct quote uses domestic currency as the price currency","trap":"Defining a direct quote as foreign currency per unit of domestic currency.","definition":"From a domestic investor's perspective, a direct quote is domestic currency per unit of foreign currency. If the domestic currency appreciates, the direct quote declines."},{"id":78,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"The dealer buys the base currency at the bid and sells it at the offer","trap":"Choosing the bid when the client wants to buy the base currency from the dealer.","definition":"The bid is what the dealer pays for the base currency; the offer is what the dealer charges to sell the base currency. The bid is lower than the offer."},{"id":79,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Inverting a two-sided quote reverses the sides","trap":"Taking the reciprocal of the bid and offer without swapping their order.","definition":"For bid-offer a-b, the inverse quote is 1/b to 1/a. This preserves the rule that the bid remains below the offer."},{"id":80,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Currency appreciation and inverse-currency depreciation are not equal percentages","trap":"Saying a 10 percent appreciation of one currency is exactly a 10 percent depreciation of the other.","definition":"Reciprocal percentage changes are asymmetric. If one quote rises by x percent, the inverse falls by x/(1+x), not by x."},{"id":81,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Nominal and real exchange rates answer different questions","trap":"Using the spot quote alone to measure changes in international purchasing power.","definition":"For a domestic/foreign quote, the real exchange rate is approximately spot multiplied by the foreign-to-domestic price-level ratio. Inflation differentials can change competitiveness even when the nominal rate is unchanged."},{"id":82,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Matching asset and liability currencies removes FX mismatch, not all risk","trap":"Assuming a foreign-currency asset is riskless because the investor has expenses in the same currency.","definition":"Currency matching reduces the effect of exchange-rate changes on the matched cash flows. Credit, duration, market-value, and purchasing-power risks can remain."},{"id":83,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"No currency regime can deliver all three ideal properties","trap":"Assuming a country can maintain a credibly fixed exchange rate, full capital mobility, and completely independent monetary policy.","definition":"The policy trilemma requires sacrificing at least one of the three. Fixed rates with open capital markets substantially restrict independent monetary policy."},{"id":84,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"A fixed regime is not necessarily a perfectly constant exchange rate","trap":"Treating fixed pegs, target zones, and currency boards as identical and free of realignment risk.","definition":"Many fixed regimes allow a band and can be devalued or revalued. A currency board is stronger because domestic monetary-base issuance is legally backed by foreign reserves, but even it is not the same as dollarization or monetary union."},{"id":85,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"A trade deficit must be financed by an offsetting capital or financial account surplus","trap":"Analyzing the trade balance and international capital flows as independent outcomes.","definition":"Imports exceeding exports require net borrowing from or asset sales to foreigners. Capital controls can temporarily change flow composition and restore some policy autonomy, but they carry administrative, market-access, and credibility costs."},{"id":86,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Cross rates work by canceling currencies, not by multiplying every quote","trap":"Multiplying two exchange rates without checking whether the units cancel.","definition":"Write each quote as units. Given A/B and B/C, multiply to obtain A/C because B cancels. If the common currency appears on the same side in both quotes, invert one quote first."},{"id":87,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"The requested cross-rate orientation determines whether to invert the result","trap":"Stopping after calculating the reciprocal of the rate requested in the question.","definition":"After forming the cross rate, verify that the numerator is the requested price currency and the denominator is the requested base currency. Invert only when orientation is reversed."},{"id":88,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Covered interest parity uses the price-currency rate over the base-currency rate","trap":"Applying the interest-rate differential backward because the quote labels are ignored.","definition":"For a price/base quote, F(price/base) = S(price/base) x (1 + r_price) / (1 + r_base), using interest rates for the same maturity as the forward contract."},{"id":89,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"The higher-interest-rate currency trades at a forward discount","trap":"Assuming investors can earn the higher interest rate and also obtain a forward appreciation without arbitrage.","definition":"Covered interest parity offsets the interest advantage through the forward rate. The lower-interest-rate currency trades at a forward premium relative to the higher-interest-rate currency."},{"id":90,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Forward premium or discount depends on the quote convention","trap":"Calling F greater than S a premium for both currencies.","definition":"When F(price/base) exceeds S(price/base), the base currency is at a forward premium and the price currency is at a forward discount. Reverse the quote and the terminology reverses."},{"id":91,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"A forward rate is a no-arbitrage price, not a reliable spot forecast","trap":"Selecting the forward rate as the best prediction of the future spot rate merely because it reflects interest differentials.","definition":"The forward rate is determined by covered interest parity. Risk premia and changing expectations make forward rates poor point forecasts of future spot rates."},{"id":92,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Annual and contract-period interest rates must be aligned","trap":"Using full-year interest rates in a three-month forward formula without converting them to the three-month period.","definition":"Use effective rates for the contract maturity or convert quoted annual rates according to the stated convention. The spot, forward, and interest-rate periods must match."},{"id":93,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Arbitrage requires comparing complete hedged strategies","trap":"Borrowing simply in the lower-interest-rate currency without considering spot conversion and the forward hedge.","definition":"Compare the domestic risk-free return with the fully hedged foreign return. Borrow to fund the lower-return strategy, invest in the higher-return strategy, and lock the future currency conversion with the forward contract."}]}}}};
    const STORAGE_KEY = "cfa-level-1-study-app-v5";
    const OLD_STORAGE_KEY = "cfa-corporate-finance-study-app-v2";
    const APP_VERSION = 5;
    const TYPE_LABELS = {
      formula:"Formula Sheet", flashcards:"Flashcards", standard:"Standard Questions",
      advanced:"Advanced Questions", traps:"Exam Traps"
    };
    const VIEW_CONFIG = [
      ["dashboard","Dashboard"],["formula","Formula Sheet"],["flashcards","Flashcards"],
      ["standard","Standard Questions"],["advanced","Advanced Questions"],
      ["traps","Exam Traps"],["mistakes","Mistake Book"]
    ];

    const ui = {
      subject:"corporate", view:"dashboard", index:0, module:"all", filter:"all",
      flipped:false, selected:null, confidence:null, submitted:false, lastCorrect:null,
      shuffled:{}, mistakeStatus:"active", mistakeModule:"all", daily:null
    };

    function blankProgress(){
      return {app:"CFA Level I Study App",version:APP_VERSION,items:{},mistakes:{},daily:{sessions:[],active:null},settings:{subject:"corporate",view:"dashboard"}};
    }
    let progress = blankProgress();

    function subjectData(subject=ui.subject){ return APP_DATA.subjects[subject].data; }
    function getDeck(type,subject=ui.subject){ return subjectData(subject)[type] || []; }
    function itemKey(subject,type,id){ return `${subject}:${type}:${id}`; }
    function attach(item,subject,type){ return {...item,subject,type,key:itemKey(subject,type,item.id)}; }
    function getAllItems(subject){
      return Object.keys(TYPE_LABELS).flatMap(type=>getDeck(type,subject).map(item=>attach(item,subject,type)));
    }
    function findByKey(key){
      const [subject,type,idText]=key.split(":");
      const item=getDeck(type,subject).find(x=>String(x.id)===idText);
      return item?attach(item,subject,type):null;
    }
    function pFor(key){
      if(!progress.items[key]) progress.items[key]={attempts:0,correct:0,incorrect:0,sure:0,partial:0,mastery:0,lastConfidence:null,lastResult:null,lastReviewed:null,lastSelected:null,seen:false};
      return progress.items[key];
    }
    function isoNow(){ return new Date().toISOString(); }
    function today(){ return new Date().toISOString().slice(0,10); }
    function save(){
      progress.settings={subject:ui.subject,view:ui.view};
      progress.daily.active=(ui.daily&&!ui.daily.finished)?ui.daily:null;
      try{localStorage.setItem(STORAGE_KEY,JSON.stringify(progress));}catch(e){console.warn('Progress could not be saved locally.',e);}
    }
    function load(){
      try{
        const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");
        if(saved&&saved.version===APP_VERSION){ progress={...blankProgress(),...saved}; progress.items=saved.items||{}; progress.mistakes=saved.mistakes||{}; progress.daily=saved.daily||{sessions:[],active:null}; }
        else migrateOld();
        if(progress.settings?.subject in APP_DATA.subjects) ui.subject=progress.settings.subject;
        if(VIEW_CONFIG.some(([v])=>v===progress.settings?.view)) ui.view=progress.settings.view;
        if(progress.daily?.active?.keys?.length) ui.daily=progress.daily.active;
      }catch(e){ console.warn(e); progress=blankProgress(); }
    }
    function migrateOld(){
      try{
        const old=JSON.parse(localStorage.getItem(OLD_STORAGE_KEY)||"null");
        if(!old) return;
        const cardSets=[['formulaSheet','formula',old.formulaRatings],['flashcards','flashcards',old.cardRatings]];
        cardSets.forEach(([,type,ratings])=>{
          Object.entries(ratings||{}).forEach(([id,rating])=>{
            const key=itemKey('corporate',type,id),p=pFor(key); p.attempts=1;p.seen=true;p.lastReviewed=isoNow();p.lastConfidence=rating==='known'?'sure':'partial';p.mastery=rating==='known'?100:55;p[rating==='known'?'sure':'partial']=1;
          });
        });
        ['standard','advanced'].forEach(type=>{
          Object.entries(old.quizResponses?.[type]||{}).forEach(([id,r])=>{
            const key=itemKey('corporate',type,id),p=pFor(key);p.attempts=1;p.seen=true;p.lastReviewed=isoNow();p.lastResult=!!r.correct;p.lastSelected=r.selected;p.correct=r.correct?1:0;p.incorrect=r.correct?0:1;p.mastery=r.correct?75:0;p.partial=1;p.lastConfidence='partial';
            if(!r.correct){ const item=findByKey(key); addMistake(item,r.selected,'partial'); }
          });
        });
        toast('Progress from the previous version was migrated.');
      }catch(e){ console.warn('Migration failed',e); }
    }

    function clamp(n,min,max){ return Math.max(min,Math.min(max,n)); }
    function updateMastery(p,newScore){ p.mastery=p.attempts<=1?newScore:Math.round(p.mastery*.6+newScore*.4); }
    function recordCard(item,confidence){
      const p=pFor(item.key);p.attempts++;p.seen=true;p.lastReviewed=isoNow();p.lastConfidence=confidence;p.lastResult=null;p[confidence]++;updateMastery(p,confidence==='sure'?100:55);save();
      if(ui.daily) dailyRecord({confidence,correct:null});
    }
    function recordQuestion(item,selected,confidence){
      const correct=selected===item.answer,p=pFor(item.key);p.attempts++;p.seen=true;p.lastReviewed=isoNow();p.lastConfidence=confidence;p.lastResult=correct;p.lastSelected=selected;p[confidence]++;p[correct?'correct':'incorrect']++;
      const score=correct?(confidence==='sure'?100:76):(confidence==='sure'?0:18);updateMastery(p,score);
      if(correct){ if(progress.mistakes[item.key]){progress.mistakes[item.key].resolved=true;progress.mistakes[item.key].resolvedAt=isoNow();} }
      else addMistake(item,selected,confidence);
      save(); if(ui.daily) dailyRecord({confidence,correct}); return correct;
    }
    function addMistake(item,selected,confidence){

    function categoryMetrics(subject,type,module=null){
      const items=getDeck(type,subject).filter(x=>!module||x.module===module); if(!items.length) return {total:0,seen:0,mastery:0,coverage:0,attempts:0,correct:0,sure:0,partial:0};
      let seen=0,sum=0,attempts=0,correct=0,sure=0,partial=0;
      items.forEach(item=>{const p=progress.items[itemKey(subject,type,item.id)];if(p?.seen) seen++;sum+=p?.mastery||0;attempts+=p?.attempts||0;correct+=p?.correct||0;sure+=p?.sure||0;partial+=p?.partial||0;});
      return {total:items.length,seen,mastery:Math.round(sum/items.length),coverage:Math.round(seen/items.length*100),attempts,correct,sure,partial};
    }
    function subjectMetrics(subject){
      const cats=Object.keys(TYPE_LABELS).map(type=>categoryMetrics(subject,type)).filter(x=>x.total);
      const mastery=Math.round(cats.reduce((a,c)=>a+c.mastery,0)/Math.max(1,cats.length));
      const total=cats.reduce((a,c)=>a+c.total,0),seen=cats.reduce((a,c)=>a+c.seen,0),attempts=cats.reduce((a,c)=>a+c.attempts,0),sure=cats.reduce((a,c)=>a+c.sure,0);
      const q=['standard','advanced'].map(t=>categoryMetrics(subject,t)); const qAttempts=q.reduce((a,c)=>a+c.attempts,0),qCorrect=q.reduce((a,c)=>a+c.correct,0);
      return {mastery,total,seen,coverage:Math.round(seen/Math.max(1,total)*100),attempts,sureRate:Math.round(sure/Math.max(1,attempts)*100),accuracy:Math.round(qCorrect/Math.max(1,qAttempts)*100)};
    }
    function moduleMetrics(subject,module){
      const cats=Object.keys(TYPE_LABELS).map(type=>categoryMetrics(subject,type,module)).filter(c=>c.total);
      const total=cats.reduce((a,c)=>a+c.total,0),seen=cats.reduce((a,c)=>a+c.seen,0);
      return {mastery:cats.length?Math.round(cats.reduce((a,c)=>a+c.mastery,0)/cats.length):0,total,seen,coverage:Math.round(seen/Math.max(1,total)*100)};
    }

    function candidateScore(item){
      const p=progress.items[item.key],m=progress.mistakes[item.key];let score=Math.random()*15;

    function interleaveRanked(lists,limit){
      const queues=lists.map(list=>[...list]);const out=[];let added=true;
      while(out.length<limit&&added){
        added=false;
        for(const queue of queues){
          if(queue.length){out.push(queue.shift());added=true;if(out.length>=limit)break;}
        }
      }
      return out;
    }

    function startDailyReview(selection='all',size=25){

      const quotas={formula:.16,flashcards:.24,standard:.24,advanced:.16,traps:.20};let keys=[];
      for(const [type,ratio] of Object.entries(quotas)){
        const take=Math.max(1,Math.round(size*ratio));
        const rankedBySubject=subjects.map(subject=>getDeck(type,subject).map(item=>attach(item,subject,type)).sort((a,b)=>candidateScore(b)-candidateScore(a)));
        keys.push(...interleaveRanked(rankedBySubject,take).map(item=>item.key));
      }
      keys=[...new Set(keys)];
      if(keys.length<size){
        const used=new Set(keys);
        const rankedBySubject=subjects.map(subject=>getAllItems(subject).filter(item=>!used.has(item.key)).sort((a,b)=>candidateScore(b)-candidateScore(a)));
        keys.push(...interleaveRanked(rankedBySubject,size-keys.length).map(item=>item.key));
      }
      keys=shuffle([...new Set(keys)]).slice(0,size);
      ui.daily={date:today(),scope:subjects.length===Object.keys(APP_DATA.subjects).length?'all':'custom',subjects,keys,index:0,completed:0,correct:0,incorrect:0,sure:0,partial:0,skipped:0};ui.view='daily';resetQuestionUI();save();render();
    }
    function currentDailyItem(){return ui.daily?.keys?.[ui.daily.index]?findByKey(ui.daily.keys[ui.daily.index]):null;}
    function dailyRecord(result){if(!ui.daily)return;ui.daily.completed++;if(result.confidence)ui.daily[result.confidence]++;if(result.correct===true)ui.daily.correct++;if(result.correct===false)ui.daily.incorrect++;save();}
    function advanceDaily(recorded){if(!ui.daily)return;if(!recorded)ui.daily.skipped++;ui.daily.index++;resetQuestionUI();if(ui.daily.index>=ui.daily.keys.length)finishDaily();else{save();render();}}
    function finishDaily(){const summary={date:isoNow(),scope:ui.daily.scope,total:ui.daily.keys.length,completed:ui.daily.completed,correct:ui.daily.correct,incorrect:ui.daily.incorrect,sure:ui.daily.sure,partial:ui.daily.partial,skipped:ui.daily.skipped};progress.daily.sessions=(progress.daily.sessions||[]).slice(-59);progress.daily.sessions.push(summary);ui.daily={...ui.daily,finished:true};progress.daily.active=null;save();render();}
    function renderDaily(){
      if(!ui.daily){startDailyReview('all',25);return;}if(ui.daily.finished){
        const qTotal=ui.daily.correct+ui.daily.incorrect,acc=Math.round(ui.daily.correct/Math.max(1,qTotal)*100);document.getElementById('mainPanel').innerHTML=`<div class="daily-complete"><div class="big">${ui.daily.completed}</div><h2>Daily Review Complete</h2><p class="view-subtitle">Question Accuracy ${acc}% · Confident ${ui.daily.sure} · Partially Confident ${ui.daily.partial} · Skipped ${ui.daily.skipped}</p><button class="btn primary" id="finishReviewButton">Return to Dashboard</button></div>`;document.getElementById('finishReviewButton').onclick=()=>{ui.daily=null;ui.view='dashboard';save();render();};return;
      }
      const item=currentDailyItem();if(!item){finishDaily();return;}const pct=Math.round((ui.daily.index+1)/ui.daily.keys.length*100);
      document.getElementById('mainPanel').innerHTML=`<div class="view-title-row"><div><h2 class="view-title">Daily Review</h2><p class="view-subtitle">${APP_DATA.subjects[item.subject].label} · ${TYPE_LABELS[item.type]} · ${item.module}</p></div><span class="mastery-chip">${ui.daily.index+1}/${ui.daily.keys.length}</span></div><div class="daily-progress"><span>Adaptive Priority</span><span>${pct}%</span></div><div class="progress-track"><div class="progress-bar" style="width:${pct}%"></div></div><div class="study-stage" id="studyStage">${renderItemHTML(item,true)}</div>${renderNavigationHTML(item,true)}<p class="status" id="statusText"></p>`;
      bindStudyEvents(item,[],true);
    }

    function renderSide(){
      const m=subjectMetrics(ui.subject),active=Object.values(progress.mistakes).filter(x=>x.subject===ui.subject&&!x.resolved).length,dangerous=Object.values(progress.mistakes).filter(x=>x.subject===ui.subject&&!x.resolved&&x.dangerous).length;
      const sessions=progress.daily.sessions||[],last=sessions.at(-1);const totalAttempts=Object.entries(progress.items).filter(([k])=>k.startsWith(ui.subject+':')).reduce((a,[,p])=>a+(p.attempts||0),0);
      document.getElementById('sidePanel').innerHTML=`<h2 class="side-title">${APP_DATA.subjects[ui.subject].label} Progress</h2><div class="stat-grid"><div class="stat"><span class="stat-value">${m.mastery}%</span><span class="stat-label">Overall Mastery</span></div><div class="stat"><span class="stat-value">${m.coverage}%</span><span class="stat-label">Coverage</span></div><div class="stat"><span class="stat-value">${m.accuracy}%</span><span class="stat-label">Accuracy</span></div><div class="stat"><span class="stat-value">${m.sureRate}%</span><span class="stat-label">“Confident” Ratings</span></div></div>
        <div class="side-section"><h3 class="side-title">Mistake Book</h3><div class="mini-row"><span>Active Mistakes</span><strong>${active}</strong></div><div class="mini-row"><span>High-Confidence Mistakes</span><strong>${dangerous}</strong></div><div class="mini-row"><span>Total Attempts</span><strong>${totalAttempts}</strong></div></div>
        <div class="side-section"><h3 class="side-title">Daily Review</h3><div class="mini-row"><span>Completed Sessions</span><strong>${sessions.length}</strong></div><div class="mini-row"><span>Last Session</span><strong>${last?new Date(last.date).toLocaleDateString('en-US'):'—'}</strong></div></div>
        <div class="side-section"><h3 class="side-title">Confidence tracking</h3><p class="view-subtitle">“Confident” requires clear recall. “Partially Confident” keeps the item prioritized in Daily Review.</p></div>`;
    }

    function exportProgress(){
      const payload={...progress,exportedAt:isoNow()};const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`CFA_Study_App_Progress_${today()}.json`;document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url);toast('Progress exported.');
    }
    function importProgress(file){
      const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=="CFA Level I Study App"||!obj.items||!obj.mistakes)throw new Error('Unrecognized file format');if(!confirm('Importing will replace your current progress. Continue?'))return;progress={...blankProgress(),...obj,version:APP_VERSION};progress.items=obj.items||{};progress.mistakes=obj.mistakes||{};progress.daily=obj.daily||{sessions:[],active:null};ui.daily=progress.daily.active||null;save();toast('Progress imported successfully.');render();}catch(e){alert('The file could not be imported: '+e.message);}};reader.readAsText(file);
    }
    function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
    function esc(value){return String(value??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
    let toastTimer;function toast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400);}

    document.getElementById('dailyTopButton').onclick=openReviewSetup;
    document.getElementById('exportButton').onclick=exportProgress;
    document.getElementById('importButton').onclick=()=>document.getElementById('importFile').click();
    document.getElementById('importFile').onchange=e=>{const f=e.target.files[0];if(f)importProgress(f);e.target.value='';};
    document.addEventListener('keydown',e=>{
      if(['SELECT','INPUT','TEXTAREA'].includes(document.activeElement?.tagName))return;
      if(ui.view==='daily'||Object.keys(TYPE_LABELS).includes(ui.view)){
        const item=ui.view==='daily'?currentDailyItem():filteredDeck()[ui.index];if(!item)return;
        if(e.key==='ArrowLeft'&&ui.view!=='daily')move(-1,filteredDeck());else if(e.key==='ArrowRight'&&ui.view!=='daily')move(1,filteredDeck());
        else if(!(item.type==='standard'||item.type==='advanced')&&e.code==='Space'){e.preventDefault();ui.flipped=!ui.flipped;renderCurrent(item,ui.view==='daily');}
        else if((item.type==='standard'||item.type==='advanced')&&!ui.submitted){const k=e.key.toUpperCase();if(['A','B','C'].includes(k)){ui.selected=k;renderCurrent(item,ui.view==='daily');}else if(e.key==='1'||e.key==='2'){ui.confidence=e.key==='1'?'sure':'partial';renderCurrent(item,ui.view==='daily');}else if(e.key==='Enter')submitCurrentQuestion(item,ui.view==='daily');}
      }
    });

    load();render();
  </script>
</body>
</html>
