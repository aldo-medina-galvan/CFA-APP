fter membership lapses or claiming that the charter guarantees better returns, lower risk, or superior competence.","definition":"Maintain annual membership requirements to use the designation. Factual statements about the program or past status may be allowed, but do not exaggerate the designation’s implications or link it to promised results."},{"id":98,"module":"LM 11","moduleTitle":"Application of the Code and Standards: Level I","term":"Required conduct and recommended practice are not the same","trap":"Selecting a violation whenever a member does not follow a recommended compliance practice.","definition":"First identify the mandatory language of the Standard. Recommended procedures strengthen compliance, but failure to adopt a recommendation is not automatically a violation when the required conduct is satisfied."},{"id":99,"module":"LM 11","moduleTitle":"Application of the Code and Standards: Level I","term":"Timing and the professional relationship often determine the answer","trap":"Treating disclosure after an action as equivalent to prior written consent, or applying a client duty to a person who is not the client.","definition":"Identify who owes a duty to whom and when the action must occur. Ethics questions frequently turn on prior versus subsequent disclosure, written consent, advisory versus execution-only relationships, and current versus former status."},{"id":100,"module":"LM 11","moduleTitle":"Application of the Code and Standards: Level I","term":"Disclosure cannot cure inherently prohibited conduct, and one action may violate several Standards","trap":"Assuming a disclosed conflict permits insider trading, manipulation, misrepresentation, unfair allocation, or misuse of confidential information.","definition":"Disclosure manages certain conflicts; it does not legalize prohibited conduct. Analyze all affected duties—law, market integrity, clients, employer, research process, conflicts, and CFA Institute responsibilities—before choosing the answer."}]}},"economics":{"label":"Economics","shortLabel":"Economics","subtitle":"CFA Level I 2027 · Economics","data":{"formula":[{"id":1,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Economic profit","definition":"Economic profit = Total revenue - Explicit costs - Implicit opportunity costs\n\nZero economic profit means the firm earns a normal return on all resources, including owner-supplied capital."},{"id":2,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Total and average cost","definition":"TC = TFC + TVC; ATC = AFC + AVC\n\nFixed cost does not vary with output in the short run."},{"id":3,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Marginal quantities","definition":"MC = ΔTC / ΔQ; MR = ΔTR / ΔQ\n\nProduce the last unit for which marginal benefit is at least marginal cost."},{"id":4,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Profit maximization","definition":"MR = MC, with MC rising through MR\n\nUnder perfect competition, P = AR = MR, so the rule becomes P = MC."},{"id":5,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Breakeven","definition":"TR = TC; under perfect competition P = ATC\n\nEconomic profit is zero."},{"id":6,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Short-run shutdown","definition":"Shut down if TR < TVC; under perfect competition P < minimum AVC\n\nIf P = minimum AVC, the firm is indifferent between operating and shutting down."},{"id":7,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Long-run exit","definition":"Exit if TR < TC; under perfect competition P < minimum ATC\n\nAll costs are variable in the long run."},{"id":8,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Concentration ratio","definition":"CR_N = sum of the market shares of the N largest firms\n\nEasy to compute but ignores the relative size distribution within the group."},{"id":9,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"HHI","definition":"HHI = Σ(MS_i²), using every firm\n\nWith percentage shares, HHI ranges from near 0 to 10,000. A merger of firms with shares a and b raises HHI by 2ab."},{"id":10,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Price elasticity","definition":"E_d = %ΔQ_d / %ΔP\n\nElastic if absolute value > 1; unit elastic if = 1; inelastic if < 1."},{"id":11,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Expenditure GDP","definition":"GDP = C + I + G + (X - M)\n\nImports are subtracted because they are included in C, I, or G but are not domestically produced."},{"id":12,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"GDP deflator","definition":"GDP deflator = Nominal GDP / Real GDP × 100\n\nBroad price index for domestically produced final goods and services."},{"id":13,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Inflation","definition":"Inflation_t = Price index_t / Price index_(t-1) - 1\n\nDisinflation is lower positive inflation; deflation is a negative inflation rate."},{"id":14,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Unemployment rate","definition":"Unemployed / Labor force\n\nLabor force = employed + unemployed actively seeking work."},{"id":15,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Participation rate","definition":"Labor force / Working-age population\n\nDiscouraged workers are generally outside the labor force."},{"id":16,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Quantity equation","definition":"MV = PY\n\nWith stable velocity and output near potential, faster money growth tends to raise inflation."},{"id":17,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Fisher relation","definition":"(1 + nominal rate) = (1 + real rate)(1 + expected inflation)\n\nApproximation: nominal rate ≈ real rate + expected inflation."},{"id":18,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Fiscal multiplier","definition":"1 / [1 - MPC(1 - t)]\n\nThe multiplier is larger when MPC is high and the net tax rate is low."},{"id":19,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Balanced-budget multiplier","definition":"1\n\nAn equal increase in government spending and lump-sum taxes increases equilibrium output by the same amount under the basic model."},{"id":20,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"National accounts identity","definition":"(X - M) = (S - I) + (T - G)\n\nA current account deficit reflects private investment exceeding saving, a fiscal deficit, or both."},{"id":21,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Base currency return","definition":"%ΔB versus P = S_1(P/B) / S_0(P/B) - 1\n\nIf P/B rises, the base currency appreciates and the price currency depreciates."},{"id":22,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Inverse currency return","definition":"If B appreciates x%, P depreciates 1/(1+x) - 1\n\nAppreciation and depreciation percentages are not symmetric."},{"id":23,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Real exchange rate","definition":"R_(d/f) = S_(d/f) × P_f / P_d\n\nHigher R means foreign goods are more expensive in real domestic-currency terms and domestic purchasing power is lower."},{"id":24,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Cross rate","definition":"Arrange quotes so unwanted currencies cancel algebraically\n\nExample: MXN/USD × USD/EUR = MXN/EUR."},{"id":25,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Forward from points","definition":"F = S + points / scale\n\nScale is normally 10,000 for four-decimal quotes and 100 for two-decimal yen quotes."},{"id":26,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Covered interest parity, P/B quote","definition":"F_(P/B) = S_(P/B) × (1 + r_P t) / (1 + r_B t)\n\nThe currency with the higher interest rate trades at a forward discount."},{"id":27,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Covered interest parity, f/d quote","definition":"F_(f/d) = S_(f/d) × (1 + r_f t) / (1 + r_d t)\n\nThis is the same relationship under the reciprocal quote."},{"id":28,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Forward premium on base","definition":"F/S - 1\n\nAnnualize by multiplying by the applicable day-count factor, commonly 360/days."}],"flashcards":[{"id":1,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Economic profit versus accounting profit","definition":"Economic profit subtracts both explicit costs and implicit opportunity costs. Zero economic profit means all resources earn their normal required return."},{"id":2,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Profit-maximizing rule","definition":"Produce where MR = MC, with MC rising through MR. Under perfect competition, P = MR, so produce where P = MC."},{"id":3,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Competitive short-run shutdown rule","definition":"Shut down if P is below minimum AVC, equivalently TR < TVC. If AVC < P < ATC, operate and minimize the loss."},{"id":4,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Competitive long-run exit rule","definition":"Exit if P remains below minimum ATC. All costs are variable in the long run."},{"id":5,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Breakeven","definition":"TR = TC. Under perfect competition, P = ATC. Economic profit is zero, but normal profit is earned."},{"id":6,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"MC relationship to AVC and ATC","definition":"MC intersects AVC and ATC at their minimum points: a marginal value below an average pulls it down; above the average pushes it up."},{"id":7,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Economies versus diseconomies of scale","definition":"Economies: LRATC falls as output rises. Diseconomies: LRATC rises because coordination and bureaucracy outweigh scale benefits."},{"id":8,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Minimum efficient scale","definition":"The smallest output at which LRATC reaches its minimum range. A large MES relative to market demand supports high concentration."},{"id":9,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Perfect competition","definition":"Many firms, homogeneous product, negligible entry barriers, price taking, and long-run P = MC = minimum ATC."},{"id":10,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Pure monopoly","definition":"One seller protected by high barriers. It chooses Q where MR = MC and charges the demand-curve price; generally P > MC."},{"id":11,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Natural monopoly regulation","definition":"P = MC is allocatively efficient but may be below ATC and require subsidy. P = ATC permits normal profit but not full allocative efficiency."},{"id":12,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Monopolistic competition long run","definition":"Entry drives P to ATC and economic profit to zero, but P > MC and output is below minimum ATC, creating excess capacity."},{"id":13,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Oligopoly","definition":"Few interdependent firms with high entry barriers. Strategic reactions and game theory are central."},{"id":14,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Nash equilibrium","definition":"No player can improve its payoff by changing strategy unilaterally, given the strategies of other players."},{"id":15,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Kinked demand model","definition":"Rivals are assumed to match price cuts but not price increases, making demand less elastic below the current price and more elastic above it."},{"id":16,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"HHI","definition":"Sum the squared market shares of every firm. With percent shares, monopoly HHI is 10,000. A merger of shares a and b raises HHI by 2ab."},{"id":17,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Classical versus growth cycle","definition":"Classical cycle tracks rises and falls in activity level. Growth cycle tracks deviations of actual output from potential or trend."},{"id":18,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Recovery phase","definition":"Output remains below potential but the negative gap narrows. Inventories fall, overtime rises, and inflation is usually subdued."},{"id":19,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Expansion phase","definition":"Growth is above trend, employment and investment strengthen, and a positive output gap may develop."},{"id":20,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Slowdown phase","definition":"Output may remain above potential, but growth decelerates; inventories rise and inflation pressure may still be high."},{"id":21,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Contraction phase","definition":"Output falls or grows below trend, unemployment rises, credit tightens, and inflation decelerates with a lag."},{"id":22,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Credit cycle","definition":"Fluctuation in credit availability, price, standards, leverage, and defaults. It is often longer and more amplified than the business cycle."},{"id":23,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Financial accelerator","definition":"Asset-price declines reduce collateral and tighten credit, weakening spending and causing further asset-price and output declines."},{"id":24,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Inventory-to-sales over the cycle","definition":"Usually rises late in expansion as sales slow unexpectedly and falls in early recovery as sales improve before production catches up."},{"id":25,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Leading, coincident, and lagging indicators","definition":"Leading turn before activity; coincident move with it; lagging confirm it afterward. No indicator is perfectly reliable."},{"id":26,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Diffusion index","definition":"Percentage of components moving in the expansionary direction. It measures breadth, not magnitude."},{"id":27,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Nowcasting","definition":"Estimating current economic activity before official releases using timely conventional data and big data."},{"id":28,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Labor adjustment over the cycle","definition":"Firms generally change overtime and temporary employment before making permanent hiring or layoff decisions."},{"id":29,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Fiscal versus monetary policy","definition":"Fiscal uses government spending, taxes, and transfers. Monetary uses central-bank rates, reserves, asset operations, and communication."},{"id":30,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Automatic stabilizers","definition":"Taxes fall and transfers rise automatically in downturns, supporting income without new legislation; the reverse occurs in expansions."},{"id":31,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Structural budget balance","definition":"Estimated budget balance at full employment. It is a better indicator of discretionary fiscal stance than the actual balance."},{"id":32,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Fiscal multiplier","definition":"1/[1 - MPC(1-t)]. It is larger with high MPC, low taxes, spare capacity, domestic spending, and accommodating monetary policy."},{"id":33,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Balanced-budget multiplier","definition":"Equals one in the basic model: equal increases in spending and lump-sum taxes raise output by the amount of the spending increase."},{"id":34,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Crowding out","definition":"Government borrowing raises rates or absorbs real resources, reducing private investment and weakening the fiscal multiplier."},{"id":35,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Ricardian equivalence","definition":"Households save debt-financed tax cuts because they anticipate future taxes, potentially neutralizing the intended stimulus."},{"id":36,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Fiscal policy lags","definition":"Recognition lag identifies the problem; action lag enacts policy; impact lag is the delay before economic effects occur."},{"id":37,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Central bank core roles","definition":"Currency issuer, banker, payment-system overseer, reserve manager, lender of last resort, and monetary-policy authority."},{"id":38,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Open-market purchase","definition":"Adds reserves and tends to reduce short-term rates; a sale drains reserves and tends to raise rates."},{"id":39,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Monetary transmission channels","definition":"Interest rate, credit, asset-price/wealth, expectations, and exchange-rate channels."},{"id":40,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Real policy rate and neutral rate","definition":"Real rate ≈ nominal rate - expected inflation. Policy is generally easy when the real rate is below neutral and tight when above."},{"id":41,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Central bank independence, credibility, transparency","definition":"Independence is freedom from political instruction; credibility is belief in commitment; transparency is clear communication."},{"id":42,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Policy trilemma","definition":"A country cannot simultaneously maintain a fixed exchange rate, free capital mobility, and independent monetary policy."},{"id":43,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Liquidity trap","definition":"At very low rates, money demand becomes highly elastic and additional reserves have little effect on rates or spending."},{"id":44,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Adverse supply shock policy trade-off","definition":"Inflation rises while output falls. Tightening restrains inflation but worsens output; easing supports output but risks more inflation."},{"id":45,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"State versus non-state actors","definition":"State actors are governments and official entities. Non-state actors include companies, NGOs, media, and influential individuals."},{"id":46,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Four geopolitical archetypes","definition":"Autarky: non-cooperative/nationalist. Hegemony: non-cooperative/globalized. Bilateralism: cooperative/selectively nationalist. Multilateralism: cooperative/globalized."},{"id":47,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"IMF versus World Bank versus WTO","definition":"IMF: macro and external stability. World Bank: development and poverty reduction. WTO: trade rules, negotiation, and disputes."},{"id":48,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Geopolitical risk types","definition":"Event risk has a known date; exogenous risk is sudden; thematic risk is known and develops over time."},{"id":49,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Geopolitical risk assessment","definition":"Evaluate likelihood, velocity, and impact. Use scenarios and signposts because risk evolves nonlinearly."},{"id":50,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Geopolitical tools","definition":"National-security tools, economic tools, and financial tools; each can be cooperative or non- cooperative."},{"id":51,"module":"LM 6","moduleTitle":"International Trade","term":"Absolute versus comparative advantage","definition":"Absolute advantage is lower resource cost. Comparative advantage is lower opportunity cost and determines efficient specialization."},{"id":52,"module":"LM 6","moduleTitle":"International Trade","term":"Ricardian versus Heckscher-Ohlin trade models","definition":"Ricardian: technology and labor productivity. Heckscher-Ohlin: relative factor endowments and factor intensity."},{"id":53,"module":"LM 6","moduleTitle":"International Trade","term":"Small-country tariff","definition":"Raises domestic price and production, lowers consumption and imports, generates revenue, and creates net deadweight loss."},{"id":54,"module":"LM 6","moduleTitle":"International Trade","term":"Quota rents","definition":"The scarcity value created by an import quota. It may go to government, domestic license holders, or foreign exporters."},{"id":55,"module":"LM 6","moduleTitle":"International Trade","term":"Export subsidy","definition":"Raises domestic price and production, reduces domestic consumption, costs the government money, and creates a national welfare loss."},{"id":56,"module":"LM 6","moduleTitle":"International Trade","term":"Trade creation versus diversion","definition":"Creation replaces costly domestic output with lower-cost member imports. Diversion replaces lower-cost non-member imports with higher- cost member imports."},{"id":57,"module":"LM 6","moduleTitle":"International Trade","term":"Stages of regional integration","definition":"Free trade area -> customs union -> common market -> economic union -> monetary union."},{"id":58,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"FX P/B quote","definition":"P/B means units of price currency P per one base currency B. If P/B rises, B appreciates and P depreciates."},{"id":59,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Direct versus indirect quote","definition":"Direct uses domestic currency as price currency. Indirect uses domestic currency as base currency."},{"id":60,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Reciprocal currency changes","definition":"If one currency depreciates x%, the other appreciates 1/(1-x)-1; the percentages are not symmetric."},{"id":61,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Real exchange rate","definition":"R_(d/f)=S_(d/f)×P_f/P_d. A higher R means foreign goods are more expensive in real domestic terms."},{"id":62,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Exchange-rate regimes","definition":"Range from dollarization, union, currency board, and fixed peg through crawling arrangements, managed float, and independent float."},{"id":63,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Current account identity","definition":"X-M=(S-I)+(T-G). A current account deficit requires private investment exceeding saving, a fiscal deficit, or both."},{"id":64,"module":"LM 7","moduleTitle":"Capital Flows and the FX Market","term":"Capital-control objectives","definition":"Defend a peg, prevent flight, limit inflow- driven appreciation and asset volatility, keep rates low, or protect strategic sectors."},{"id":65,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Cross-rate method","definition":"Write currency units and multiply or divide so the common currency cancels to the requested quote."},{"id":66,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Forward points","definition":"F=S+points/scale. Use 10,000 for most four- decimal quotes and 100 for two-decimal yen quotes."},{"id":67,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Covered interest parity for P/B","definition":"F_(P/B)=S_(P/B)×(1+r_P t)/(1+r_B t). The price- currency rate belongs in the numerator."},{"id":68,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Forward premium or discount","definition":"Base premium = F/S-1. If F>S, base is at premium; the higher-interest currency always trades at a forward discount."},{"id":69,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Covered arbitrage","definition":"Borrow in the currency with the lower covered return, convert, invest in the higher covered return, and lock the future conversion with a forward."},{"id":70,"module":"LM 8","moduleTitle":"Exchange Rate Calculations","term":"Forward rate as forecast","definition":"A forward rate is a no-arbitrage price based on spot, rates, and maturity. It is not necessarily an accurate forecast of future spot."}],"standard":[{"id":1,"question":"A competitive firm faces a market price below average total cost but above average variable cost. In the short run, the firm should most likely:","options":{"A":"shut down immediately.","B":"continue producing at the quantity where price equals marginal cost.","C":"continue producing only if price equals average total cost."},"answer":"B","explanation":"The firm is covering all variable cost and part of fixed cost. Operating minimizes the loss. It should shut down only if price falls below minimum AVC.","difficulty":"Standard","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":2,"question":"Which market structure is characterized by many firms, differentiated products, low entry barriers, and zero economic profit in long-run equilibrium?","options":{"A":"Perfect competition.","B":"Monopolistic competition.","C":"Oligopoly."},"answer":"B","explanation":"Monopolistic competition combines many firms and low barriers with product differentiation. Entry eliminates long-run economic profit, but firms retain some pricing power and excess capacity.","difficulty":"Standard","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":3,"question":"For a price-searching firm, the profit-maximizing price is determined by:","options":{"A":"setting price equal to marginal cost.","B":"choosing quantity where marginal revenue equals marginal cost and reading price from demand.","C":"choosing the minimum point on average total cost."},"answer":"B","explanation":"MR = MC determines quantity. Because the firm faces downward-sloping demand, price is then obtained from the demand curve and is generally greater than MR.","difficulty":"Standard","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":4,"question":"In long-run monopolistic competition, a representative firm most likely operates where:","options":{"A":"price equals marginal cost and minimum average total cost.","B":"price equals average total cost but exceeds marginal cost.","C":"marginal revenue equals price and economic profit is positive."},"answer":"B","explanation":"Entry eliminates economic profit, so P = ATC. Product differentiation preserves pricing power, so P > MC, and the firm operates with excess capacity.","difficulty":"Standard","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":5,"question":"An industry has five firms with market shares of 30%, 25%, 20%, 15%, and 10%. The HHI is closest to:","options":{"A":"2,250.","B":"2,350.","C":"10,000."},"answer":"A","explanation":"HHI = 30² + 25² + 20² + 15² + 10² = 900 + 625 + 400 + 225 + 100 = 2,250.","difficulty":"Standard","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":6,"question":"Two firms with market shares of 20% and 10% merge, with all other shares unchanged. The increase in HHI is:","options":{"A":"200 points.","B":"400 points.","C":"900 points."},"answer":"B","explanation":"The merger increase is 2ab = 2 × 20 × 10 = 400 points.","difficulty":"Standard","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":7,"question":"Which combination is most consistent with the recovery phase of the growth cycle?","options":{"A":"A positive output gap that is widening and accelerating inflation.","B":"A negative output gap that is narrowing and increasing use of overtime.","C":"Falling output, rising unemployment, and tightening credit."},"answer":"B","explanation":"Recovery begins near the trough while output is still below potential. Firms initially increase overtime and temporary labor before committing to permanent hiring.","difficulty":"Standard","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":8,"question":"Compared with business cycles, credit cycles are generally:","options":{"A":"shorter and less pronounced.","B":"longer and more pronounced.","C":"identical in duration and amplitude."},"answer":"B","explanation":"Leverage, collateral, refinancing, and default dynamics often make credit cycles longer and more amplified than ordinary output cycles.","difficulty":"Standard","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":9,"question":"Which of the following is most likely a leading indicator?","options":{"A":"Building permits.","B":"Industrial production.","C":"Average duration of unemployment."},"answer":"A","explanation":"Building permits usually turn before construction activity and the broader economy. Industrial production is coincident; unemployment duration is lagging.","difficulty":"Standard","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":10,"question":"The inventory-to-sales ratio typically rises late in an expansion because:","options":{"A":"firms intentionally build inventories after sales accelerate.","B":"sales slow before production is fully adjusted.","C":"firms reduce production faster than sales decline."},"answer":"B","explanation":"Unexpected slowing in sales causes inventories to accumulate until firms reduce production.","difficulty":"Standard","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":11,"question":"The best simple measure of discretionary fiscal stance is the:","options":{"A":"actual budget deficit.","B":"structural budget balance.","C":"level of gross government debt."},"answer":"B","explanation":"The structural balance estimates the budget position at full employment and removes the cyclical effect of automatic stabilizers.","difficulty":"Standard","module":"LM 3","moduleTitle":"Fiscal Policy"},{"id":12,"question":"If MPC is 0.80 and the proportional net tax rate is 25%, the fiscal spending multiplier is closest to:","options":{"A":"1.67.","B":"2.50.","C":"5.00."},"answer":"B","explanation":"1/[1 - 0.80(1 - 0.25)] = 1/(1 - 0.60) = 2.50.","difficulty":"Standard","module":"LM 3","moduleTitle":"Fiscal Policy"},{"id":13,"question":"Which factor most increases concern about a government's debt sustainability?","options":{"A":"Nominal GDP growth persistently above the effective interest rate.","B":"Debt financing of high-return infrastructure.","C":"Persistent primary deficits combined with weak growth and high refinancing costs."},"answer":"C","explanation":"Weak growth, high interest costs, and primary deficits cause debt service and the debt ratio to compound unfavorably.","difficulty":"Standard","module":"LM 3","moduleTitle":"Fiscal Policy"},{"id":14,"question":"A central bank purchase of government securities in the open market is most likely to:","options":{"A":"drain bank reserves and raise short-term rates.","B":"add bank reserves and lower short-term rates.","C":"reduce the monetary base and appreciate the currency mechanically."},"answer":"B","explanation":"The purchase pays reserves into the banking system, increasing reserve supply and easing short-term money-market conditions.","difficulty":"Standard","module":"LM 4","moduleTitle":"Monetary Policy"},{"id":15,"question":"A nominal policy rate is 4%, expected inflation is 5%, and the estimated neutral real rate is 1%. The policy stance is most likely:","options":{"A":"expansionary.","B":"neutral.","C":"contractionary."},"answer":"A","explanation":"The real policy rate is approximately -1%, below the 1% neutral real rate.","difficulty":"Standard","module":"LM 4","moduleTitle":"Monetary Policy"},{"id":16,"question":"A country with free capital movement and a fixed exchange rate most likely has limited ability to maintain:","options":{"A":"independent monetary policy.","B":"trade in goods and services.","C":"foreign currency reserves."},"answer":"A","explanation":"The policy trilemma states that a country cannot simultaneously have a fixed rate, free capital mobility, and independent monetary policy.","difficulty":"Standard","module":"LM 4","moduleTitle":"Monetary Policy"},{"id":17,"question":"Which is best classified as a non-state geopolitical actor?","options":{"A":"A national central bank.","B":"A multinational technology company.","C":"A sovereign ministry of finance."},"answer":"B","explanation":"Corporations, NGOs, media, and individuals are non-state actors. Central banks and ministries are state entities.","difficulty":"Standard","module":"LM 5","moduleTitle":"Introduction to Geopolitics"},{"id":18,"question":"A national election scheduled for six months from today is best classified as:","options":{"A":"event risk.","B":"exogenous risk.","C":"thematic risk."},"answer":"A","explanation":"The date is known in advance, although the outcome and market consequences are uncertain.","difficulty":"Standard","module":"LM 5","moduleTitle":"Introduction to Geopolitics"},{"id":19,"question":"Which institution primarily provides emergency balance-of-payments financing and monitors international monetary stability?","options":{"A":"World Bank.","B":"International Monetary Fund.","C":"World Trade Organization."},"answer":"B","explanation":"The IMF focuses on macroeconomic and external stability. The World Bank focuses on development; the WTO administers trade rules.","difficulty":"Standard","module":"LM 5","moduleTitle":"Introduction to Geopolitics"},{"id":20,"question":"Country A sacrifices two units of wine to produce one unit of cloth, while Country B sacrifices four units of wine. Country A has:","options":{"A":"a comparative advantage in cloth.","B":"an absolute advantage in wine.","C":"no basis for beneficial trade."},"answer":"A","explanation":"Country A has the lower opportunity cost of cloth and therefore comparative advantage in cloth.","difficulty":"Standard","module":"LM 6","moduleTitle":"International Trade"},{"id":21,"question":"For a small country, an import tariff most likely:","options":{"A":"increases national welfare through improved terms of trade.","B":"creates a net welfare loss despite government revenue.","C":"lowers the domestic price of the imported good."},"answer":"B","explanation":"A small country cannot influence the world price. Production and consumption distortions create deadweight loss.","difficulty":"Standard","module":"LM 6","moduleTitle":"International Trade"},{"id":22,"question":"A customs union differs from a free trade area because the customs union has:","options":{"A":"a common external trade policy.","B":"free movement of labor and capital.","C":"a common currency."},"answer":"A","explanation":"Free movement of factors defines a common market; a common currency defines a monetary union.","difficulty":"Standard","module":"LM 6","moduleTitle":"International Trade"},{"id":23,"question":"The exchange rate USD/EUR increases from 1.10 to 1.15. This means the:","options":{"A":"euro appreciated against the US dollar.","B":"US dollar appreciated against the euro.","C":"euro depreciated by 4.35%."},"answer":"A","explanation":"The quote is dollars per euro. A higher quote means one euro purchases more dollars, so the base currency euro appreciated.","difficulty":"Standard","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":24,"question":"The nominal rate is CAD/USD = 1.35, the US price index is 110, and the Canadian price index is 108. The real CAD/USD rate is closest to:","options":{"A":"1.33.","B":"1.38.","C":"1.51."},"answer":"B","explanation":"R = 1.35 × 110/108 = 1.375, approximately 1.38.","difficulty":"Standard","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":25,"question":"Given MXN/USD = 17.50 and USD/EUR = 1.08, MXN/EUR is closest to:","options":{"A":"16.20.","B":"18.58.","C":"18.90."},"answer":"C","explanation":"MXN/EUR = 17.50 × 1.08 = 18.90. Advanced Questions 26-50","difficulty":"Standard","module":"LM 8","moduleTitle":"Exchange Rate Calculations"}],"advanced":[{"id":1,"question":"A monopolistically competitive firm faces demand P = 120 - 2Q and marginal cost MC = 24 + 2Q. Its profit-maximizing quantity and price are closest to:","options":{"A":"Q = 16; P = 88.","B":"Q = 24; P = 72.","C":"Q = 32; P = 56."},"answer":"A","explanation":"For P = 120 - 2Q, MR = 120 - 4Q. Set MR = MC: 120 - 4Q = 24 + 2Q, so Q = 16. Price = 120 - 32 = 88.","difficulty":"Advanced","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":2,"question":"A natural monopoly has declining average total cost throughout the relevant demand range. If regulation requires price to equal marginal cost, the firm will most likely:","options":{"A":"earn positive economic profit.","B":"incur a loss unless subsidized.","C":"produce at minimum average total cost."},"answer":"B","explanation":"With declining ATC, MC is below ATC. Marginal-cost pricing therefore sets price below average cost.","difficulty":"Advanced","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":3,"question":"A market has shares of 35%, 25%, 20%, 10%, 5%, and 5%. If the 10% and one 5% firm merge, the new HHI and increase are closest to:","options":{"A":"2,500 and 100 points.","B":"2,650 and 100 points.","C":"2,650 and 150 points."},"answer":"A","explanation":"Initial HHI = 35²+25²+20²+10²+5²+5² = 2,400. Merger increase = 2×10×5 = 100. New HHI = 2,500.","difficulty":"Advanced","module":"LM 1","moduleTitle":"The Firm and Market Structures"},{"id":4,"question":"Equity prices are rising, the inventory-to-sales ratio is falling, and firms are increasing overtime before permanent hiring. The economy is most likely in:","options":{"A":"recovery.","B":"slowdown.","C":"contraction."},"answer":"A","explanation":"These are classic early-recovery signals: leading markets improve, inventories are depleted, and labor utilization increases before hiring.","difficulty":"Advanced","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":5,"question":"Which mechanism best describes a financial accelerator during a downturn?","options":{"A":"Falling collateral values tighten credit, which weakens spending and causes further asset-price declines.","B":"Lower tax revenue automatically increases the structural budget surplus.","C":"Rising inflation reduces real rates and always stabilizes output."},"answer":"A","explanation":"Collateral, leverage, and lending standards reinforce the initial shock and amplify the cycle.","difficulty":"Advanced","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":6,"question":"In the simple Keynesian model, the government increases purchases and lump-sum taxes by the same amount. The change in equilibrium output is most likely:","options":{"A":"zero.","B":"equal to the increase in spending.","C":"greater than the increase in spending by the full spending multiplier."},"answer":"B","explanation":"The balanced-budget multiplier equals one.","difficulty":"Advanced","module":"LM 3","moduleTitle":"Fiscal Policy"},{"id":7,"question":"The government adopts contractionary fiscal policy while the central bank adopts expansionary monetary policy. The most likely directional effects are:","options":{"A":"lower interest rates and a larger private-sector share of activity.","B":"higher interest rates and a larger public-sector share of activity.","C":"sharply higher inflation and a larger fiscal deficit."},"answer":"A","explanation":"Lower public borrowing and easier money both tend to reduce rates, stimulating private consumption and investment relative to public demand.","difficulty":"Advanced","module":"LM 3","moduleTitle":"Fiscal Policy"},{"id":8,"question":"A liquidity trap is most accurately described as a situation in which:","options":{"A":"money demand becomes highly interest elastic and additional reserves do not stimulate spending materially.","B":"inflation expectations rise without limit because the policy rate is high.","C":"a fixed exchange rate forces the central bank to buy domestic currency."},"answer":"A","explanation":"Near the lower bound, investors willingly hold additional money balances and conventional easing becomes weak.","difficulty":"Advanced","module":"LM 4","moduleTitle":"Monetary Policy"},{"id":9,"question":"An adverse oil supply shock raises inflation and reduces output. A central bank focused only on inflation would most likely tighten policy, which would:","options":{"A":"lower inflation pressure but deepen the output slowdown.","B":"raise both output and inflation.","C":"eliminate the policy trade-off."},"answer":"A","explanation":"A supply shock creates a trade-off: tightening restrains second-round inflation but further weakens demand and output.","difficulty":"Advanced","module":"LM 4","moduleTitle":"Monetary Policy"},{"id":10,"question":"An investor tracks troop mobilization, emergency legislation, and payment-system restrictions as indicators that a conflict scenario is becoming more likely. These indicators are best described as:","options":{"A":"diffusion indexes.","B":"geopolitical signposts.","C":"automatic stabilizers."},"answer":"B","explanation":"Signposts are observable developments used to update scenario probabilities and expected impacts.","difficulty":"Advanced","module":"LM 5","moduleTitle":"Introduction to Geopolitics"},{"id":11,"question":"After joining a customs union, a country replaces high-cost domestic production with lower-cost imports from a partner. This is:","options":{"A":"trade creation.","B":"trade diversion.","C":"an export subsidy."},"answer":"A","explanation":"Trade creation replaces inefficient domestic output with lower-cost member imports and tends to increase welfare.","difficulty":"Advanced","module":"LM 6","moduleTitle":"International Trade"},{"id":12,"question":"A large country may theoretically gain from a tariff if:","options":{"A":"tariff revenue exactly equals consumer loss.","B":"the improvement in its terms of trade exceeds domestic deadweight loss.","C":"imports become more elastic than exports."},"answer":"B","explanation":"Unlike a small country, a large importer may force foreign export prices lower, creating a terms-of-trade gain. Retaliation can eliminate it.","difficulty":"Advanced","module":"LM 6","moduleTitle":"International Trade"},{"id":13,"question":"A country has private saving of 22% of GDP, private investment of 27%, tax revenue of 18%, and government spending of 21%. Its trade balance is:","options":{"A":"an 8% surplus.","B":"an 8% deficit.","C":"a 2% deficit."},"answer":"B","explanation":"X-M = (S-I)+(T-G) = (22-27)+(18-21) = -5-3 = -8% of GDP.","difficulty":"Advanced","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":14,"question":"The CHF depreciates 20% against the EUR. The EUR appreciates against the CHF by:","options":{"A":"20%.","B":"25%.","C":"16.67%."},"answer":"B","explanation":"If the CHF's value becomes 0.80 of its original value, the reciprocal EUR value rises by 1/0.80 - 1 = 25%.","difficulty":"Advanced","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":15,"question":"A country wants a fixed exchange rate and independent monetary policy. According to the trilemma, it must most likely:","options":{"A":"restrict capital mobility.","B":"adopt a common currency.","C":"allow the exchange rate to float freely."},"answer":"A","explanation":"To preserve both a peg and monetary autonomy, the country must limit cross-border capital flows.","difficulty":"Advanced","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":16,"question":"A four-decimal spot quote is 1.3050 and the 180-day forward points are -4.25. The forward rate is closest to:","options":{"A":"1.30075.","B":"1.30458.","C":"1.30925."},"answer":"B","explanation":"F = 1.3050 - 4.25/10,000 = 1.304575, rounded to 1.30458.","difficulty":"Advanced","module":"LM 8","moduleTitle":"Exchange Rate Calculations"},{"id":17,"question":"The spot rate is USD/EUR = 1.2000. The six-month US rate is 5% annualized and the euro rate is 3% annualized. Using simple interest, the six-month forward USD/EUR is closest to:","options":{"A":"1.1882.","B":"1.2000.","C":"1.2118."},"answer":"C","explanation":"F = 1.2000 × [1+0.05(0.5)]/[1+0.03(0.5)] = 1.21182. The higher-rate USD is at a forward discount; the lower-rate EUR is at a premium.","difficulty":"Advanced","module":"LM 8","moduleTitle":"Exchange Rate Calculations"},{"id":18,"question":"For the data in Question 42, the market forward is 1.1900 rather than the parity forward. Relative to the parity relationship, the euro is most likely:","options":{"A":"overpriced in the forward market.","B":"underpriced in the forward market.","C":"correctly priced because the forward is below spot."},"answer":"B","explanation":"The no-arbitrage forward is 1.2118 USD/EUR. A market quote of 1.1900 offers euros too cheaply for future delivery, creating an arbitrage before costs.","difficulty":"Advanced","module":"LM 8","moduleTitle":"Exchange Rate Calculations"},{"id":19,"question":"The 90-day forward USD/GBP is 1.2750 and spot is 1.2500. The annualized forward premium on GBP, using a 360-day year, is closest to:","options":{"A":"2.0%.","B":"8.0%.","C":"10.0%."},"answer":"B","explanation":"(1.275/1.25 - 1) × 360/90 = 0.02 × 4 = 8%.","difficulty":"Advanced","module":"LM 8","moduleTitle":"Exchange Rate Calculations"},{"id":20,"question":"Given CHF/USD = 0.8800 and JPY/USD = 144.00, the CHF/JPY cross-rate is closest to:","options":{"A":"0.00611.","B":"126.72.","C":"163.64."},"answer":"A","explanation":"CHF/JPY = (CHF/USD)/(JPY/USD) = 0.8800/144.00 = 0.006111.","difficulty":"Advanced","module":"LM 8","moduleTitle":"Exchange Rate Calculations"},{"id":21,"question":"The nominal INR/USD rate rises 7%, US inflation is 3%, and Indian inflation is 5%. The approximate change in the real INR/USD rate is:","options":{"A":"5% increase.","B":"9% increase.","C":"1% decrease."},"answer":"A","explanation":"%ΔR 7% + 3% - 5% = 5%.≈","difficulty":"Advanced","module":"LM 8","moduleTitle":"Exchange Rate Calculations"},{"id":22,"question":"Which is most likely an objective of restrictions on capital inflows rather than outflows?","options":{"A":"Preventing residents from moving wealth abroad during a crisis.","B":"Limiting currency appreciation that harms export competitiveness.","C":"Ensuring domestic investors can purchase more foreign assets."},"answer":"B","explanation":"Large inflows can appreciate the currency, inflate asset prices, and weaken export competitiveness. Outflow controls are more closely associated with capital flight and defense of reserves.","difficulty":"Advanced","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":23,"question":"Immediately after a currency depreciation, a country's trade balance may worsen before improving because:","options":{"A":"trade quantities and contracts adjust more slowly than import prices.","B":"capital flows always offset the current account within one day.","C":"export demand becomes perfectly inelastic."},"answer":"A","explanation":"The J-curve reflects immediate valuation effects and delayed quantity responses.","difficulty":"Advanced","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"},{"id":24,"question":"A composite indicator shows 70% of its components improving, but the average improvement is small. The 70% figure primarily measures:","options":{"A":"the magnitude of growth.","B":"the breadth of improvement.","C":"the structural budget balance."},"answer":"B","explanation":"A diffusion index measures the proportion of components moving in the same direction, not the size of their changes.","difficulty":"Advanced","module":"LM 2","moduleTitle":"Understanding Business Cycles"},{"id":25,"question":"A country with a current account deficit, a fixed exchange rate, free capital mobility, and an independently chosen policy rate faces the greatest internal inconsistency because:","options":{"A":"comparative advantage prohibits current account deficits.","B":"the policy trilemma makes the exchange-rate and monetary objectives jointly unsustainable without intervention or policy adjustment.","C":"covered interest parity requires the current account to equal zero."},"answer":"B","explanation":"With open capital markets, maintaining the fixed rate forces domestic monetary conditions to align with the anchor currency. Persistent independent rate choices create capital-flow and reserve pressure.","difficulty":"Advanced","module":"LM 7","moduleTitle":"Capital Flows and the FX Market"}],"traps":[{"id":1,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Profit maximization occurs where MR equals MC","trap":"Choosing the output that maximizes total revenue, minimizes average cost, or produces the highest margin per unit.","definition":"A profit-maximizing firm produces the quantity at which marginal revenue equals marginal cost, provided the relevant operating condition is met. After finding that quantity, determine price from the demand curve when the firm faces downward-sloping demand."},{"id":2,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Breakeven and shutdown are different thresholds","trap":"Using total cost to decide whether a firm should shut down in the short run.","definition":"Breakeven occurs where total revenue equals total cost, or price equals average total cost. The short-run shutdown point occurs where total revenue equals total variable cost, or price equals minimum average variable cost."},{"id":3,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"A short-run accounting loss does not automatically require shutdown","trap":"Concluding that a firm should stop production whenever price is below average total cost.","definition":"If price covers average variable cost but not average total cost, the firm minimizes its loss by operating in the short run because it contributes toward fixed costs. Shut down only when price is below average variable cost."},{"id":4,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Fixed costs do not determine the short-run shutdown decision","trap":"Including unavoidable fixed costs when comparing the benefit of operating with the benefit of shutting down.","definition":"Fixed costs are incurred whether the firm produces or not. The short-run shutdown decision depends on whether revenue covers variable cost."},{"id":5,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"The long-run exit decision is stricter than the short-run shutdown decision","trap":"Applying the average variable cost shutdown rule to a long-run decision.","definition":"In the long run, all inputs and costs are variable. A firm exits if it cannot cover total economic cost, including the opportunity cost of capital."},{"id":6,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Economies of scale are a long-run cost concept","trap":"Treating a decline in average variable cost from using a fixed plant more intensively as proof of economies of scale.","definition":"Economies of scale occur when long-run average cost falls as all inputs and output increase. Short-run cost behavior includes at least one fixed input and is not the same concept."},{"id":7,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Minimum efficient scale is not the maximum feasible output","trap":"Defining minimum efficient scale as the largest quantity a plant can produce.","definition":"Minimum efficient scale is the smallest output level at which the firm reaches the minimum region of its long-run average cost curve and has exhausted available economies of scale."},{"id":8,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"A perfectly competitive firm is a price taker, not an industry price setter","trap":"Using the downward-sloping market demand curve as the individual firm demand curve.","definition":"The market demand curve slopes downward, but an individual perfectly competitive firm faces a horizontal demand curve at the market price, so price equals average revenue and marginal revenue."},{"id":9,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Zero long-run economic profit does not mean zero accounting profit","trap":"Interpreting normal profit in perfect competition as no compensation for owners or invested capital.","definition":"Zero economic profit means revenue covers all explicit and implicit opportunity costs, including a normal return on capital. Accounting profit can remain positive."},{"id":10,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"A monopolist does not set price where price equals marginal cost","trap":"Applying the perfectly competitive pricing condition directly to a monopoly.","definition":"A monopolist chooses output where marginal revenue equals marginal cost and then charges the price indicated by the demand curve. With downward-sloping demand, price generally exceeds marginal revenue and marginal cost."},{"id":11,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Monopoly power does not eliminate the demand constraint","trap":"Assuming a monopolist can choose any price and quantity independently.","definition":"A monopolist controls quantity supplied but remains constrained by market demand. A higher price generally requires accepting a lower quantity sold."},{"id":12,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Monopolistic competition has zero long-run economic profit but remains allocatively inefficient","trap":"Assuming free entry forces both price and marginal cost to equality in long-run monopolistic competition.","definition":"Entry drives economic profit to zero, but differentiated products leave each firm with downward-sloping demand. In long-run equilibrium, price exceeds marginal cost and the firm typically operates with excess capacity."},{"id":13,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Product differentiation reduces substitutability; it does not create pure monopoly","trap":"Classifying every firm with branding, advertising, or a differentiated product as a monopolist.","definition":"Monopolistic competitors have differentiated products but face many rivals and relatively low entry barriers. Their demand is downward sloping but usually more elastic than a monopolist's demand."},{"id":14,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Oligopoly is defined by strategic interdependence, not merely by a small firm count","trap":"Identifying an oligopoly solely from a high concentration ratio without considering entry barriers, product characteristics, or firm behavior.","definition":"Oligopolists must consider competitors' reactions when choosing price, output, capacity, or advertising. Concentration measures are evidence, not conclusive proof of market structure."},{"id":15,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"The kinked-demand model explains price rigidity, not the original price level","trap":"Using the kinked-demand model to calculate the unique profit-maximizing price for an oligopolist.","definition":"The model assumes rivals match price cuts but not price increases, creating a kink and a discontinuous marginal revenue curve. It explains why an established price may remain stable, not how that price was first determined."},{"id":16,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Cournot and Nash are related but not identical concepts","trap":"Treating every Nash equilibrium as a Cournot equilibrium.","definition":"Cournot is a specific simultaneous quantity-setting model in which each firm treats rivals' output as given. Nash equilibrium is the broader condition in which no participant can improve its outcome by changing strategy unilaterally."},{"id":17,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"Stackelberg gives the leader a first-mover role","trap":"Assuming Stackelberg and Cournot firms choose quantities simultaneously and earn identical profits.","definition":"In Stackelberg competition, the leader commits to output first and the follower reacts. The leader generally produces more and earns more than in the simultaneous Cournot outcome."},{"id":18,"module":"LM 1","moduleTitle":"The Firm and Market Structures","term":"HHI and concentration ratios are not interchangeable","trap":"Calculating the Herfindahl-Hirschman Index by simply adding the market shares of the largest firms.","definition":"A concentration ratio adds the shares of a selected number of firms. HHI sums the squared market shares of all firms, giving greater weight to large firms. Both measures ignore factors such as potential entry and demand elasticity."},{"id":19,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"A slowdown is not necessarily a contraction","trap":"Assuming that slowing growth means total output is already falling.","definition":"During a slowdown, output can remain above potential and continue to rise, but at a decelerating rate. A contraction begins when actual output falls below potential and may include an absolute decline in activity."},{"id":20,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Recovery begins near the trough, before the economy is fully healthy","trap":"Waiting for above-potential output or low unemployment before identifying a recovery.","definition":"Recovery begins when the negative output gap is largest and starts to narrow. Activity remains below potential, unemployment can remain high, and inflation is usually moderate."},{"id":21,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Expansion and recovery are not the same phase","trap":"Calling every increase in output after a recession an expansion phase.","definition":"Recovery closes the negative output gap. Expansion follows as growth becomes above average and actual output rises above potential, often producing tighter resource markets and rising inflation."},{"id":22,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Classical, growth, and growth-rate cycles have different turning points","trap":"Assuming a peak or trough occurs on the same date under every business-cycle definition.","definition":"The classical cycle tracks the level of activity, the growth cycle tracks deviations from potential output, and the growth-rate cycle tracks changes in the rate of growth. Growth-rate turning points generally occur earliest."},{"id":23,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Financial markets can turn before reported economic data","trap":"Using current equity-market weakness as proof that the economy is already in contraction.","definition":"Asset prices incorporate expectations. Equity markets commonly trough before the economy and are classified as leading indicators, so market turning points can precede economic turning points by months."},{"id":24,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Employment is usually a lagging response","trap":"Expecting firms to hire immediately when sales begin to recover.","definition":"Firms first increase hours, overtime, and temporary employment, then hire permanent workers after the recovery is confirmed. In contraction, they first cut hours and hiring before making layoffs."},{"id":25,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"The unemployment rate can keep falling during a slowdown","trap":"Treating any decline in the unemployment rate as proof that growth is accelerating.","definition":"Labor-market data lag. During slowdown, hiring may continue at a slower pace and unemployment may still fall even as output growth decelerates."},{"id":26,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"The inventory-sales ratio often rises near the peak, not early in recovery","trap":"Assuming inventories always rise when the economy starts improving.","definition":"Early in recovery, sales can outpace production and inventories may fall. Near the top of the cycle, sales slow before production adjusts, causing inventories and the inventory-sales ratio to rise."},{"id":27,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Capital spending is procyclical but adjusts slowly","trap":"Assuming firms immediately sell physical capital when demand weakens.","definition":"Firms can cancel new orders quickly, but the existing capital stock adjusts slowly through lower maintenance, aging, and reduced replacement. Capital investment typically strengthens after recovery is established."},{"id":28,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Credit cycles can amplify business cycles","trap":"Treating credit conditions as unrelated to the depth of expansions and recessions.","definition":"Loose credit can support leverage, asset-price booms, construction, and stronger expansions. Credit contraction and financial disruption can make recessions longer and deeper. Credit cycles are often longer, deeper, and sharper than business cycles."},{"id":29,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Leading indicators are predictive, not infallible","trap":"Assuming a single leading indicator provides a certain recession signal.","definition":"Leading indicators tend to turn before the economy, coincident indicators track current conditions, and lagging indicators confirm established trends. Signals can be revised, noisy, or distorted, so analysts use groups of indicators."},{"id":30,"module":"LM 2","moduleTitle":"Understanding Business Cycles","term":"Nowcasting is not long-horizon forecasting","trap":"Using a nowcast as a multi-year economic projection.","definition":"Nowcasting combines timely data to estimate the economy's current or very recent condition before official statistics are available. It does not eliminate model error or replace longer-term forecasts."},{"id":31,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Fiscal policy belongs to government; monetary policy belongs to the central bank","trap":"Classifying a policy-rate cut as fiscal stimulus or a tax cut as monetary easing.","definition":"Fiscal policy changes taxes, transfers, and government spending. Monetary policy changes money and credit conditions through central-bank tools."},{"id":32,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"A budget deficit is a flow; national debt is a stock","trap":"Using the current-year deficit and the outstanding government debt as equivalent measures.","definition":"The deficit is the excess of expenditure over revenue during a period. National debt is the accumulated outstanding borrowing from current and prior deficits, net of surpluses and repayments."},{"id":33,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"The actual deficit can misstate the fiscal stance","trap":"Calling fiscal policy expansionary simply because the observed deficit is large during a recession.","definition":"Automatic stabilizers make the actual deficit cyclical. The structural, or cyclically adjusted, deficit estimates the budget position at full employment and is the better measure of discretionary fiscal stance."},{"id":34,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"The net budget effect determines the fiscal stance","trap":"Calling an increase in government spending expansionary without considering simultaneous tax increases or spending cuts elsewhere.","definition":"Expansionary fiscal policy increases the deficit or reduces the surplus; contractionary policy reduces the deficit or increases the surplus. Evaluate the combined effect of all policy changes."},{"id":35,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Automatic stabilizers require no new legislation","trap":"Classifying a newly approved infrastructure project as an automatic stabilizer.","definition":"Progressive taxes and unemployment benefits automatically dampen the cycle as income and employment change. New tax rates, transfers, or spending programs are discretionary fiscal policy."},{"id":36,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Government spending has a larger first-round effect than an equal tax cut","trap":"Assuming an equal spending increase and tax reduction have identical effects on aggregate demand.","definition":"Government purchases enter aggregate demand directly. Only the consumed portion of a tax cut enters spending, so the absolute tax multiplier is generally smaller than the government-spending multiplier."},{"id":37,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"A higher tax rate or saving rate reduces the fiscal multiplier","trap":"Expecting the multiplier to increase when more of each additional income dollar is taxed or saved.","definition":"Leakages reduce induced spending. With proportional taxes, the spending multiplier is 1 / [1 - MPC(1 - t)]; a higher tax rate or lower MPC reduces the multiplier."},{"id":38,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"The balanced-budget multiplier is not zero","trap":"Assuming equal increases in government spending and taxes have no effect on output.","definition":"Because the spending increase affects demand dollar for dollar while the tax increase reduces consumption only by the MPC portion, the balanced-budget multiplier is one under the standard model."},{"id":39,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Ricardian equivalence weakens debt-financed tax stimulus","trap":"Assuming households always spend the full amount of a tax cut financed by new government borrowing.","definition":"If households anticipate that current borrowing implies future taxes, they may save the tax cut rather than raise consumption. Complete Ricardian equivalence is an assumption, not an empirical certainty."},{"id":40,"module":"LM 3","moduleTitle":"Fiscal Policy","term":"Fiscal policy faces crowding out and multiple implementation lags","trap":"Treating a legislated fiscal package as immediate, precisely calibrated stimulus with no effect on private financing.","definition":"Recognition, action, and impact lags reduce precision. Government borrowing can raise interest rates or absorb available savings, crowding out private investment, particularly near full employment or without monetary accommodation."},{"id":41,"module":"LM 4","moduleTitle":"Monetary Policy","term":"The central bank has roles beyond setting the policy rate","trap":"Reducing the central bank's function to inflation control alone.","definition":"Central banks commonly issue currency, act as banker to government and banks, serve as lender of last resort, oversee payments, supervise banking, and conduct monetary policy."},{"id":42,"module":"LM 4","moduleTitle":"Monetary Policy","term":"An open-market purchase is expansionary","trap":"Assuming the central bank reduces money supply when it purchases securities.","definition":"A central-bank purchase pays reserves into the banking system, increasing liquidity and placing downward pressure on short-term rates. A sale withdraws reserves and is contractionary."},{"id":43,"module":"LM 4","moduleTitle":"Monetary Policy","term":"A lower refinancing or policy rate is monetary easing","trap":"Interpreting a lower central-bank lending rate as tighter credit conditions.","definition":"Lower policy rates reduce the cost of short-term funds and, if transmitted, encourage borrowing and spending. Higher policy rates are contractionary."},{"id":44,"module":"LM 4","moduleTitle":"Monetary Policy","term":"A higher reserve requirement is contractionary","trap":"Assuming banks can expand lending when required reserves increase.","definition":"Higher reserve requirements reduce the portion of deposits available to support lending and money creation. Frequent changes are disruptive, so this tool is used less often in many developed systems."},{"id":45,"module":"LM 4","moduleTitle":"Monetary Policy","term":"The central bank cannot mechanically control the broad money supply","trap":"Applying the simple money multiplier as if banks always lend all excess reserves and the public holds a fixed deposit ratio.","definition":"Money creation depends on banks' willingness to lend and borrowers' willingness to borrow, as well as cash holdings and regulation. Central-bank control is influential but incomplete."},{"id":46,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Monetary transmission is neither direct nor instantaneous","trap":"Assuming a policy-rate change immediately produces an equal change in inflation.","definition":"Policy affects money-market rates, bank lending, asset prices, expectations, exchange rates, spending, output, and finally inflation, with uncertain magnitudes and lags."},{"id":47,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Nominal and real policy rates must not be confused","trap":"Calling a positive nominal policy rate restrictive without considering inflation or the neutral rate.","definition":"The real policy rate is approximately the nominal rate minus expected inflation. Whether policy is expansionary or contractionary depends on the rate relative to the neutral rate, not merely whether the nominal rate is positive."},{"id":48,"module":"LM 4","moduleTitle":"Monetary Policy","term":"The neutral nominal rate is an estimate, not an observable constant","trap":"Treating the neutral rate as a fixed number known with certainty.","definition":"A common approximation is real trend growth plus the inflation target. Estimates change with productivity, demographics, risk preferences, and economic conditions."},{"id":49,"module":"LM 4","moduleTitle":"Monetary Policy","term":"A policy rate above neutral is contractionary; below neutral is expansionary","trap":"Classifying policy only from whether the central bank raised or cut rates at its latest meeting.","definition":"The level relative to neutral determines stance. A rate cut can leave policy contractionary if the rate remains above neutral, and a rate increase can leave policy expansionary if it remains below neutral."},{"id":50,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Independence, credibility, and transparency are distinct qualities","trap":"Using the three terms as synonyms.","definition":"Independence limits short-term political interference, credibility makes commitments believable, and transparency explains objectives and decisions. Together they help anchor expectations."},{"id":51,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Inflation targeting is not a guarantee of exact inflation","trap":"Treating a 2 percent target as a promise that every reported inflation rate will equal 2 percent.","definition":"Inflation targets are generally medium-term and may include a range or tolerance band. Supply shocks and transmission lags can cause temporary deviations."},{"id":52,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Exchange-rate targeting constrains domestic monetary policy","trap":"Assuming a central bank can maintain a credible fixed exchange rate, free capital mobility, and fully independent interest-rate policy at the same time.","definition":"Defending an exchange-rate target can require reserve transactions and interest-rate alignment with the anchor currency. Credibility and adequate reserves are essential, and monetary independence is reduced."},{"id":53,"module":"LM 4","moduleTitle":"Monetary Policy","term":"A supply shock creates a policy trade-off","trap":"Responding to every increase in inflation with tighter policy without identifying the source of inflation.","definition":"Demand-driven inflation can be reduced by restraining aggregate demand. An adverse supply shock raises prices while weakening output, so aggressive tightening can worsen the output decline."},{"id":54,"module":"LM 4","moduleTitle":"Monetary Policy","term":"A liquidity trap limits conventional easing; QE remains expansionary","trap":"Assuming very low policy rates guarantee stronger lending and spending, or that quantitative easing is contractionary because bond yields fall.","definition":"In a liquidity trap, additional money or lower short rates may not stimulate demand. Quantitative easing purchases longer-term assets to add reserves, reduce yields, support asset prices, and improve financial conditions."},{"id":55,"module":"LM 4","moduleTitle":"Monetary Policy","term":"Monetary and fiscal policy mixes change both output and composition","trap":"Assuming easy fiscal policy and tight monetary policy have the same effects as tight fiscal policy and easy monetary policy.","definition":"The first mix tends to raise interest rates and the public-sector share of activity; the second tends to lower rates and support private demand. Coordinated easy policies are strongly expansionary, while coordinated tight policies are contractionary."},{"id":56,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"State and non-state actors are not interchangeable","trap":"Treating multinational companies, NGOs, and armed groups as governments because they influence international outcomes.","definition":"State actors are national governments and their agencies. Non-state actors can exert economic, social, technological, or security influence but do not possess the same sovereign powers."},{"id":57,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Resource abundance can reduce the need for cooperation","trap":"Assuming countries with abundant strategic resources must cooperate more deeply than resource-poor countries.","definition":"Countries lacking essential resources often depend more on external cooperation. Resource-rich states may have greater bargaining power and may choose more independent behavior."},{"id":58,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Globalization can create aggregate gains and concentrated losses simultaneously","trap":"Rejecting globalization benefits because some industries or workers lose, or assuming aggregate gains mean every group benefits.","definition":"Trade, capital, technology, and labor mobility can raise total efficiency and choice while imposing adjustment costs and unequal gains. Distribution and aggregate welfare are different questions."},{"id":59,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Greater interdependence can lower conflict incentives but increase vulnerability","trap":"Assuming global integration either eliminates geopolitical risk or always makes it worse.","definition":"Cooperation raises the cost of conflict, but interconnected supply chains and financial systems transmit shocks more quickly. Likelihood and vulnerability must be assessed separately."},{"id":60,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"The IMF, World Bank, and WTO have different mandates","trap":"Selecting the World Bank to enforce trade rules or the WTO to provide balance-of-payments financing.","definition":"The IMF promotes monetary cooperation and financial stability and can provide temporary financing. The World Bank focuses on long-term development and poverty reduction. The WTO administers trade rules and dispute mechanisms."},{"id":61,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Autarky is not bilateralism","trap":"Classifying a country with intensive relationships with one strategic partner as autarkic.","definition":"Autarky emphasizes political and economic self-sufficiency with little external cooperation. Bilateralism concentrates cooperation between two countries or within limited partner relationships."},{"id":62,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Hegemony and multilateralism differ mainly in cooperation","trap":"Treating a highly globalized hegemon as automatically multilateral.","definition":"Both can be globally integrated. A hegemon uses power to establish or enforce standards, whereas multilateralism relies more on mutually agreed rules, broad cooperation, and harmonization."},{"id":63,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Event, exogenous, and thematic geopolitical risks differ by timing","trap":"Calling an election exogenous or an unexpected invasion an event risk solely because both affect markets.","definition":"Event risk centers on known dates or milestones; exogenous risk is sudden and unanticipated; thematic risk is known but evolves over a longer period, such as cyber threats, migration, or climate-related tension."},{"id":64,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"The threat of an event can matter more than the event itself","trap":"Assuming markets react only when geopolitical events occur.","definition":"Uncertainty can delay investment, hiring, and capital spending before an event. Once uncertainty is resolved, even an adverse outcome may have less incremental impact than the prior threat."},{"id":65,"module":"LM 5","moduleTitle":"Introduction to Geopolitics","term":"Geopolitical analysis is dynamic, not a one-time country label","trap":"Assigning an archetype or risk score and assuming it remains stable.","definition":"Investors assess likelihood, impact, velocity, transmission channels, and signposts. Changes in cooperation, leadership, institutions, tools, and alliances can move a country across archetypes and alter comparative advantage."},{"id":66,"module":"LM 6","moduleTitle":"International Trade","term":"Comparative advantage depends on opportunity cost, not absolute productivity","trap":"Assuming the country that can produce every good with fewer resources has nothing to gain from trade.","definition":"Even a country with an absolute advantage in all goods can gain by specializing in the goods for which it has the lowest opportunity cost and trading for the rest."},{"id":67,"module":"LM 6","moduleTitle":"International Trade","term":"A small country tariff does not change the world price","trap":"Assuming a small importing country can force foreign exporters to absorb its tariff through a lower world price.","definition":"A small country is a price taker. The domestic price rises by the tariff, while the world price is unchanged."},{"id":68,"module":"LM 6","moduleTitle":"International Trade","term":"Tariff revenue does not eliminate the welfare loss","trap":"Adding producer gains and government revenue while ignoring consumer losses.","definition":"Consumers lose from higher prices and lower consumption. Domestic producers gain and the government receives tariff revenue, but production and consumption distortions create deadweight losses."},{"id":69,"module":"LM 6","moduleTitle":"International Trade","term":"A large-country tariff can improve terms of trade, but not automatically welfare","trap":"Concluding that a tariff is beneficial whenever the importing country is large.","definition":"A large country may lower the foreign export price and obtain a terms-of-trade gain, but the gain must exceed domestic deadweight losses and possible retaliation for national welfare to rise."},{"
