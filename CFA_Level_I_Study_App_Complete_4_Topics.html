rting or warning the employee is not enough."},{"id":48,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"Can a recommendation be wrong without violating Standard V(A)?","definition":"Yes. Compliance depends on having a reasonable and adequate basis, appropriate diligence, and independent judgment at the time - not on whether the forecast later proves correct."},{"id":49,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What diligence is required before relying on third-party research?","definition":"Assess the provider's independence, assumptions, methodology, data quality, timeliness, and objectivity. A member need not guarantee accuracy but must have a reasonable basis for relying on it."},{"id":50,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What diligence is required when using quantitative models?","definition":"Understand the model's assumptions, inputs, limitations, and sensitivity to abnormal conditions; test outputs where appropriate; and avoid relying blindly on vendor or internally generated models."},{"id":51,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What must be communicated about services and costs under Standard V(B)?","definition":"Clearly disclose the nature of the services provided and the costs clients will bear, including relevant fee structures and material limitations."},{"id":52,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"What must clients know about the investment process?","definition":"The basic format and general principles of the process, material risks and limitations, and significant changes that could affect recommendations or portfolio management."},{"id":53,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"How should facts and opinions be presented in research?","definition":"Clearly distinguish verifiable facts from forecasts, estimates, judgments, and opinions. Reasonable assumptions may be used, but they must not be presented as established facts."},{"id":54,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"How long should investment records be retained?","definition":"Follow applicable law and firm policy. When neither specifies a period, CFA Institute recommends at least seven years."},{"id":55,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What does Standard VI(A) Avoid or Disclose Conflicts require?","definition":"Avoid conflicts when reasonably possible. Otherwise make full and fair disclosure of matters that could impair independence or objectivity or interfere with duties to clients, prospective clients, or the employer."},{"id":56,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What makes a conflict disclosure effective?","definition":"It must be prominent, written in plain language, complete enough to explain the nature and potential effect of the conflict, timely, and communicated effectively."},{"id":57,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What is beneficial ownership?","definition":"Ultimately owning, controlling, directing, voting, disposing of, or having a material direct or indirect financial interest in an investment. Family accounts are included when such an interest or control exists."},{"id":58,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What is the priority of transactions under Standard VI(B)?","definition":"Transactions for clients and employers must have priority over transactions in which the member or candidate is a beneficial owner. Personal trading is allowed only after clients and the employer have had an adequate opportunity to act."},{"id":59,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"What is front-running?","definition":"Trading personally or for another favored account before an anticipated client or employer transaction in order to benefit from the expected market impact."},{"id":60,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"When and to whom must referral compensation be disclosed?","definition":"Disclose to the employer, clients, and prospective clients, as appropriate, before they enter the relevant service relationship so they can evaluate total cost and possible bias. Disclose all forms of consideration."},{"id":61,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"What CFA exam information is confidential?","definition":"Actual questions, formulas required or not required, and both broad and specific topics tested or not tested. Soliciting, sharing, or using such information violates Standard VII(A)."},{"id":62,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"May candidates criticize CFA Institute or say an exam was difficult?","definition":"Yes. Personal opinions about policies, procedures, difficulty, or the program are allowed as long as no confidential exam content or tested subject matter is disclosed."},{"id":63,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"How should the CFA designation be used?","definition":"Use CFA as an adjective after a person's name or in 'CFA charterholder.' Do not use it as a noun, company name, nickname, social media handle, or partial designation."},{"id":64,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"How may someone describe candidacy in the CFA Program?","definition":"Use factual language such as 'Level II candidate in the CFA Program' only while registered for that exam or awaiting results. Passing a level does not create a partial designation."},{"id":65,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"What happens if a charterholder does not pay dues or complete the annual Professional Conduct Statement?","definition":"The person becomes inactive and may not use the CFA designation until membership requirements are restored. The charter is not automatically revoked or permanently forfeited."},{"id":66,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"What claims about the CFA designation are prohibited?","definition":"Claims or implications of superior investment performance, guaranteed competence, lower risk, or better results because of the charter. Factual descriptions of the program or completion history are acceptable."},{"id":67,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Does client confidentiality prevent cooperation with a CFA Institute Professional Conduct investigation?","definition":"No. The confidentiality standard is not intended to block cooperation with an authorized Professional Conduct investigation, subject to applicable law."},{"id":68,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"What is the 'legal but unethical' exam trap?","definition":"Local law may permit conduct that the Code and Standards prohibit. When the Code or another applicable rule is stricter, the member or candidate must follow the stricter requirement."},{"id":69,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Can a client's instruction justify insider trading, manipulation, or another Standards violation?","definition":"No. Duties to clients never authorize violating law, the Code and Standards, or market integrity. Refuse the instruction and dissociate when necessary."},{"id":70,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"What is the recurring Ethics exam sequence for handling a conflict or violation?","definition":"Identify the client and duties, apply the strictest rule, avoid the conflict when possible, disclose fully when avoidance is impractical, obtain required written consent, document the action, and dissociate from ongoing violations."}],"standard":[{"id":1,"difficulty":"standard","question":"A member works in a jurisdiction with no law prohibiting trading on material nonpublic information. The member receives reliable nonpublic information that a company will be acquired and purchases shares. The member most likely:","options":{"A":"complies because local law is silent.","B":"violates Standard I(A) and Standard II(A).","C":"violates Standard II(B) only."},"answer":"B","explanation":"The Code and Standards apply when local law is less strict or silent. Trading on material nonpublic information violates II(A), and failure to follow the stricter Standards also implicates I(A).","module":"LM 11","moduleTitle":"Application of the Code and Standards"},{"id":2,"difficulty":"standard","question":"A broker gives an analyst a modest promotional notebook bearing the broker's logo. The analyst accepts it. This action is most likely:","options":{"A":"acceptable because the item is token and unlikely to compromise objectivity.","B":"a violation unless every client consents in writing.","C":"a violation because all broker gifts are prohibited."},"answer":"A","explanation":"I(B) applies a reasonableness test. Token promotional items are generally acceptable when they are not intended or likely to influence judgment.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":3,"difficulty":"standard","question":"An analyst uses several paragraphs from an industry consultant's unpublished report without attribution but changes some words. The analyst most likely violates:","options":{"A":"I(C) Misrepresentation.","B":"II(A) Material Nonpublic Information only.","C":"V(C) Record Retention only."},"answer":"A","explanation":"Paraphrasing does not eliminate the obligation to attribute another person's original analysis. The conduct is plagiarism and misrepresentation.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":4,"difficulty":"standard","question":"A candidate receives a speeding ticket while driving on vacation. No client or professional activity is involved. The ticket most likely:","options":{"A":"violates I(D) because all illegal conduct is misconduct.","B":"does not violate I(D) absent an adverse implication for professional integrity or competence.","C":"violates VII(A) because candidates must disclose all legal infractions publicly."},"answer":"B","explanation":"I(D) does not cover every personal legal violation. The relevant question is whether the act involves dishonesty or reflects adversely on professional integrity or competence.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":5,"difficulty":"standard","question":"A newly promoted manager is assigned to approve complex structured products but does not understand their material risks. The most directly applicable Standard is:","options":{"A":"I(E) Competence.","B":"III(B) Fair Dealing.","C":"VI(C) Referral Fees."},"answer":"A","explanation":"The manager lacks the role-specific knowledge and skills needed to perform the responsibility competently.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":6,"difficulty":"standard","question":"An analyst combines public supplier data with nonmaterial nonpublic observations from store managers and reaches a material earnings conclusion. Trading on the conclusion is most likely:","options":{"A":"prohibited because the conclusion is material.","B":"permitted under mosaic theory if no component is material nonpublic information.","C":"permitted only after the issuer confirms the conclusion privately."},"answer":"B","explanation":"Mosaic theory allows conclusions based on public information plus nonmaterial nonpublic information.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":7,"difficulty":"standard","question":"A trader places matched buy and sell orders solely to create the appearance of activity in an illiquid security. The trader violates:","options":{"A":"II(B) Market Manipulation.","B":"III(C) Suitability.","C":"IV(B) Additional Compensation Arrangements."},"answer":"A","explanation":"The transaction is intended to mislead market participants about volume and possibly price.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":8,"difficulty":"standard","question":"A manager of a defined benefit pension plan receives instructions from the sponsoring company's CFO to invest heavily in the company's stock. The manager's primary loyalty is owed to:","options":{"A":"the CFO.","B":"the sponsoring company's shareholders.","C":"plan beneficiaries."},"answer":"C","explanation":"The beneficiaries are the actual clients for purposes of III(A).","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":9,"difficulty":"standard","question":"A firm provides enhanced reporting to clients who pay an additional fee and discloses the service tiers to all clients. This practice is most likely:","options":{"A":"prohibited because every client must receive identical service.","B":"permitted if recommendations are still disseminated fairly.","C":"permitted only for institutional clients."},"answer":"B","explanation":"Fair dealing does not require identical service. Different disclosed service levels are acceptable if no group receives an unfair trading advantage.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":10,"difficulty":"standard","question":"A client requests a trade that would materially violate the client's IPS. The adviser explains the issue, but the client refuses to amend the IPS. The adviser should most likely:","options":{"A":"execute after obtaining a general waiver.","B":"refuse the trade.","C":"execute because all unsolicited trades are exempt from suitability."},"answer":"B","explanation":"A materially unsuitable trade that conflicts with the mandate should not be executed unless the IPS is appropriately revised.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":11,"difficulty":"standard","question":"A manager advertises a single account's 30% return as “our clients earned 30% last year” without explaining that most accounts earned substantially less. The manager most likely violates:","options":{"A":"III(D) Performance Presentation.","B":"IV(C) Responsibilities of Supervisors only.","C":"VII(B) Reference to CFA Institute."},"answer":"A","explanation":"The statement is not fair, accurate, and complete because it cherry-picks one account and generalizes the result.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":12,"difficulty":"standard","question":"A client gives written permission for a manager to discuss the client's investment experience at an educational seminar. Disclosure is most likely:","options":{"A":"prohibited under all circumstances.","B":"permitted within the scope of the client's authorization and applicable law.","C":"permitted only if the client's name is included."},"answer":"B","explanation":"Client consent is an exception to confidentiality, subject to law and the terms of the permission.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":13,"difficulty":"standard","question":"Before resigning, an employee leases office space for a future advisory firm but does not solicit clients or use employer records. The employee most likely:","options":{"A":"violates IV(A) merely by preparing to compete.","B":"complies with IV(A).","C":"violates VI(B) Priority of Transactions."},"answer":"B","explanation":"Preparations to compete are generally permissible if the employee continues to perform duties and does not solicit clients or harm the employer.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":14,"difficulty":"standard","question":"A client offers a portfolio manager an annual performance bonus. Before accepting, the manager must most likely obtain:","options":{"A":"oral permission from the client only.","B":"written consent from all parties involved.","C":"approval from CFA Institute."},"answer":"B","explanation":"IV(B) requires written consent from all parties, including the employer and client, for additional compensation that may create a conflict.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":15,"difficulty":"standard","question":"A supervisor delegates daily trade monitoring to a compliance officer. The delegation:","options":{"A":"eliminates the supervisor's responsibility.","B":"is prohibited because supervision can never be delegated.","C":"is permitted, but the supervisor remains responsible for reasonable overall controls."},"answer":"C","explanation":"Tasks may be delegated, but the supervisor must ensure that the system is adequate and functioning.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":16,"difficulty":"standard","question":"A manager changes a recommendation solely because another analyst at a reputable firm changed hers. Without additional investigation, the manager most likely violates:","options":{"A":"V(A) Diligence and Reasonable Basis.","B":"VI(C) Referral Fees.","C":"III(E) Preservation of Confidentiality."},"answer":"A","explanation":"Reputation alone does not substitute for assessing the basis and quality of third-party research.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":17,"difficulty":"standard","question":"A research report states, “The dividend will rise next quarter,” when the increase depends on uncertain legislation. The report most likely violates:","options":{"A":"V(B) because it presents an opinion as fact.","B":"II(A) because legislation is always MNPI.","C":"IV(A) because it harms the employer."},"answer":"A","explanation":"The uncertain forecast should be identified as opinion and its assumptions explained.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":18,"difficulty":"standard","question":"A member purchases a security for a personal account immediately before entering a large client buy order. The member most likely violates:","options":{"A":"VI(B) Priority of Transactions.","B":"III(E) Preservation of Confidentiality only.","C":"VII(A) Conduct as a Participant."},"answer":"A","explanation":"The member has front-run the client order and placed personal interests ahead of the client.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":19,"difficulty":"standard","question":"A financial adviser receives a fee from an external manager for every referred client. The adviser must disclose the arrangement most appropriately:","options":{"A":"after the client has invested.","B":"before the formal engagement, including the nature of the benefit.","C":"only to the employer."},"answer":"B","explanation":"VI(C) requires timely disclosure to relevant employers, clients, and prospects so they can evaluate cost and bias.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":20,"difficulty":"standard","question":"A firm has independently verified one composite but not its firmwide processes. It states, “Our growth composite is GIPS verified and compliant.” The statement is most likely:","options":{"A":"proper because verification may apply to one composite.","B":"improper because GIPS compliance and verification are firmwide concepts.","C":"proper if the composite has positive returns."},"answer":"B","explanation":"A firm cannot claim partial GIPS compliance, and verification applies to the firm as a whole rather than a selected composite.","module":"LM 10","moduleTitle":"Introduction to GIPS"}],"advanced":[{"id":21,"difficulty":"advanced","question":"An analyst accepts a luxury trip from an issuer after promising to publish independent research. The analyst discloses the trip in the report. Which statement is most accurate?","options":{"A":"Disclosure cures any potential violation.","B":"The analyst may still violate I(B) because a benefit that compromises objectivity should be refused.","C":"Only VI(C) applies because the trip is a referral fee."},"answer":"B","explanation":"Some conflicts may be disclosed, but I(B) requires independence and objectivity. A lavish issuer-paid benefit that could influence judgment should not be accepted merely because it is disclosed.","module":"LM 3","moduleTitle":"Standard I: Professionalism"},{"id":22,"difficulty":"advanced","question":"A member learns from a director that a company lost a major customer. The director says the information is confidential. Separately, public shipping data already show a sharp decline, and the member had independently reached a sell conclusion before the conversation. The member should most likely:","options":{"A":"trade because the conclusion was independently reached.","B":"refrain from trading until the material confidential information becomes public.","C":"trade only in client accounts, not personally."},"answer":"B","explanation":"Once the member possesses material nonpublic information, the member may not act even if a similar conclusion had previously been reached through a mosaic.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":23,"difficulty":"advanced","question":"A manager uses a tax-loss sale that temporarily increases reported market volume. The purpose is to realize a tax loss, and no effort is made to mislead others. The transaction most likely:","options":{"A":"violates II(B) because volume changed.","B":"does not violate II(B) absent intent to mislead.","C":"violates II(A) because tax information is nonpublic."},"answer":"B","explanation":"Market impact alone is not manipulation. Legitimate economic purpose and lack of misleading intent are decisive.","module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets"},{"id":24,"difficulty":"advanced","question":"A pension manager is instructed by the plan sponsor to direct trades to a broker that provides services to the sponsor but not to the plan. The broker's execution quality is acceptable but more expensive. The manager should most likely:","options":{"A":"comply because the sponsor hired the manager.","B":"evaluate whether the arrangement benefits beneficiaries and seek best execution within any valid direction.","C":"comply after disclosing the arrangement only to the sponsor."},"answer":"B","explanation":"The manager's duty is to beneficiaries. Directed brokerage must be evaluated for client benefit, cost, and best execution.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":25,"difficulty":"advanced","question":"A portfolio manager allocates an oversubscribed IPO pro rata among client accounts and the manager's personal account. The allocation policy treats all accounts identically. The manager most likely:","options":{"A":"complies because the allocation is mathematically equal.","B":"violates VI(B) because client accounts must have priority over beneficial personal accounts.","C":"violates III(C) only."},"answer":"B","explanation":"Fair allocation among clients does not place a personal account on the same priority level when the security is scarce.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":26,"difficulty":"advanced","question":"A client asks an adviser to purchase a speculative security. The position would equal 0.1% of a diversified portfolio and would not affect the portfolio's ability to meet objectives. The adviser believes the security is unsuitable viewed alone. The best response is to:","options":{"A":"automatically refuse the trade.","B":"discuss and document the concern and may execute if the total portfolio remains suitable.","C":"revise the client's risk tolerance upward permanently."},"answer":"B","explanation":"Suitability is judged in total-portfolio context. An unsolicited immaterial position may be executed after appropriate discussion and documentation.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":27,"difficulty":"advanced","question":"A former employee presents a six-year track record earned at a prior firm. The former employer gives written permission. The advertisement identifies the prior firm but omits that the employee was one of ten team members. The presentation most likely:","options":{"A":"complies because permission was obtained.","B":"violates III(D) because the person's role is material to a fair and complete presentation.","C":"violates IV(A) only."},"answer":"B","explanation":"Permission addresses use of records but does not eliminate the need to accurately describe source and role.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":28,"difficulty":"advanced","question":"A manager suspects an elderly client is being exploited by a relative. The client has not authorized disclosure, and no law clearly requires reporting. The manager's best initial action is to:","options":{"A":"send full account statements to the relative.","B":"follow firm procedures, consult legal or compliance staff, and contact an authorized trusted contact if permitted.","C":"immediately close the account and publish the concern."},"answer":"B","explanation":"Confidentiality still applies. A controlled process using authorized contacts and legal guidance balances protection and privacy.","module":"LM 5","moduleTitle":"Standard III: Duties to Clients"},{"id":29,"difficulty":"advanced","question":"Before resigning, an analyst memorizes the names of several clients and, after departure, contacts them using publicly available contact details. No agreement prohibits solicitation. The analyst most likely:","options":{"A":"automatically violates IV(A) because former clients can never be contacted.","B":"may contact them after departure if no confidential records were taken and law and agreements permit it.","C":"violates V(C) because memory is an employer record."},"answer":"B","explanation":"General memory and public information may be used after employment ends, subject to contracts and law. Taking records or soliciting before departure would differ.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":30,"difficulty":"advanced","question":"A supervisor learns that an employee may have allocated profitable trades to favored accounts. The supervisor asks the employee, who denies it, and takes no further action. The supervisor most likely:","options":{"A":"complies because the employee denied wrongdoing.","B":"violates IV(C) by failing to investigate and respond reasonably to a warning sign.","C":"violates II(A) only."},"answer":"B","explanation":"Reasonable supervision requires investigation, evidence review, and corrective action rather than reliance on an unsupported denial.","module":"LM 6","moduleTitle":"Standard IV: Duties to Employers"},{"id":31,"difficulty":"advanced","question":"A quantitative investment committee adopts a vendor model. Committee members understand the strategy but not the code. They review assumptions, validation results, data quality, stress behavior, and limitations. The members most likely:","options":{"A":"comply with V(A); writing the code themselves is not required.","B":"violate I(E) because every user must be a programmer.","C":"violate V(C) because vendor models cannot be documented."},"answer":"A","explanation":"Members need sufficient understanding to evaluate and use the model responsibly, not necessarily the ability to program it.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":32,"difficulty":"advanced","question":"A research analyst states that a security has “a 95% probability of losing no more than 4% next month” based on a VaR model. The report does not state that losses can exceed the estimate or describe the historical assumptions. The analyst most likely violates:","options":{"A":"V(B) Communication with Clients and Prospective Clients.","B":"VI(B) Priority of Transactions.","C":"VII(B) Reference to CFA Institute."},"answer":"A","explanation":"Material assumptions and limitations must be disclosed so the model is not presented with misleading precision.","module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions"},{"id":33,"difficulty":"advanced","question":"A member keeps employer research files on a personal laptop for weekend work. After being terminated, the member uses the files as work samples without permission. Which combination is most relevant?","options":{"A":"IV(A) Loyalty and V(C) Record Retention.","B":"II(B) Market Manipulation and III(C) Suitability.","C":"VI(C) Referral Fees and VII(A) Conduct as a Participant."},"answer":"A","explanation":"The files belong to the employer and are supporting records. Using them after termination without permission violates duties concerning employer property and records.","module":"LM 11","moduleTitle":"Application of the Code and Standards"},{"id":34,"difficulty":"advanced","question":"A manager owns shares in a company and recommends the shares to clients. The ownership is disclosed in small print on the final page of a lengthy report. The manager most likely:","options":{"A":"complies because any disclosure is sufficient.","B":"violates VI(A) because the disclosure is not prominent or effective.","C":"violates VI(B) even if no personal trade occurs."},"answer":"B","explanation":"Conflict disclosures must be prominent, plain, and effective, not technically present but concealed.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":35,"difficulty":"advanced","question":"A client offers a manager a performance bonus, and the employer provides written consent. The manager accepts but does not disclose the arrangement to other relevant clients whose accounts might receive less attention. The manager most likely:","options":{"A":"has fully complied because employer consent is enough.","B":"may violate VI(A) because the arrangement creates a conflict that requires effective disclosure to affected parties.","C":"violates VII(A) only."},"answer":"B","explanation":"IV(B) consent addresses the employer relationship, while VI(A) may require disclosure of the resulting conflict to other affected clients.","module":"LM 11","moduleTitle":"Application of the Code and Standards"},{"id":36,"difficulty":"advanced","question":"A member pays a consultant for client referrals. The consultant does not receive compensation unless a client signs. The member discloses the arrangement after the first advisory meeting but before assets are transferred. The disclosure is most likely:","options":{"A":"timely because no assets have moved.","B":"potentially too late because referral compensation should be disclosed before the formal engagement or agreement.","C":"unnecessary because the member pays rather than receives the fee."},"answer":"B","explanation":"VI(C) applies to compensation paid or received and requires disclosure early enough for the prospect to evaluate the relationship before engagement.","module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest"},{"id":37,"difficulty":"advanced","question":"A candidate posts, “The exam was harder than expected, and candidates should spend more time on formulas.” The candidate does not identify a formula, question, or topic. This statement most likely:","options":{"A":"violates VII(A) because all exam discussion is prohibited.","B":"does not violate VII(A) because it expresses a general opinion without confidential content.","C":"violates VII(B) because the candidate mentions the exam."},"answer":"B","explanation":"General opinions are permitted. Revealing specific or broad tested content is not.","module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate"},{"id":38,"difficulty":"advanced","question":"A person passed Level II several years ago but is not currently enrolled for an exam and is not awaiting results. The person's résumé states “CFA Program candidate.” The statement is most likely:","options":{"A":"proper because passing any level creates permanent candidacy.","B":"improper because current candidacy depends on enrollment or awaiting results under CFA Institute rules.","C":"proper if the person plans to register next year."},"answer":"B","explanation":"Candidacy is not permanent and cannot be based only on future intent.","module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate"},{"id":39,"difficulty":"advanced","question":"A firm defines itself for GIPS purposes as only its high-performing equity office, although the same brand markets fixed- income services from another office. The definition most likely:","options":{"A":"is acceptable because each office chooses independently.","B":"is inappropriate because the firm definition should reflect the distinct business entity held out to clients and cannot be narrowed to omit poor results.","C":"is acceptable if independently verified."},"answer":"B","explanation":"Verification cannot cure an inappropriate definition. Firmwide compliance requires a defensible business-entity definition.","module":"LM 10","moduleTitle":"Introduction to GIPS"},{"id":40,"difficulty":"advanced","question":"A firm assigns portfolios to a growth composite after year-end, placing strong performers in the composite and weak performers in a broad-market composite. The firm most likely:","options":{"A":"complies if all portfolios appear in some composite.","B":"violates GIPS principles because composite assignment must be determined before performance is known and follow the actual strategy.","C":"complies if the composite returns are asset weighted."},"answer":"B","explanation":"Ex post classification enables cherry-picking and defeats the purpose of composite reporting.","module":"LM 10","moduleTitle":"Introduction to GIPS"}],"traps":[{"id":1,"module":"LM 1","moduleTitle":"Ethics and Trust in the Investment Profession","term":"Legal compliance is only the minimum threshold","trap":"Choosing an action as ethical merely because local law permits it.","definition":"An action can be legal yet violate the Code and Standards or broader ethical duties. Ethical conduct may require more than the minimum demanded by law."},{"id":2,"module":"LM 1","moduleTitle":"Ethics and Trust in the Investment Profession","term":"A rules-only culture does not replace ethical judgment","trap":"Assuming that following a checklist or obtaining compliance approval automatically makes a decision ethical.","definition":"Rules cannot anticipate every conflict. Members and candidates must identify stakeholders, duties, incentives, alternatives, and likely consequences rather than outsource judgment to a checklist."},{"id":3,"module":"LM 1","moduleTitle":"Ethics and Trust in the Investment Profession","term":"Credentials do not create trust by themselves","trap":"Treating specialized knowledge or a professional designation as sufficient evidence of professionalism.","definition":"A profession earns trust through competence, ethical standards, continuing development, monitoring, accountability, and a commitment to serve clients and society."},{"id":4,"module":"LM 1","moduleTitle":"Ethics and Trust in the Investment Profession","term":"Good intentions do not neutralize situational pressure","trap":"Concluding that a person with strong personal values will remain objective regardless of incentives, authority pressure, or group loyalty.","definition":"Money, prestige, fear of retaliation, loyalty, short-term targets, and obedience to authority can distort judgment. Ethical analysis must address the situation, not only the individual’s character."},{"id":5,"module":"LM 1","moduleTitle":"Ethics and Trust in the Investment Profession","term":"Ethical overconfidence is itself a risk","trap":"Assuming ethical failures mainly happen to dishonest people and therefore require no personal safeguards.","definition":"People tend to overestimate their own ethical behavior and underestimate situational influence. Controls, consultation, documentation, and reflection remain necessary even for well-intentioned professionals."},{"id":6,"module":"LM 1","moduleTitle":"Ethics and Trust in the Investment Profession","term":"The ethical decision-making process does not end once an action is taken","trap":"Stopping the analysis after choosing and implementing an apparently acceptable action.","definition":"The process includes identifying facts and duties, considering alternatives and influences, deciding and acting, and then reflecting on results and lessons for future decisions."},{"id":7,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"The Code and the Standards serve different functions","trap":"Treating the Code of Ethics and the Standards of Professional Conduct as interchangeable lists of detailed rules.","definition":"The Code states broad aspirational principles. The Standards translate those principles into minimum professional requirements that are interpreted through guidance and applications."},{"id":8,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"The Standards are not limited to security recommendations","trap":"Applying the Standards only when a member is researching securities or managing a portfolio.","definition":"The Standards can apply to marketing, supervision, client communications, personal trading, outside activities, exam participation, social media, and other professional conduct."},{"id":9,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"Firm adoption does not transfer individual responsibility","trap":"Assuming that an employee cannot violate the Standards when the firm approved the conduct or claims compliance with the Code.","definition":"Each member and candidate remains personally responsible. Firm approval, custom, or weak controls do not excuse conduct that violates applicable law or the Code and Standards."},{"id":10,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"A violation does not require client loss or personal profit","trap":"Concluding that conduct is permissible because no investor was harmed and the member earned no money.","definition":"Many Standards protect process, trust, objectivity, and market integrity. The prohibited conduct itself can be a violation even when the transaction loses money, produces no profit, or causes no measurable harm."},{"id":11,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"A Professional Conduct inquiry does not require a criminal conviction","trap":"Assuming CFA Institute acts only after a court or regulator finds wrongdoing.","definition":"An inquiry may arise from self-disclosures, written complaints, public information, exam monitoring, or other credible evidence. Professional discipline is separate from criminal or civil proceedings."},{"id":12,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"CFA Institute sanctions are professional, not court-imposed penalties","trap":"Treating public censure, suspension, revocation, or prohibition from CFA Program participation as criminal punishments.","definition":"CFA Institute may impose professional sanctions affecting membership, the right to use the designation, or participation in its programs. Government authorities separately determine legal penalties."},{"id":13,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"Client confidentiality does not block an authorized Professional Conduct investigation","trap":"Refusing to cooperate with an investigation into one’s own conduct solely because client information may be relevant.","definition":"Members and candidates must cooperate with authorized investigations into their own conduct, subject to applicable law. Information provided through the process is handled under CFA Institute confidentiality procedures."},{"id":14,"module":"LM 2","moduleTitle":"Code of Ethics and Standards of Professional Conduct","term":"A client instruction cannot authorize a Standards violation","trap":"Following a client’s request to trade on inside information, manipulate a price, conceal a conflict, or make a misleading presentation because the client accepted the risk.","definition":"Duties to clients operate within the law and the Code and Standards. Refuse unlawful or unethical instructions and dissociate from ongoing violations when necessary."},{"id":15,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"The strictest applicable requirement governs","trap":"Following local law when the Code and Standards or another applicable rule imposes a higher requirement.","definition":"Apply the strictest applicable law, regulation, professional rule, or CFA Institute requirement. When no law applies, follow the Code and Standards."},{"id":16,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Ignorance of applicable rules is not a defense","trap":"Claiming compliance because the member did not review the law or firm rules relevant to a new market, product, or jurisdiction.","definition":"Members and candidates must understand the requirements governing their professional responsibilities and remain current as laws, products, and roles change."},{"id":17,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Dissociation is mandatory; external reporting is not always mandatory","trap":"Selecting whistleblowing to a regulator as the required first response to every suspected violation.","definition":"Attempt to stop the conduct through appropriate internal channels and dissociate if it continues. External reporting is required when law mandates it and may otherwise be prudent, but the Standards’ core mandatory action is nonparticipation and dissociation."},{"id":18,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"A verbal objection is not enough while participation continues","trap":"Believing that disagreeing with an inflated report satisfies Standard I(A) while the member’s name remains on it.","definition":"Dissociation may require removing one’s name, refusing an assignment, declining a client, requesting reassignment, or leaving the employer in an extreme case."},{"id":19,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Modest gifts are not judged the same as lavish benefits","trap":"Assuming every meal, ticket, or customary promotional item automatically violates independence and objectivity.","definition":"Modest customary benefits may be acceptable. Reject any gift, entertainment, favor, or arrangement that could reasonably be expected to threaten independent and objective judgment."},{"id":20,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"A client gift is different from an issuer or broker gift, but disclosure is still necessary","trap":"Accepting a client bonus without telling the employer because the client is already paying for services.","definition":"Client gifts are generally less likely to influence recommendations against that client, but they can affect treatment of other clients and may be additional compensation. Disclose them to the employer, preferably before acceptance."},{"id":21,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Issuer-paid travel is not automatically prohibited","trap":"Choosing a violation whenever an issuer pays any travel expense.","definition":"Best practice is commercial travel paid by the member or firm. Modest issuer-paid travel may be acceptable when commercial transportation is unavailable or the arrangement is necessary and unlikely to impair objectivity."},{"id":22,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Internal pressure does not excuse biased research","trap":"Issuing a favorable recommendation because investment banking, sales, or senior management requested it.","definition":"Members and candidates must preserve independence and objectivity despite internal revenue goals or career pressure. They should use barriers, disclose conflicts, refuse improper influence, and dissociate when needed."},{"id":23,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"An omission can be a misrepresentation","trap":"Focusing only on whether every stated number is literally correct.","definition":"Knowingly omitting material limitations, conflicts, outdated information, or facts needed to prevent a misleading impression can violate Standard I(C)."},{"id":24,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Plagiarism is not limited to copying exact words","trap":"Using another person’s model, chart, forecast, structure, or distinctive idea without attribution because the wording was changed.","definition":"Plagiarism includes using another person’s work or ideas without appropriate acknowledgment. Paraphrasing does not remove the attribution requirement."},{"id":25,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Recognized factual data are different from proprietary analysis","trap":"Citing no source for a proprietary forecast because market statistics sometimes do not require attribution.","definition":"Widely recognized factual information from established financial or statistical reporting services may generally be used without citation. Proprietary analysis, models, forecasts, and conclusions must be attributed."},{"id":26,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Using third-party research does not permit implying authorship","trap":"Publishing an outside analyst’s work under the member’s name because the firm purchased the research.","definition":"Third-party work may be used when permitted and supported by a reasonable basis, but the source and the member’s role must not be misrepresented."},{"id":27,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"A guarantee is permissible only when the guarantee is real and clearly explained","trap":"Assuming the word “guaranteed” is always prohibited in an investment communication.","definition":"Do not guarantee investment performance. A statement may describe a genuine third-party contractual guarantee, such as principal protection, only when the guarantor, scope, conditions, and limitations are accurately disclosed."},{"id":28,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Not every personal offense is professional misconduct","trap":"Treating any minor traffic violation or unrelated private dispute as an automatic Standard I(D) violation.","definition":"Personal conduct violates Standard I(D) when it involves dishonesty, fraud, deceit, or otherwise reflects adversely on professional reputation, integrity, or competence."},{"id":29,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Dishonesty outside the workplace can still violate Standard I(D)","trap":"Assuming fraudulent personal conduct is irrelevant because no client or security was involved.","definition":"Fraud, deceit, theft, or other dishonest conduct can undermine professional integrity even when it occurs outside employment."},{"id":30,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Competence is an ongoing, role-specific duty","trap":"Treating competence as permanently established by a degree, designation, or years of experience.","definition":"Members and candidates must maintain the knowledge, skills, and abilities needed for their current responsibilities as products, methods, regulations, technology, and roles evolve."},{"id":31,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"A new role does not permit bluffing through unfamiliar work","trap":"Accepting full responsibility for a product or assignment without the required knowledge because competence can be developed later.","definition":"Acquire the necessary competence before acting, obtain qualified assistance, limit the scope of work, or decline the responsibility until it can be performed competently."},{"id":32,"module":"LM 3","moduleTitle":"Guidance for Standard I: Professionalism","term":"Using a specialist does not eliminate the member’s competence duty","trap":"Delegating valuation, technology, legal, or quantitative work and then accepting the output without understanding or monitoring it.","definition":"Specialists may be used, but the responsible member must select them appropriately, understand the relevant assumptions and limitations, and exercise reasonable oversight."},{"id":33,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"Information must be both material and nonpublic","trap":"Treating any confidential fact or any important public fact as inside information.","definition":"Standard II(A) applies only when information is material and nonpublic. Public material information and nonmaterial nonpublic information do not by themselves prohibit analysis or trading."},{"id":34,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"Materiality depends on significance, not source prestige","trap":"Assuming information is material merely because it came from a CEO or board member.","definition":"Consider whether a reasonable investor would view the information as important or whether disclosure would likely affect price, including the probability and magnitude of uncertain events."},{"id":35,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"Information is not public merely because several people know it","trap":"Trading after information was shared with analysts, lenders, employees, or selected clients.","definition":"Information becomes public after broad dissemination through channels that give the market a reasonable opportunity to receive and act on it."},{"id":36,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"Selective disclosure remains nonpublic","trap":"Treating management guidance given privately to an analyst as public because the issuer supplied it voluntarily.","definition":"Selective disclosure does not make information public. The analyst must not act or cause others to act until the information is broadly disseminated."},{"id":37,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"The mosaic theory permits a conclusion built from permissible pieces","trap":"Rejecting an investment conclusion because it combines public information with nonpublic observations.","definition":"A conclusion may be based on public information plus immaterial nonpublic information, even if the final conclusion is material. The mosaic cannot include material nonpublic information."},{"id":38,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"An expert network is not a safe harbor","trap":"Assuming information obtained through a paid expert is automatically usable.","definition":"Before using expert-network information, determine whether it is material, nonpublic, confidential, or obtained in breach of a duty. Compensation and contractual disclaimers do not eliminate the analysis."},{"id":39,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"A pending analyst recommendation can be material nonpublic information","trap":"Trading personally before a widely followed firm releases a major rating change because the information was created internally rather than received from an issuer.","definition":"A pending recommendation or research conclusion can be material and nonpublic. Trading or tipping before dissemination may violate Standard II(A) and Standard VI(B)."},{"id":40,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"Market manipulation requires an intent to mislead or distort","trap":"Classifying every trade that moves price or volume as manipulation.","definition":"Standard II(B) prohibits transactions or information-based practices intended to mislead market participants or artificially distort prices or trading volume."},{"id":41,"module":"LM 4","moduleTitle":"Guidance for Standard II: Integrity of Capital Markets","term":"Legitimate short selling is not automatically manipulation","trap":"Choosing a violation solely because a short seller publishes negative research and the price declines.","definition":"A well-supported, honestly communicated investment view and legitimate trading strategy are not manipulation merely because they affect price. False information, deceptive trades, or an intent to create an artificial market are prohibited."},{"id":42,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"The person paying the fee is not always the true client","trap":"Treating a pension sponsor, trustee, manager, or plan executive as the sole client when beneficiaries bear the economic interest.","definition":"Identify the person or group to whom the duty is owed. For a benefit plan, duties generally run to the plan participants and beneficiaries, subject to the governing mandate and law."},{"id":43,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Prudence is evaluated in the context of the portfolio and mandate","trap":"Labeling a volatile security imprudent solely because it is risky on a stand-alone basis.","definition":"Assess the investment’s role, diversification effect, expected return, liquidity, and risk within the client’s total portfolio and governing objectives."},{"id":44,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Client brokerage is a client asset","trap":"Using commissions to obtain research that benefits the manager or unrelated accounts without considering execution quality.","definition":"Seek best execution and use client brokerage for goods or services that benefit the client. Client-directed brokerage should include disclosure that best execution may not be achieved."},{"id":45,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Proxy voting is not an automatic duty to vote every item","trap":"Assuming loyalty requires voting every proxy regardless of cost or significance.","definition":"Vote when doing so is expected to benefit clients after considering costs and the mandate. Maintain and disclose a proxy-voting policy, and address conflicts in voting decisions."},{"id":46,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Fair dealing does not mean identical treatment","trap":"Assuming every client must receive a recommendation at the exact same second or obtain the same service package.","definition":"Clients must receive fair opportunity and treatment. Minor timing differences and disclosed service tiers may be acceptable when they do not systematically disadvantage clients."},{"id":47,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Premium service levels are permissible when they are disclosed and fairly administered","trap":"Treating any additional research, reporting, or contact for higher-fee clients as a violation.","definition":"Different service levels may be offered when available under disclosed terms and when core recommendations are not selectively withheld from other suitable clients."},{"id":48,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Scarce allocations require an objective process","trap":"Giving an oversubscribed IPO or partially filled trade to the largest, newest, or gift-giving client without a pre-established method.","definition":"Use a fair, documented allocation policy—often pro rata or minimum-lot based—and do not favor personal accounts or selected clients for improper reasons."},{"id":49,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Private calls and social media can create selective disclosure to clients","trap":"Posting a new recommendation to a small subscriber group before other suitable clients receive it.","definition":"Material recommendations and changes must be disseminated so all affected clients have a fair opportunity to act. The communication channel does not change the duty."},{"id":50,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Suitability analysis is required in an advisory relationship","trap":"Recommending a product based only on its historical return or general risk category.","definition":"Obtain and update information about objectives, risk tolerance, constraints, liquidity, taxes, time horizon, and circumstances, and ensure the action is consistent with the written mandate."},{"id":51,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Suitability is assessed in the total portfolio, not security by security","trap":"Rejecting a hedging instrument or concentrated position solely because it appears risky in isolation.","definition":"Evaluate how the action affects the portfolio’s overall expected return, risk, diversification, liquidity, and consistency with the client’s objectives and constraints."},{"id":52,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"A pooled fund manager follows the fund mandate, not each investor’s personal circumstances","trap":"Testing every portfolio holding against the individual suitability of each underlying investor.","definition":"The fund manager must invest consistently with the stated mandate. The adviser who recommends the fund to an individual client performs the client-specific suitability analysis."},{"id":53,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"An unsolicited unsuitable trade is not handled by silent execution","trap":"Executing the client’s request without discussion because the client initiated it.","definition":"Explain why the trade appears unsuitable and document the discussion. If the effect is immaterial, firm policy may permit execution; if material, update the IPS or decline the transaction."},{"id":54,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Accurate performance numbers can still be misleading","trap":"Assuming Standard III(D) is satisfied whenever the arithmetic is correct.","definition":"Performance must be fair, accurate, and complete. Cherry-picked accounts or periods, omitted fees, inconsistent methodology, or missing context can mislead even when each number is technically correct."},{"id":55,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Simulated and backtested results are not actual performance","trap":"Presenting model results in the same format as a live track record without a clear label.","definition":"Identify simulated, hypothetical, or backtested results prominently and disclose relevant assumptions, limitations, and differences from actual trading."},{"id":56,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Prior-employer or team performance is not automatically personal performance","trap":"Claiming an entire prior firm’s track record because the member contributed to the team.","definition":"Obtain permission when required and disclose where the results were achieved, the member’s role, the period, the methodology, and material limitations. Do not imply sole responsibility."},{"id":57,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"Confidentiality continues after the relationship ends","trap":"Discussing a former client’s holdings because the account was closed.","definition":"Protect confidential information of current, former, and prospective clients unless a recognized exception applies."},{"id":58,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"The confidentiality exceptions are limited","trap":"Disclosing sensitive information whenever the member believes disclosure would be useful or morally preferable.","definition":"Disclosure is permitted when the information concerns illegal activity, the law requires disclosure, or the client or prospect authorizes it. Apply the strictest applicable law and limit disclosure appropriately."},{"id":59,"module":"LM 5","moduleTitle":"Guidance for Standard III: Duties to Clients","term":"A family relationship or internal audience does not create automatic permission","trap":"Sharing client details with a spouse, colleague, affiliate, or supervisor who has no legitimate need to know.","definition":"Share confidential information only with authorized persons who need it for the client relationship, legal obligations, compliance, or another permitted purpose."},{"id":60,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Preparing to compete is different from competing before departure","trap":"Treating every step toward a new business as disloyal while still employed.","definition":"Arranging financing, leasing space, forming an entity, interviewing, and accepting future employment may be permissible. Soliciting current clients, diverting opportunities, or reducing service before departure is generally prohibited."},{"id":61,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Employer records remain employer property even on a personal device","trap":"Keeping client messages, models, research, or files because they were created at home or stored in a personal email account.","definition":"Records produced for the employer are generally the employer’s property regardless of location or device. Permission is needed to retain or use them after employment ends."},{"id":62,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"General experience may be used; proprietary material may not","trap":"Assuming that leaving an employer prevents the member from using any knowledge gained in the role—or, at the other extreme, permits taking client lists and models.","definition":"A former employee may use general skills, experience, memory, and public information, but may not misappropriate confidential records, proprietary models, client lists, or trade secrets."},{"id":63,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Outside work can conflict even when it is unpaid","trap":"Assuming a volunteer role, board seat, or side project requires no employer disclosure because there is no cash compensation.","definition":"Disclose and obtain required consent when the activity competes with the employer, uses employer resources, reduces job performance, or creates conflicting duties. Noncash benefits can be compensation."},{"id":64,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"The duty of loyalty does not require participation in wrongdoing","trap":"Remaining silent about serious misconduct solely to protect the employer’s reputation.","definition":"Loyalty is not absolute. Whistleblowing intended to protect clients, market integrity, or the public may be appropriate, subject to law and careful use of legal and compliance channels."},{"id":65,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Additional compensation includes noncash benefits and contingent bonuses","trap":"Applying Standard IV(B) only to a second salary paid in cash.","definition":"Gifts, free services, parking, travel, equity, referral consideration, and client bonuses tied to performance may constitute additional compensation or benefits."},{"id":66,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Written consent must come before the conflicting arrangement","trap":"Notifying the employer only after the member earns or receives a client bonus.","definition":"Before accepting an arrangement that competes with or may conflict with employer interests, obtain written consent from all parties involved. The consent should describe the nature, amount or value, terms, and duration."},{"id":67,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Delegating supervision does not delegate responsibility","trap":"Assuming a senior manager is no longer accountable after assigning compliance monitoring to a subordinate.","definition":"A supervisor may delegate tasks but remains responsible for instructing delegates, establishing reasonable controls, and following up on the delegated work."},{"id":68,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"Trusting employees is not an adequate compliance system","trap":"Believing that experienced or ethical staff make written procedures, training, monitoring, and escalation unnecessary.","definition":"Supervisors must make reasonable efforts to prevent and detect violations through effective policies, education, records, monitoring, incentives, and reporting channels."},{"id":69,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"A supervisor is not strictly liable for every subordinate violation","trap":"Choosing a supervisory violation solely because an employee evaded a reasonable system.","definition":"The Standard requires reasonable supervision, not perfect prevention. A supervisor may comply when adequate procedures existed and the response to warning signs was prompt and appropriate."},{"id":70,"module":"LM 6","moduleTitle":"Guidance for Standard IV: Duties to Employers","term":"A warning or report alone is not enough after a suspected violation","trap":"Telling an employee to stop and waiting for senior management while the employee continues unrestricted activity.","definition":"Investigate promptly and take steps to prevent further harm, such as limiting authority, increasing monitoring, preserving records, or suspending the activity while the matter is reviewed."},{"id":71,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"A bad outcome does not prove that the analysis lacked a reasonable basis","trap":"Treating every losing recommendation as a Standard V(A) violation.","definition":"The Standard evaluates the diligence, evidence, process, and basis available when the recommendation or action was made—not whether the investment later performed well."},{"id":72,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Third-party research cannot be accepted blindly","trap":"Relying on an external rating, consultant report, data vendor, or AI output solely because the source is reputable.","definition":"Evaluate the source’s objectivity, assumptions, methodology, data quality, timeliness, and limitations, and use the information in good faith only when it supports a reasonable basis."},{"id":73,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Disagreement with one assumption does not always require dissociation from a group report","trap":"Removing one’s name whenever the final team conclusion differs from the member’s preferred estimate.","definition":"A member may remain associated with a group recommendation when the process is reasonable and the conclusion has an adequate basis, even if the member would have reached a different view."},{"id":74,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Quantitative or AI output is not self-validating","trap":"Treating a model result as a reasonable basis because the algorithm is complex or historically accurate.","definition":"Understand the model’s purpose, inputs, assumptions, validation, sensitivity, data limitations, and failure modes. Communicate material limitations and monitor whether the model remains fit for use."},{"id":75,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Diligence is proportional to the product, strategy, and professional role","trap":"Applying one universal research checklist to every security, manager, index product, private asset, and execution-only service.","definition":"The depth and type of investigation depend on complexity, risk, available information, the member’s role, and the nature of the decision, while always requiring an adequate and reasonable basis."},{"id":76,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Forecasts and judgments must not be presented as facts","trap":"Using authoritative wording for estimates because the model produced a precise number.","definition":"Clearly distinguish verified facts from opinions, scenarios, assumptions, estimates, and forecasts. Precision in a model does not convert uncertainty into fact."},{"id":77,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Communication requires the basic process and material risks—not every calculation","trap":"Choosing a violation because a report does not reveal every proprietary formula or input.","definition":"Disclose the nature and costs of services, the basic investment process, significant risks and limitations, and information necessary for the audience to understand the recommendation. Proprietary detail need not be fully surrendered."},{"id":78,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Material changes in the investment process must be communicated","trap":"Continuing to use old marketing or client disclosures after the strategy, model, liquidity terms, risk controls, or data sources change materially.","definition":"Update clients and prospects when a material change affects how the service operates, the risks assumed, or the interpretation of prior communications."},{"id":79,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"A short message or social-media post is still an investment communication","trap":"Applying Standard V(B) only to formal research reports.","definition":"Emails, presentations, advertisements, websites, social media, dashboards, and verbal recommendations must remain accurate and must distinguish facts from opinions and disclose material limitations appropriate to the format."},{"id":80,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Records created for professional activity are generally the employer’s property","trap":"Taking research files after departure because the member personally wrote them or used a personal computer.","definition":"Maintain records that support analysis, recommendations, actions, and communications. Records created for the employer generally belong to the employer and cannot be retained without permission."},{"id":81,"module":"LM 7","moduleTitle":"Guidance for Standard V: Investment Analysis, Recommendations, and Actions","term":"Seven years is a fallback recommendation, not a universal law","trap":"Automatically selecting seven years when a law or firm policy requires another period.","definition":"Follow applicable legal and regulatory requirements and firm policy. When none specifies a period, CFA Institute recommends retaining supporting records for at least seven years."},{"id":82,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Avoiding a conflict is preferred to merely disclosing it","trap":"Assuming any conflict becomes acceptable once it appears in a disclosure document.","definition":"Avoid actual and apparent conflicts when reasonably possible. When avoidance is not reasonable, mitigate the conflict and make full and fair disclosure."},{"id":83,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Conflict disclosure must be prominent, specific, and understandable","trap":"Relying on boilerplate stating that “conflicts may exist” when a known ownership, compensation, or business relationship can be described.","definition":"Use plain language, explain the nature and potential effect of the conflict, deliver the disclosure effectively and timely, and avoid burying it in unrelated text."},{"id":84,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Conflict disclosures must be updated when circumstances change","trap":"Treating an old disclosure as permanently sufficient after ownership, compensation, board service, or business relationships change materially.","definition":"Review and update disclosures when the nature, severity, or effect of the conflict changes."},{"id":85,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Client and employer transactions have priority over beneficial-owner transactions","trap":"Trading personally immediately after creating a recommendation but before clients or the employer can act.","definition":"Transactions for clients and employers must have priority. Personal trading is permitted only after they have had an adequate opportunity to act and firm procedures are followed."},{"id":86,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"A family account is not automatically personal or automatically a client account","trap":"Classifying every relative’s account the same way.","definition":"Determine beneficial ownership and control. An account in which the member has a direct or indirect economic interest is personal; a bona fide client account without such interest should be treated like comparable client accounts."},{"id":87,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Personal investing is not prohibited","trap":"Choosing a violation whenever a member trades a security also recommended to clients.","definition":"Personal trades may occur after clients and the employer receive priority, the member does not use pending order information, and preclearance, blackout, reporting, and other firm procedures are satisfied."},{"id":88,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Referral compensation includes amounts paid as well as received","trap":"Disclosing only commissions the member receives for sending a client to another provider.","definition":"Disclose compensation, consideration, or benefits paid to or received from others for recommending products or services, including noncash benefits."},{"id":89,"module":"LM 8","moduleTitle":"Guidance for Standard VI: Conflicts of Interest","term":"Referral disclosure must occur before the relevant service relationship","trap":"Revealing the referral arrangement only after the client signs the agreement or pays the fee.","definition":"Disclose to the employer, clients, and prospects as appropriate before they enter the relationship, including the nature and amount or estimated value of the consideration when known."},{"id":90,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"Opinions about the exam are permitted; exam content is confidential","trap":"Treating “the exam was difficult” and “the exam heavily tested a specific topic” as equivalent statements.","definition":"Candidates may express opinions about difficulty, administration, policy, or value. They must not reveal specific questions, formulas, answers, or broad or specific topics tested or not tested."},{"id":91,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"Soliciting confidential exam information is a violation even if it is never used","trap":"Assuming only the person who discloses an exam question violates Standard VII(A).","definition":"Requesting, purchasing, encouraging, receiving, or distributing confidential CFA Program information can compromise program integrity and violate the Standard."},{"id":92,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"Violating exam rules can violate Standard VII(A) without successful cheating","trap":"Choosing no violation because prohibited notes, devices, calculators, or conduct did not improve the candidate’s score.","definition":"Failure to follow CFA Program rules, agreements, pledges, and security procedures can itself compromise program integrity."},{"id":93,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"A CFA Institute volunteer position cannot be used for private advantage","trap":"Using confidential committee information, grading knowledge, or a society role to market services or favor clients.","definition":"Members may factually describe volunteer service but must not exploit the role, confidential information, or CFA Institute reputation for improper personal or commercial benefit."},{"id":94,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"“CFA” is a designation, not a noun or a modified label","trap":"Writing “a CFA,” “C.F.A.,” or embedding the letters in a company name, nickname, or social-media handle.","definition":"Use the letters as an unaltered designation after a person’s name or as an adjective, such as “CFA charterholder,” consistent with CFA Institute rules."},{"id":95,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"Passing a level does not create a partial designation","trap":"Using “CFA Level I,” “CFA, Level II,” or “charter pending” as a credential after passing an exam.","definition":"Use factual wording such as “passed Level I of the CFA Program.” No partial CFA designation exists, and candidates must not state an expected charter completion date."},{"id":96,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"Candidate status is temporary and fact-specific","trap":"Claiming current candidacy after declining to sit, between registrations, or after receiving results without enrolling for the next exam.","definition":"A person is a candidate when accepted and enrolled for a specified exam or after sitting while awaiting results, according to CFA Institute rules."},{"id":97,"module":"LM 9","moduleTitle":"Guidance for Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"The right to use the designation is conditional and does not promise superior performance","trap":"Continuing to display CFA a
