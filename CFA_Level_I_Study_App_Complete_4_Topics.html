<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07101e" />
  <title>CFA Level I · Study App</title>
  <style>
    :root {
      --bg:#07101e; --panel:#0d1929; --panel2:#111f31; --panel3:#101e2f;
      --line:#26374c; --line2:#3e5875; --text:#f3f6fa; --muted:#9aabc0;
      --accent:#62d6a6; --accent2:#153f35; --warning:#ffcb6b; --warning2:#4b3919;
      --danger:#ff8a8a; --danger2:#4b2329; --info:#8ac7ff; --info2:#173750;
      --purple:#c8a7ff; --purple2:#30234a; --shadow:0 24px 70px rgba(0,0,0,.34);
      --radius:18px;
    }
    *{box-sizing:border-box} html,body{min-height:100%}
    body{margin:0;font-family:"Segoe UI","Helvetica Neue",Arial,sans-serif;color:var(--text);background:
      radial-gradient(circle at 15% 0%,rgba(47,101,134,.22),transparent 34%),
      radial-gradient(circle at 92% 88%,rgba(31,120,91,.18),transparent 30%),var(--bg)}
    button,select,input{font:inherit} button{color:inherit}
    .app{width:min(1240px,calc(100% - 28px));margin:0 auto;padding:24px 0 44px}
    .topbar{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;margin-bottom:18px}
    .eyebrow{margin:0 0 7px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.16em;text-transform:uppercase}
    h1{margin:0;font-size:clamp(29px,5vw,47px);line-height:1.03;letter-spacing:-.038em}
    .subtitle{margin:10px 0 0;color:var(--muted);font-size:14px;line-height:1.5}
    .author-line{margin:3px 0 0;font-size:13px;line-height:1.45}
    .author-line a{color:#d7e2ee;text-decoration:none;border-bottom:1px solid rgba(215,226,238,.38);transition:color .14s ease,border-color .14s ease}
    .author-line a:hover,.author-line a:focus{color:var(--accent);border-color:var(--accent);outline:none}
    .top-actions{display:flex;gap:9px;flex-wrap:wrap;justify-content:flex-end}
    .btn{min-height:42px;padding:10px 14px;border:1px solid var(--line);border-radius:11px;background:rgba(17,31,49,.9);cursor:pointer;transition:.14s ease}
    .btn:hover:not(:disabled){border-color:#4a6583;background:#15263a;transform:translateY(-1px)}
    .btn:disabled{opacity:.45;cursor:not-allowed}.btn.primary{border-color:transparent;background:var(--accent);color:#05110d;font-weight:850}
    .btn.success{border-color:#28644f;background:var(--accent2);color:#b9f4dc;font-weight:750}
    .btn.warning{border-color:#705626;background:var(--warning2);color:#ffe0a2;font-weight:750}
    .btn.danger{border-color:#75444d;background:var(--danger2);color:#ffd0d0;font-weight:750}
    .btn.info{border-color:#315d7b;background:var(--info2);color:#c6e7ff;font-weight:750}
    .btn.small{min-height:35px;padding:7px 10px;font-size:12px}
    .subject-switch{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:7px;padding:6px;border:1px solid var(--line);border-radius:14px;background:#091524;margin-bottom:12px}
    .subject-button{min-height:46px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-weight:800}
    .subject-button.active{background:var(--accent);color:#05110d;border-color:#75e0b7}.subject-button:hover:not(.active){background:#122136;color:var(--text)}
    .nav-wrap{position:relative;margin-bottom:18px}.section-tabs{display:flex;gap:7px;overflow-x:auto;padding:6px;border:1px solid var(--line);border-radius:14px;background:#091524;scrollbar-width:thin}
    .section-tab{flex:0 0 auto;min-height:42px;padding:9px 13px;border:1px solid transparent;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;font-size:13px;font-weight:800;white-space:nowrap}
    .section-tab.active{background:#172b43;color:var(--text);border-color:#3d5876}.section-tab:hover{color:var(--text)}
    .layout{display:grid;grid-template-columns:minmax(0,1.75fr) minmax(280px,.68fr);gap:20px}
    .panel{border:1px solid var(--line);border-radius:var(--radius);background:rgba(13,25,41,.92);box-shadow:var(--shadow);backdrop-filter:blur(12px)}
    .main-panel{padding:20px;min-height:640px}.side-panel{padding:18px;align-self:start;position:sticky;top:14px}
    .view-title-row{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:16px}
    .view-title{margin:0;font-size:23px;letter-spacing:-.025em}.view-subtitle{margin:6px 0 0;color:var(--muted);font-size:13px;line-height:1.45}
    .toolbar{display:grid;grid-template-columns:minmax(160px,1fr) minmax(150px,.7fr) auto auto;gap:9px;margin-bottom:15px}
    select{width:100%;min-height:42px;padding:9px 34px 9px 12px;border:1px solid var(--line);border-radius:10px;color:var(--text);background:var(--panel3);outline:none}
    select:focus{border-color:var(--accent)}
    .progress-meta{display:flex;justify-content:space-between;gap:14px;color:var(--muted);font-size:12px;margin:9px 0 7px}
    .progress-track{height:7px;background:#18283b;border-radius:999px;overflow:hidden}.progress-bar{height:100%;width:0;background:linear-gradient(90deg,#42b98a,#7ce5ba);border-radius:inherit;transition:width .2s ease}
    .study-stage{min-height:455px;margin-top:14px}
    .card-scene{perspective:1400px;min-height:455px}.study-card{position:relative;width:100%;height:455px;transform-style:preserve-3d;transition:transform .48s cubic-bezier(.2,.75,.2,1);cursor:pointer;user-select:none}.study-card.flipped{transform:rotateY(180deg)}
    .face{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(23px,4.4vw,43px);border:1px solid #30455f;border-radius:16px;backface-visibility:hidden;overflow:auto}
    .front{background:linear-gradient(150deg,rgba(98,214,166,.1),transparent 34%),var(--panel3)}.back{transform:rotateY(180deg);background:linear-gradient(150deg,rgba(94,167,216,.11),transparent 34%),var(--panel3)}
    .face:after,.question-card:after{content:"";position:absolute;right:-90px;bottom:-90px;width:230px;height:230px;border:1px solid rgba(255,255,255,.05);border-radius:50%;box-shadow:0 0 0 34px rgba(255,255,255,.018),0 0 0 68px rgba(255,255,255,.012);pointer-events:none}
    .card-top{position:relative;z-index:1;display:flex;justify-content:space-between;gap:16px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
    .card-content{position:relative;z-index:1;max-width:850px;margin:auto 0}.card-label{margin-bottom:13px;color:var(--accent);font-size:12px;font-weight:850;letter-spacing:.12em;text-transform:uppercase}
    .term{margin:0;font-size:clamp(29px,5vw,51px);line-height:1.06;letter-spacing:-.034em}.definition{margin:0;font-size:clamp(19px,3vw,28px);line-height:1.38;letter-spacing:-.015em;white-space:pre-line}
    .formula-text{font-family:Georgia,"Times New Roman",serif;font-size:clamp(22px,3.5vw,34px)}.trap-copy{font-size:clamp(17px,2.5vw,23px);line-height:1.48}.trap-copy strong{color:var(--warning)}
    .card-hint{position:relative;z-index:1;color:var(--muted);font-size:12px}
    .question-card{position:relative;min-height:455px;padding:clamp(22px,4vw,36px);border:1px solid #30455f;border-radius:16px;overflow:hidden;background:linear-gradient(150deg,rgba(94,167,216,.09),transparent 34%),var(--panel3)}
    .question-body{position:relative;z-index:1}.question-text{margin:28px 0 20px;font-size:clamp(20px,3.1vw,29px);line-height:1.32;letter-spacing:-.02em}
    .options{display:grid;gap:10px}.option{display:grid;grid-template-columns:36px 1fr;gap:11px;align-items:start;width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#0c1929;text-align:left;cursor:pointer;transition:.14s ease}
    .option:hover:not(:disabled){border-color:#4a6583;background:#13243a;transform:translateY(-1px)}.option.selected{border-color:var(--info);background:var(--info2)}.option.correct{border-color:var(--accent);background:var(--accent2);color:#c8f7e4}.option.incorrect{border-color:var(--danger);background:var(--danger2);color:#ffd1d1}.option:disabled{cursor:default}
    .option-letter{display:grid;place-items:center;width:29px;height:29px;border:1px solid #3c5069;border-radius:8px;font-size:12px;font-weight:850}.option-text{padding-top:3px;line-height:1.45}
    .confidence-box{margin-top:16px;padding:13px;border:1px solid var(--line);border-radius:12px;background:#0a1726}.confidence-title{margin:0 0 10px;color:var(--muted);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .confidence-buttons{display:grid;grid-template-columns:1fr 1fr;gap:9px}.confidence-choice.active.sure{border-color:var(--accent);background:var(--accent2);color:#bdf3dc}.confidence-choice.active.partial{border-color:var(--warning);background:var(--warning2);color:#ffe3a8}
    .feedback{display:none;margin-top:16px;padding:15px;border:1px solid var(--line);border-radius:12px;background:#0a1726}.feedback.visible{display:block}.feedback.good{border-color:#2f6b56}.feedback.bad{border-color:#75444d}.feedback h3{margin:0 0 7px;font-size:15px}.feedback p{margin:0;color:#ccd7e4;line-height:1.55;font-size:14px}
    .danger-note{margin-top:10px;padding:10px 12px;border-radius:9px;background:var(--danger2);color:#ffd3d3;font-size:12px;line-height:1.45}
    .navigation{display:grid;grid-template-columns:1fr minmax(180px,auto) 1fr;gap:9px;margin-top:13px}.confidence-rating{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:9px}
    .status{min-height:19px;margin:10px 0 0;color:var(--muted);text-align:center;font-size:12px}
    .empty{min-height:430px;display:grid;place-items:center;padding:32px;border:1px dashed var(--line);border-radius:15px;color:var(--muted);text-align:center;line-height:1.6}
    .stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:13px;border:1px solid var(--line);border-radius:12px;background:var(--panel2);min-height:88px}.stat-value{display:block;font-size:27px;font-weight:850;letter-spacing:-.035em;margin-bottom:4px}.stat-label{color:var(--muted);font-size:11px;line-height:1.35}
    .side-section{margin-top:17px;padding-top:16px;border-top:1px solid var(--line)}.side-title{margin:0 0 11px;font-size:14px}.mini-row{display:flex;justify-content:space-between;gap:12px;margin:8px 0;color:var(--muted);font-size:12px}.mini-row strong{color:var(--text)}
    .mastery-chip{display:inline-flex;align-items:center;gap:7px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:#0b1726;color:#dce7f3;font-size:12px;font-weight:800}
    .dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin-bottom:17px}.summary-card{padding:17px;border:1px solid var(--line);border-radius:14px;background:var(--panel2)}.summary-card h3{margin:0 0 7px;font-size:15px}.summary-card.current-subject{border-color:#3f8f76;box-shadow:inset 0 0 0 1px rgba(98,214,166,.16)}.summary-score{font-size:39px;font-weight:900;letter-spacing:-.045em}.summary-meta{color:var(--muted);font-size:12px;line-height:1.5}
    .review-launch{display:grid;grid-template-columns:minmax(220px,1fr) minmax(230px,310px) auto auto;gap:9px;align-items:center;padding:16px;border:1px solid #2c604f;border-radius:14px;background:linear-gradient(145deg,rgba(98,214,166,.09),transparent),#0d1c2c;margin-bottom:17px}.review-launch h3{margin:0 0 5px}.review-launch p{margin:0;color:var(--muted);font-size:12px;line-height:1.45}.review-launch select{min-width:115px}.topic-picker{position:relative}.topic-picker summary{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:42px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#0b1727;color:var(--text);font-size:13px;font-weight:800;cursor:pointer;list-style:none}.topic-picker summary::-webkit-details-marker{display:none}.topic-picker summary:after{content:"▾";color:var(--muted);transition:transform .15s ease}.topic-picker[open] summary:after{transform:rotate(180deg)}.topic-picker-menu{position:absolute;z-index:30;top:calc(100% + 7px);left:0;right:0;min-width:270px;padding:8px;border:1px solid var(--line2);border-radius:12px;background:#0a1626;box-shadow:0 18px 40px rgba(0,0,0,.35)}.topic-option{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:8px;color:var(--text);font-size:13px;cursor:pointer}.topic-option:hover{background:#111f33}.topic-option.all{margin-bottom:5px;padding-bottom:11px;border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;font-weight:850}.topic-option input{width:16px;height:16px;accent-color:var(--accent)}
    .section-heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:18px 0 10px}.section-heading h3{margin:0;font-size:16px}.section-heading span{color:var(--muted);font-size:12px}
    .category-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:9px}.category-card{padding:13px;border:1px solid var(--line);border-radius:12px;background:#0f1d2e}.category-card strong{display:block;font-size:22px;margin:4px 0}.category-card span{color:var(--muted);font-size:11px;line-height:1.3}.category-card small{color:var(--accent);font-size:10px;text-transform:uppercase;letter-spacing:.07em;font-weight:800}
    .module-list{display:grid;gap:9px}.module-row{display:grid;grid-template-columns:minmax(180px,1fr) 2fr 56px;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:#0e1b2b}.module-label strong{display:block;font-size:13px}.module-label span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.bar{height:8px;border-radius:999px;background:#1b2b3f;overflow:hidden}.bar>span{display:block;height:100%;background:linear-gradient(90deg,#42b98a,#7ce5ba);border-radius:inherit}.module-score{text-align:right;font-weight:850;font-size:13px}
    .mistake-controls{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;margin-bottom:13px}.mistake-list{display:grid;gap:11px}.mistake-card{padding:15px;border:1px solid var(--line);border-radius:13px;background:#0f1d2e}.mistake-card.dangerous{border-color:#75444d}.mistake-head{display:flex;justify-content:space-between;gap:12px;margin-bottom:9px}.mistake-head strong{font-size:13px}.badge{display:inline-flex;padding:5px 8px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em}.badge.active{border-color:#75444d;color:#ffc4c4;background:var(--danger2)}.badge.resolved{border-color:#28644f;color:#b9f4dc;background:var(--accent2)}
    .mistake-question{font-size:15px;line-height:1.45;margin:0 0 11px}.mistake-detail{display:grid;gap:5px;color:#cdd8e4;font-size:12px;line-height:1.45}.mistake-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
    .daily-progress{display:flex;justify-content:space-between;gap:12px;margin-bottom:10px;color:var(--muted);font-size:12px}.daily-complete{text-align:center;padding:42px 20px}.daily-complete .big{font-size:56px;font-weight:900;letter-spacing:-.05em;color:var(--accent)}
    .placeholder{padding:34px;border:1px dashed var(--line);border-radius:15px;background:#0d1a2a;text-align:center}.placeholder h3{margin:0 0 9px}.placeholder p{margin:0 auto;color:var(--muted);max-width:620px;line-height:1.6}
    .toast{position:fixed;right:18px;bottom:18px;z-index:100;padding:12px 15px;border:1px solid var(--line2);border-radius:11px;background:#102034;color:#e9f1f9;box-shadow:var(--shadow);font-size:13px;opacity:0;transform:translateY(8px);pointer-events:none;transition:.18s ease}.toast.show{opacity:1;transform:translateY(0)}
    .hidden{display:none!important}
    @media(max-width:980px){.layout{grid-template-columns:1fr}.side-panel{position:static;order:-1}.category-grid{grid-template-columns:repeat(3,1fr)}.topbar{flex-direction:column}.top-actions{justify-content:flex-start;width:100%}.toolbar{grid-template-columns:1fr 1fr}.review-launch{grid-template-columns:1fr 1fr}.review-copy,.topic-picker{grid-column:1/-1}}
    @media(max-width:640px){.app{width:min(100% - 18px,1240px);padding-top:15px}.main-panel,.side-panel{padding:13px}.subject-button{font-size:12px}.dashboard-grid{grid-template-columns:1fr}.category-grid{grid-template-columns:1fr 1fr}.toolbar{grid-template-columns:1fr}.study-card,.card-scene{height:500px;min-height:500px}.question-card{min-height:500px}.face{padding:24px 20px}.navigation{grid-template-columns:1fr 1fr}.navigation .main-action{grid-column:1/-1;grid-row:1}.review-launch{grid-template-columns:1fr}.review-copy,.topic-picker{grid-column:auto}.topic-picker-menu{position:static;min-width:0;margin-top:7px}.module-row{grid-template-columns:1fr 58px}.module-row .bar{grid-column:1/-1;grid-row:2}.mistake-controls{grid-template-columns:1fr}.confidence-buttons,.confidence-rating{grid-template-columns:1fr}.term{font-size:31px}.definition{font-size:20px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <p class="eyebrow">CFA Level I · 2027</p>
        <h1>CFA Study App</h1>
        <p class="subtitle" id="appSubtitle">CFA Level I 2027 · Multi-topic study app · Offline mastery tracking.</p>
        <p class="author-line"><a href="https://www.linkedin.com/in/aldo-emmanuel-medina" target="_blank" rel="noopener noreferrer" aria-label="Open Aldo Emmanuel Medina Galván’s LinkedIn profile">Aldo Emmanuel Medina Galván</a></p>
      </div>
      <div class="top-actions">
        <button class="btn primary" id="dailyTopButton">Start Daily Review</button>
        <button class="btn" id="exportButton">Export Progress</button>
        <button class="btn" id="importButton">Import Progress</button>
        <input type="file" id="importFile" accept="application/json,.json" class="hidden" />
      </div>
    </header>

    <div class="subject-switch" id="subjectSwitch"></div>
    <nav class="nav-wrap"><div class="section-tabs" id="sectionTabs"></div></nav>

    <section class="layout">
      <div class="panel main-panel" id="mainPanel"></div>
      <aside class="panel side-panel" id="sidePanel"></aside>
    </section>
  </main>
  <div class="toast" id="toast"></div>

  <script>
    const APP_DATA = {"subjects":{"corporate":{"label":"Corporate Finance","shortLabel":"Corporate Finance","subtitle":"CFA Level I 2027 · Corporate Finance","data":{"formula":[{"id":1,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Operating Cycle","definition":"Operating cycle = DOH + DSO"},{"id":2,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Cash Conversion Cycle (CCC)","definition":"CCC = DOH + DSO − DPO"},{"id":3,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Days of Inventory on Hand (DOH)","definition":"DOH = (Average inventory / Cost of goods sold) × 365"},{"id":4,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Days Sales Outstanding (DSO)","definition":"DSO = (Average accounts receivable / Revenue) × 365"},{"id":5,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Days Payable Outstanding (DPO)","definition":"DPO = (Average accounts payable / Purchases) × 365"},{"id":6,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Purchases When Not Given","definition":"Purchases = COGS + Ending inventory − Beginning inventory"},{"id":7,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Working Capital","definition":"Working capital = Short-term assets − Short-term liabilities"},{"id":8,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Net Working Capital for Operating Analysis","definition":"NWC = (Current assets − Cash and marketable securities) − (Current liabilities − Short-term debt)"},{"id":9,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Current Ratio","definition":"Current ratio = Current assets / Current liabilities"},{"id":10,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Quick Ratio","definition":"Quick ratio = (Cash + Marketable securities + Accounts receivable) / Current liabilities"},{"id":11,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Cash Ratio","definition":"Cash ratio = (Cash + Marketable securities) / Current liabilities"},{"id":12,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Periodic Cost of Supplier Financing","definition":"Periodic financing cost = d / (1 − d)\n\nd = discount percentage expressed as a decimal"},{"id":13,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Effective Annual Cost of Supplier Financing","definition":"EAR = [1 + d / (1 − d)]^(365 / (T − t)) − 1\n\nd = discount rate · t = discount period · T = net payment period"},{"id":14,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Net Present Value (NPV)","definition":"NPV = Σₜ₌₀ⁿ [CFₜ / (1 + r)ᵗ]"},{"id":15,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Internal Rate of Return (IRR)","definition":"0 = Σₜ₌₀ⁿ [CFₜ / (1 + IRR)ᵗ]"},{"id":16,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Return on Invested Capital (ROIC)","definition":"ROIC = NOPAT / Average invested capital"},{"id":17,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Project NPV with Real Options","definition":"Project NPV with options = NPV without options − Option cost + Option value"},{"id":18,"module":"LM 6","moduleTitle":"Capital Structure","term":"Weighted-Average Cost of Capital (WACC)","definition":"WACC = w_d r_d (1 − t) + w_e r_e\n\nAdd the market-value weight × required return of preferred shares or another distinct capital source when applicable."},{"id":19,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition I — Without Taxes","definition":"V_L = V_U"},{"id":20,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition II — Without Taxes","definition":"r_e = r₀ + (r₀ − r_d)(D / E)"},{"id":21,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition I — With Corporate Taxes","definition":"V_L = V_U + tD"},{"id":22,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition II — With Corporate Taxes","definition":"r_e = r₀ + (r₀ − r_d)(1 − t)(D / E)"},{"id":23,"module":"LM 6","moduleTitle":"Capital Structure","term":"Static Trade-Off Model","definition":"V_L = V_U + tD − PV(expected financial distress costs)"}],"flashcards":[{"id":1,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Sole Proprietorship","definition":"A business owned by a single individual that is an extension of the owner with no separate legal identity. The owner has unlimited liability."},{"id":2,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"General Partnership","definition":"A business owned by two or more partners who share management responsibilities and face shared unlimited liability for all business debts."},{"id":3,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Limited Partnership (LP)","definition":"A partnership with at least one General Partner (unlimited liability, manages the firm) and one or more Limited Partners (liability capped at investment, no management role)."},{"id":4,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Corporation (Public Limited Company)","definition":"A separate legal entity from its owners. It offers limited liability to shareholders but is subject to double taxation (at the entity level and personal level on dividends)."},{"id":5,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Double Taxation","definition":"A corporate disadvantage where profits are taxed at the corporate rate, and the remaining distributed dividends are taxed again as personal income for the shareholder."},{"id":6,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Initial Public Offering (IPO)","definition":"The first public sale of a company's shares to investors, typically involving an underwriter to raise new capital."},{"id":7,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Direct Listing","definition":"A method of going public where existing shares are listed on an exchange without an underwriter or new capital raise, providing liquidity for existing owners."},{"id":8,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Special Purpose Acquisition Company (SPAC)","definition":"A \"blank check\" company that raises capital via IPO to acquire an unidentified private company within a set timeframe."},{"id":9,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Free Float","definition":"The percentage of a public company's shares that are actively traded and not held by insiders, sponsors, or strategic investors."},{"id":10,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Public vs. Private Issuers","definition":"Public issuers trade on exchanges with high transparency and liquidity. Private issuers are unlisted, have restricted investor bases (accredited investors), and lower transparency."},{"id":11,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Debt Claim Nature","definition":"A contractual and explicit promise to pay a fixed amount of interest and principal over a finite term."},{"id":12,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Equity Claim Nature","definition":"A residual and vague promise; shareholders have a claim on what remains after all senior obligations (debt, taxes, etc.) are met."},{"id":13,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Financial Priority","definition":"Debt is senior (paid first); equity is junior (last in line/residual)."},{"id":14,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Shareholder Theory","definition":"The doctrine that a company's primary objective is to maximize the market value of common equity (shareholder wealth)."},{"id":15,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Stakeholder Theory","definition":"A broader perspective where managers balance the interests of all groups with a \"stake\" in the firm, including employees, customers, suppliers, and the community."},{"id":16,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Environmental Factors (ESG)","definition":"Issues relating to the natural world, such as climate change, waste management, water scarcity, and biodiversity."},{"id":17,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Social Factors (ESG)","definition":"Issues relating to people and relationships, such as data privacy, labor standards, human rights, and community relations."},{"id":18,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Governance Factors (ESG)","definition":"Standards for running a company, including board composition, executive compensation alignment, and whistleblower protections."},{"id":19,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Stranded Assets","definition":"Assets that lose value or become unviable due to regulatory or climate-related shifts (e.g., a coal mine becoming unusable due to carbon taxes)."},{"id":20,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Transition Risk","definition":"Economic and financial losses resulting from the move toward a lower-carbon economy (e.g., changes in policy or consumer preferences)."},{"id":21,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Principal-Agent Relationship","definition":"An arrangement where one party (the principal/shareholder) hires another (the agent/manager) to perform a service and act in their best interest."},{"id":22,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Agency Costs","definition":"Costs arising from misaligned interests between principals and agents, including monitoring costs (audits) and lost opportunities."},{"id":23,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Information Asymmetry","definition":"The gap in information where managers (insiders) know more about the firm's prospects and risks than shareholders and lenders (outsiders)."},{"id":24,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Audit Committee","definition":"A board committee responsible for overseeing financial reporting and internal controls. Best practice requires it to be composed of independent directors."},{"id":25,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Staggered Board","definition":"A governance structure where only a fraction of the board is elected each year, providing continuity but acting as a defense against hostile takeovers."},{"id":26,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Poison Pill (Shareholder Rights Plan)","definition":"A defense allowing existing shareholders to buy shares at a discount if a hostile bidder acquires a specific percentage of the firm, diluting the bidder's stake."},{"id":27,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Proxy Contest","definition":"A mechanism where a group of shareholders attempts to persuade others to vote out the current board and replace them with a new slate."},{"id":28,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Dual-Class Share Structure","definition":"A capital structure where different classes of shares have unequal voting rights, often allowing founders to maintain control with a small economic stake."},{"id":29,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Bond Indenture and Covenants","definition":"The legal contract for a bond. Covenants are clauses that restrict management actions (e.g., limiting dividends) to protect the interests of lenders."},{"id":30,"module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","term":"Benefits of Good Governance","definition":"Higher operational efficiency, better control processes, lower default risk, and a lower cost of debt."},{"id":31,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Cash Conversion Cycle (CCC) Formula","definition":"$CCC = DOH + DSO - DPO$."},{"id":32,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Days of Inventory on Hand (DOH)","definition":"The average number of days it takes for a company to sell its inventory."},{"id":33,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Days Sales Outstanding (DSO)","definition":"The average number of days it takes for a company to collect cash from customers after a sale on credit."},{"id":34,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Days Payable Outstanding (DPO)","definition":"The average number of days it takes for a company to pay its suppliers."},{"id":35,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Primary Liquidity Sources","definition":"Readily available cash, marketable securities, bank lines of credit, and cash from normal operations."},{"id":36,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Secondary Liquidity Sources","definition":"Desperate measures used in crises, such as selling fixed assets, debt restructuring, or filing for bankruptcy. These send negative signals."},{"id":37,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Drags on Liquidity","definition":"Actions or events that slow down cash inflows, such as uncollectible receivables or obsolete inventory."},{"id":38,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Pulls on Liquidity","definition":"Actions or events that accelerate cash outflows, such as suppliers demanding faster payment or reduced credit lines."},{"id":39,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"EAR of Supplier Financing (Cost of missing discount)","definition":"$EAR = (1 + \\frac{Discount %}{100% - Discount %})^{(\\frac{365}{Net Period - Discount Period})} - 1$."},{"id":40,"module":"LM 4","moduleTitle":"Working Capital and Liquidity","term":"Aggressive vs. Conservative Working Capital","definition":"Aggressive: Low current assets, high short-term debt (higher return, higher rollover risk). Conservative: High current assets, long-term financing (lower risk, lower return)."},{"id":41,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Net Present Value (NPV) Rule","definition":"Sum of the PV of all project cash flows. Rule: Accept if $NPV > 0$. It measures the absolute increase in shareholder wealth."},{"id":42,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Internal Rate of Return (IRR) Rule","definition":"The discount rate where NPV equals zero. Rule: Accept if $IRR > Hurdle Rate$."},{"id":43,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Mutually Exclusive Projects Conflict","definition":"If NPV and IRR rules give different rankings for projects, always choose the one with the highest NPV."},{"id":44,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Return on Invested Capital (ROIC)","definition":"$ROIC = (NOPAT) / (Average Invested Capital)$. If $ROIC > WACC$, the firm is creating value."},{"id":45,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Incremental Cash Flows","definition":"Only the cash flows that change if a project is accepted. Management must ignore sunk costs and include externalities."},{"id":46,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Sunk Costs","definition":"Costs that have already been incurred and cannot be recovered regardless of the decision; they must be excluded from capital allocation analysis."},{"id":47,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Cannibalization","definition":"A negative externality where a new project reduces the sales of an existing product within the same firm."},{"id":48,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Abandonment Option","definition":"A real option providing the right to terminate a project early if financial results are disappointing."},{"id":49,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Expansion (Growth) Option","definition":"A real option providing the right to make additional investments in a project if initial results are strong."},{"id":50,"module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","term":"Timing Option","definition":"A real option allowing management to delay a project to wait for better information or favorable market conditions."},{"id":51,"module":"LM 6","moduleTitle":"Capital Structure","term":"Weighted Average Cost of Capital (WACC) Formula","definition":"$WACC = (w_d \\times r_d \\times (1-t)) + (w_e \\times r_e)$. Weights must be based on market values."},{"id":52,"module":"LM 6","moduleTitle":"Capital Structure","term":"Cost of Debt Adjustment","definition":"The pre-tax cost of debt is adjusted by $(1 - t)$ because interest expense is tax-deductible (the debt tax shield)."},{"id":53,"module":"LM 6","moduleTitle":"Capital Structure","term":"Modigliani–Miller (MM) Prop I - No Taxes","definition":"Capital structure is irrelevant to firm value. The value of a levered firm ($V_L$) equals the value of an unlevered firm ($V_U$)."},{"id":54,"module":"LM 6","moduleTitle":"Capital Structure","term":"Modigliani–Miller (MM) Prop II - No Taxes","definition":"The cost of equity increases linearly with the debt-to-equity ratio, perfectly offsetting the benefit of using cheaper debt."},{"id":55,"module":"LM 6","moduleTitle":"Capital Structure","term":"MM Proposition I - With Taxes","definition":"Due to the interest tax shield, firm value increases as debt is added. Theoretically, firm value is maximized at 100% debt."},{"id":56,"module":"LM 6","moduleTitle":"Capital Structure","term":"Static Trade-off Theory","definition":"The optimal capital structure balances the marginal benefit of the tax shield against the marginal cost of financial distress."},{"id":57,"module":"LM 6","moduleTitle":"Capital Structure","term":"Pecking Order Theory","definition":"Managers follow a hierarchy of preference for funding: 1. Internal Funds, 2. Debt, 3. New Equity (to minimize signaling costs)."},{"id":58,"module":"LM 6","moduleTitle":"Capital Structure","term":"Signaling (Debt vs. Equity)","definition":"Issuing debt is a positive signal (confidence in cash flows). Issuing equity is a negative signal (management thinks the stock is overvalued)."},{"id":59,"module":"LM 6","moduleTitle":"Capital Structure","term":"Costs of Financial Distress","definition":"Costs associated with the threat of bankruptcy, including direct costs (legal fees) and indirect costs (lost customers and employees)."},{"id":60,"module":"LM 6","moduleTitle":"Capital Structure","term":"Free Cash Flow Hypothesis","definition":"The idea that higher debt levels \"discipline\" managers by forcing them to make fixed payments, preventing wasteful spending on perks."},{"id":61,"module":"LM 7","moduleTitle":"Business Models","term":"Value Proposition","definition":"The specific product attributes (price, performance, features) that lead customers to choose a firm over its competitors."},{"id":62,"module":"LM 7","moduleTitle":"Business Models","term":"Value Chain","definition":"The internal systems and processes a firm uses to create and deliver value to its customers."},{"id":63,"module":"LM 7","moduleTitle":"Business Models","term":"Supply Chain","definition":"The entire sequence of processes, both internal and external, involved in producing and delivering a product to the end user."},{"id":64,"module":"LM 7","moduleTitle":"Business Models","term":"Price Discrimination","definition":"A pricing model where different prices are charged to different customers based on their willingness to pay (e.g., student discounts)."},{"id":65,"module":"LM 7","moduleTitle":"Business Models","term":"Freemium Model","definition":"A model providing a basic level of functionality for free while charging for advanced features."},{"id":66,"module":"LM 7","moduleTitle":"Business Models","term":"Razor/Razorblade Pricing","definition":"Selling a durable equipment base at near cost (razor) and high-margin proprietary consumables repeatedly (razorblades)."},{"id":67,"module":"LM 7","moduleTitle":"Business Models","term":"Dynamic Pricing","definition":"Adjusting prices in real-time based on supply and demand (e.g., \"surge\" pricing for ride-sharing)."},{"id":68,"module":"LM 7","moduleTitle":"Business Models","term":"Network Effects","definition":"A phenomenon where a product or service becomes more valuable as more users join the network (e.g., social media)."},{"id":69,"module":"LM 7","moduleTitle":"Business Models","term":"Scalability","definition":"The ability of a business to grow revenue significantly while costs increase at a much slower rate."},{"id":70,"module":"LM 7","moduleTitle":"Business Models","term":"Switching Costs","definition":"Barriers (financial, time-based, or psychological) that make it difficult or expensive for a customer to change from one provider to another."}],"standard":[{"id":1,"difficulty":"standard","module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","question":"Which organizational form most likely combines a separate legal identity, limited shareholder liability, and the broadest access to external financing?","options":{"A":"General partnership","B":"Corporation","C":"Sole proprietorship"},"answer":"B","explanation":"A corporation is legally separate from its owners, shareholders normally have limited liability, and the company can raise capital from a broad set of debt and equity investors. Sole proprietorships and general partnerships generally lack separate identity and expose owners to unlimited liability."},{"id":2,"difficulty":"standard","module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","question":"A limited partner in a limited partnership most likely:","options":{"A":"manages daily operations and bears unlimited liability.","B":"has losses limited to the invested amount and normally delegates management to the general partner.","C":"receives no share of partnership income until the partnership is liquidated."},"answer":"B","explanation":"Limited partners supply capital and generally have limited liability. The general partner normally manages the business and bears unlimited liability. Profit-sharing is determined by the partnership agreement."},{"id":3,"difficulty":"standard","module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","question":"Which statement best distinguishes a public limited company from a publicly traded company?","options":{"A":"Every public limited company must have exchange-listed shares.","B":"Public limited is a legal form, while publicly traded describes whether securities trade in a public market.","C":"Publicly traded companies have no separate legal identity."},"answer":"B","explanation":"A public limited company is legally eligible for broad ownership and public issuance, but it does not necessarily list its shares. Listing is a market status, not the legal form itself."},{"id":4,"difficulty":"standard","module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","question":"A private company that lists existing shares without a traditional underwritten offering and primarily provides liquidity to existing owners is using a:","options":{"A":"direct listing.","B":"leveraged buyout.","C":"rights offering."},"answer":"A","explanation":"A direct listing admits existing shares to exchange trading without the traditional IPO underwriting process. An LBO takes a company private; a rights offering raises equity from existing shareholders."},{"id":5,"difficulty":"standard","module":"LM 2","moduleTitle":"Investors and Other Stakeholders","question":"From the issuer’s perspective, debt is generally riskier than equity because debt:","options":{"A":"gives investors unlimited upside.","B":"requires contractual interest and principal payments.","C":"has a residual claim on assets."},"answer":"B","explanation":"Debt requires fixed payments and can cause default if the issuer cannot pay. Equity has no contractual repayment and is residual."},{"id":6,"difficulty":"standard","module":"LM 2","moduleTitle":"Investors and Other Stakeholders","question":"Which investor has the residual claim on a company’s cash flows and assets?","options":{"A":"Common shareholder","B":"Secured lender","C":"Senior unsecured bondholder"},"answer":"A","explanation":"Common shareholders receive what remains after all senior claims. Lenders have contractual priority."},{"id":7,"difficulty":"standard","module":"LM 2","moduleTitle":"Investors and Other Stakeholders","question":"After issuing debt, shareholders encourage management to replace a low-risk project with a high-risk project having the same expected value. This is most consistent with:","options":{"A":"risk shifting.","B":"underinvestment.","C":"cumulative voting."},"answer":"A","explanation":"Shareholders capture much of the upside from greater risk while creditors absorb part of the downside, creating an incentive for asset substitution or risk shifting."},{"id":8,"difficulty":"standard","module":"LM 2","moduleTitle":"Investors and Other Stakeholders","question":"Which factor is most likely classified as social rather than environmental or governance?","options":{"A":"Customer data privacy","B":"Board independence","C":"Carbon emissions"},"answer":"A","explanation":"Customer privacy and data protection are social issues. Board independence is governance, and emissions are environmental."},{"id":9,"difficulty":"standard","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"A manager pursues acquisitions primarily to increase the company’s size and the manager’s status. This behavior is known as:","options":{"A":"entrenchment.","B":"empire building.","C":"underinvestment."},"answer":"B","explanation":"Empire building is growth for growth’s sake rather than value creation. Entrenchment is protection of the manager’s position."},{"id":10,"difficulty":"standard","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"Which board committee should most likely be composed entirely of independent directors and include financial expertise?","options":{"A":"Audit committee","B":"Investment committee","C":"Executive committee"},"answer":"A","explanation":"The audit committee oversees financial reporting, internal and external audit, and control systems. Independence and accounting expertise are core governance expectations."},{"id":11,"difficulty":"standard","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"A non-binding shareholder vote on executive remuneration is most commonly called:","options":{"A":"cumulative voting.","B":"say on pay.","C":"a tender offer."},"answer":"B","explanation":"Say-on-pay allows shareholders to express approval or disapproval of executive compensation, commonly on an advisory basis."},{"id":12,"difficulty":"standard","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"A poison pill is designed primarily to:","options":{"A":"require all directors to stand for election annually.","B":"dilute a hostile bidder after a triggering ownership threshold is reached.","C":"prevent bondholders from enforcing covenants."},"answer":"B","explanation":"A shareholder rights plan permits other shareholders to acquire shares on favorable terms, diluting the hostile acquirer and making the takeover more costly."},{"id":13,"difficulty":"standard","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"A bond covenant that requires the issuer to maintain insurance is best classified as:","options":{"A":"affirmative.","B":"negative.","C":"residual."},"answer":"A","explanation":"Affirmative covenants require actions. Negative covenants restrict actions such as additional borrowing or asset sales."},{"id":14,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"A company reports DOH of 42 days, DSO of 31 days, and DPO of 28 days. Its cash conversion cycle is:","options":{"A":"45 days.","B":"73 days.","C":"101 days."},"answer":"A","explanation":"CCC = 42 + 31 − 28 = 45 days."},{"id":15,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"Holding DOH and DSO constant, an increase in DPO will most likely:","options":{"A":"lengthen the CCC.","B":"shorten the CCC.","C":"have no effect on the CCC."},"answer":"B","explanation":"DPO is subtracted in the CCC formula. Paying suppliers later reduces the number of days the issuer finances the cycle itself."},{"id":16,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"Which liquidity ratio is the most conservative?","options":{"A":"Current ratio","B":"Quick ratio","C":"Cash ratio"},"answer":"C","explanation":"The cash ratio includes only cash and marketable securities in the numerator and therefore excludes receivables and inventory."},{"id":17,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"Which is most likely a secondary rather than primary source of liquidity?","options":{"A":"Cash generated from operations","B":"Cash and marketable securities","C":"Sale of a strategic long-term asset"},"answer":"C","explanation":"Asset sales are secondary sources and may sacrifice future value. Operating cash, cash balances, and normal borrowing are primary sources."},{"id":18,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"A supplier offers terms of 2/10, net 30. The financing period created by forgoing the discount is:","options":{"A":"10 days.","B":"20 days.","C":"30 days."},"answer":"B","explanation":"Payment is delayed from day 10 to day 30, creating 20 days of implicit financing."},{"id":19,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"Which working-capital approach most likely uses high levels of cash and inventory and relies more heavily on long-term financing?","options":{"A":"Aggressive","B":"Conservative","C":"Speculative"},"answer":"B","explanation":"A conservative approach prioritizes liquidity and lower refinancing risk at the cost of lower expected return and higher carrying cost."},{"id":20,"difficulty":"standard","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"Suppliers unexpectedly demand payment 15 days earlier than normal. This is best described as a:","options":{"A":"drag on liquidity.","B":"pull on liquidity.","C":"source of operating leverage."},"answer":"B","explanation":"A pull accelerates cash outflows. Slow receivables or inventory buildup are drags because they delay inflows."},{"id":21,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"Which project is most likely classified as a going-concern project?","options":{"A":"Replacing a machine needed to maintain existing production","B":"Entering an unfamiliar foreign market","C":"Developing an experimental product platform"},"answer":"A","explanation":"Going-concern projects maintain existing operations. New markets and experimental products are expansion or new-line projects."},{"id":22,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"The primary decision rule for an independent project is to accept it when:","options":{"A":"NPV is positive.","B":"IRR is positive.","C":"ROIC is positive."},"answer":"A","explanation":"A positive NPV means the project is expected to earn more than its risk-adjusted required return and add shareholder value."},{"id":23,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A project’s IRR is the discount rate that:","options":{"A":"maximizes the project’s accounting profit.","B":"makes the project’s NPV equal zero.","C":"equals the risk-free rate."},"answer":"B","explanation":"IRR is defined as the rate that sets the present value of inflows equal to the present value of outflows."},{"id":24,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A company has NOPAT of 18 million and average invested capital of 150 million. Its ROIC is:","options":{"A":"8.33%.","B":"12.00%.","C":"16.67%."},"answer":"B","explanation":"ROIC = 18/150 = 12.0%."},{"id":25,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"Which item should be excluded from the cash flows of a proposed project?","options":{"A":"Market value of land already owned and used by the project","B":"Research expense incurred and paid last year that cannot be recovered","C":"Lost contribution margin from an existing product cannibalized by the project"},"answer":"B","explanation":"The prior research expense is a sunk cost. The land has an opportunity cost, and cannibalization is a negative incremental externality."},{"id":26,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A company can delay a project for one year to obtain better demand information. This flexibility is a:","options":{"A":"timing option.","B":"growth option.","C":"price-setting option."},"answer":"A","explanation":"A timing option permits management to defer commitment until information improves."},{"id":27,"difficulty":"standard","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"For mutually exclusive projects, NPV and IRR provide conflicting rankings. The company should generally select the project with the:","options":{"A":"higher IRR.","B":"shorter life.","C":"higher NPV."},"answer":"C","explanation":"NPV directly measures the absolute increase in shareholder value and is the preferred criterion."},{"id":28,"difficulty":"standard","module":"LM 6","moduleTitle":"Capital Structure","question":"In the WACC calculation, which component is normally adjusted for corporate taxes?","options":{"A":"Cost of debt","B":"Cost of common equity","C":"Cost of retained earnings only"},"answer":"A","explanation":"Interest is often tax deductible, so the pretax debt cost is multiplied by one minus the marginal tax rate."},{"id":29,"difficulty":"standard","module":"LM 6","moduleTitle":"Capital Structure","question":"Under MM Proposition I without taxes, firm value is:","options":{"A":"maximized at 100% debt.","B":"independent of capital structure.","C":"reduced by the present value of the tax shield."},"answer":"B","explanation":"With no taxes or frictions, investors can create homemade leverage and financing does not change total firm value."},{"id":30,"difficulty":"standard","module":"LM 6","moduleTitle":"Capital Structure","question":"According to the pecking order theory, a company most likely prefers financing in which order?","options":{"A":"Equity, public debt, internal funds","B":"Internal funds, debt, external equity","C":"Public debt, equity, internal funds"},"answer":"B","explanation":"Information asymmetry leads companies to prefer internal financing, then debt, and equity last. The 2027 curriculum further distinguishes private debt before public debt."}],"advanced":[{"id":31,"difficulty":"advanced","module":"LM 6","moduleTitle":"Capital Structure","question":"A company has 2 million shares outstanding at a market price of 30 and debt with a market value of 40 million. The pretax cost of debt is 6%, the cost of equity is 11%, and the tax rate is 25%. The WACC is closest to:","options":{"A":"7.10%.","B":"7.90%.","C":"8.40%."},"answer":"C","explanation":"Equity market value = 2 × 30 = 60 million. Total capital = 100 million, so debt weight = 40% and equity weight = 60%. WACC = 0.40(6%)(0.75) + 0.60(11%) = 1.80% + 6.60% = 8.40%."},{"id":32,"difficulty":"advanced","module":"LM 6","moduleTitle":"Capital Structure","question":"A firm currently uses 40% debt and 60% equity. Pretax debt cost is 8%, equity cost is 15%, and the tax rate is 30%. If the weights change to 60% debt and 40% equity while component costs remain unchanged, WACC will:","options":{"A":"decrease by 1.88 percentage points.","B":"decrease by 1.12 percentage points.","C":"increase by 1.88 percentage points."},"answer":"A","explanation":"Initial WACC = 0.40(8%)(0.70) + 0.60(15%) = 11.24%. New WACC = 0.60(8%)(0.70) + 0.40(15%) = 9.36%. The simplified calculation implies a 1.88-point decrease. In reality, component costs would generally rise as leverage increases, so holding them constant is an artificial assumption."},{"id":33,"difficulty":"advanced","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"A supplier offers 1/10, net 30. The EAR of forgoing the discount using a 365-day year is closest to:","options":{"A":"18.4%.","B":"20.1%.","C":"22.0%."},"answer":"B","explanation":"EAR = (1 + 0.01/0.99)^(365/20) - 1 = approximately 20.1%."},{"id":34,"difficulty":"advanced","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"A company is offered 2/10, net 30 and can borrow from a bank at an effective annual rate of 18%. Ignoring transaction costs, it should most likely:","options":{"A":"pay on day 30 because supplier financing is cheaper.","B":"borrow from the bank and pay on day 10.","C":"be indifferent between the two sources."},"answer":"B","explanation":"The supplier-financing EAR is approximately 44.6%, far above 18%. Borrowing from the bank to take the discount reduces financing cost."},{"id":35,"difficulty":"advanced","module":"LM 4","moduleTitle":"Working Capital and Liquidity","question":"A company changes customer terms from 1/10, net 30 to 1/15, net 30, with no change in customer behavior other than paying on the discount date. The most likely immediate effect is:","options":{"A":"lower DSO and a shorter CCC.","B":"higher DSO and a longer CCC.","C":"higher DPO and a shorter CCC."},"answer":"B","explanation":"Customers now pay on day 15 rather than day 10. DSO rises by five days, lengthening CCC. DPO concerns payments to suppliers, not collections from customers."},{"id":36,"difficulty":"advanced","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A project requires an initial investment of 100 and produces 60 in year 1 and 60 in year 2. At a 10% required return, NPV is closest to:","options":{"A":"4.13.","B":"9.09.","C":"20.00."},"answer":"A","explanation":"NPV = −100 + 60/1.10 + 60/1.10² = −100 + 54.545 + 49.587 = 4.132."},{"id":37,"difficulty":"advanced","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A conventional project’s required return rises from 9% to 12%. Which change is most likely?","options":{"A":"IRR falls and NPV is unchanged.","B":"NPV falls and IRR is unchanged.","C":"Both NPV and IRR fall."},"answer":"B","explanation":"NPV changes with the discount rate. IRR is determined solely by the project’s cash-flow pattern and does not change when the required return changes."},{"id":38,"difficulty":"advanced","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A project has an NPV of −5 without flexibility. Management can purchase an abandonment option for 2, and estimates the option’s value at 10. Total project NPV is:","options":{"A":"3.","B":"5.","C":"7."},"answer":"A","explanation":"NPV with options = −5 − 2 + 10 = 3. The option converts the project into a positive-NPV investment."},{"id":39,"difficulty":"advanced","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A project generates nominal cash flows, but an analyst discounts them using a real required return. The analyst will most likely:","options":{"A":"overstate present value, all else equal.","B":"understate present value, all else equal.","C":"obtain the correct result because inflation cancels."},"answer":"A","explanation":"A real rate is lower than the corresponding nominal rate when expected inflation is positive. Discounting nominal cash flows at the lower real rate overstates present value."},{"id":40,"difficulty":"advanced","module":"LM 5","moduleTitle":"Capital Investments and Capital Allocation","question":"A company has ROIC of 9% and WACC of 11%, while reported ROE is 18%. The most likely interpretation is:","options":{"A":"the company creates value because ROE exceeds WACC.","B":"the company destroys value on invested capital, and high ROE may reflect leverage.","C":"WACC should be compared only with ROE."},"answer":"B","explanation":"ROIC is the return generated for all invested capital and should be compared with WACC. ROIC below WACC indicates value destruction. Leverage can magnify ROE without improving underlying economics."},{"id":41,"difficulty":"advanced","module":"LM 6","moduleTitle":"Capital Structure","question":"Under MM Proposition II without taxes, an increase in D/E causes the cost of equity to:","options":{"A":"increase linearly, while WACC remains constant.","B":"remain constant, while WACC falls.","C":"fall because debt is cheaper than equity."},"answer":"A","explanation":"Leverage makes equity riskier. The rise in equity cost exactly offsets the greater use of cheaper debt under MM’s no-tax assumptions."},{"id":42,"difficulty":"advanced","module":"LM 6","moduleTitle":"Capital Structure","question":"An unlevered firm is worth 80 million. It issues 20 million of perpetual debt, and the corporate tax rate is 25%. Under MM with taxes and no distress costs, the levered firm value is:","options":{"A":"80 million.","B":"85 million.","C":"100 million."},"answer":"B","explanation":"V_L = V_U + tD = 80 + 0.25(20) = 85 million."},{"id":43,"difficulty":"advanced","module":"LM 6","moduleTitle":"Capital Structure","question":"Under static trade-off theory, optimal leverage occurs where:","options":{"A":"the average tax shield equals total debt.","B":"the marginal tax benefit of debt equals the marginal expected distress cost.","C":"the cost of equity is minimized independently of debt cost."},"answer":"B","explanation":"Firm value is maximized when the incremental benefit of another unit of debt is exactly offset by its incremental distress cost."},{"id":44,"difficulty":"advanced","module":"LM 6","moduleTitle":"Capital Structure","question":"Which company most likely supports the greatest debt capacity?","options":{"A":"A pre-revenue biotechnology firm with patent assets","B":"A mature regulated utility with stable cash flow and tangible assets","C":"A cyclical software start-up with high fixed costs"},"answer":"B","explanation":"Stable cash flows, tangible collateral, and mature operations support greater debt capacity. High uncertainty and intangible assets support less."},{"id":45,"difficulty":"advanced","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"A two-tier board structure most likely places independent oversight in the:","options":{"A":"management board.","B":"supervisory board.","C":"shareholder relations department."},"answer":"B","explanation":"The supervisory board oversees the management board and normally contains the independent or non-executive directors."},{"id":46,"difficulty":"advanced","module":"LM 3","moduleTitle":"Corporate Governance: Conflicts, Mechanisms, Risks, and Benefits","question":"A founder owns 18% of a company’s economic interest but 55% of its voting power. This is most likely achieved through:","options":{"A":"cumulative voting.","B":"a dual-class share structure.","C":"a poison pill."},"answer":"B","explanation":"Super-voting founder shares can deliver voting control disproportionate to economic ownership."},{"id":47,"difficulty":"advanced","module":"LM 7","moduleTitle":"Business Models","question":"A platform subsidizes buyers to attract more sellers, which in turn increases the platform’s usefulness to buyers. This is primarily a:","options":{"A":"cross-side network effect.","B":"diseconomy of scale.","C":"cost-plus pricing effect."},"answer":"A","explanation":"Growth on one side of a two-sided platform increases value to the other side, attracting more participants and reinforcing the network."},{"id":48,"difficulty":"advanced","module":"LM 7","moduleTitle":"Business Models","question":"Which statement about freemium and hidden-revenue models is most accurate?","options":{"A":"In both models, no party pays the company.","B":"Freemium charges some users for premium functionality; hidden revenue obtains payment from another participant group.","C":"Hidden revenue is the same as penetration pricing."},"answer":"B","explanation":"Freemium converts a portion of users to paid plans. Hidden-revenue models provide apparent free use while advertisers, sellers, or another side pays."},{"id":49,"difficulty":"advanced","module":"LM 7","moduleTitle":"Business Models","question":"A company sells printers near cost and earns high margins on proprietary ink cartridges. Its business model most likely depends on:","options":{"A":"razor–razorblade pricing and customer lock-in.","B":"reverse auctions and low switching costs.","C":"pure cost-plus pricing."},"answer":"A","explanation":"The installed equipment drives repeat purchases of high-margin consumables. Compatibility and switching costs protect economics."},{"id":50,"difficulty":"advanced","module":"LM 7","moduleTitle":"Business Models","question":"An analyst observes that a company has strong revenue growth, negative contribution margin on every additional customer, rising customer-acquisition cost, and no evidence of pricing power. The most appropriate conclusion is:","options":{"A":"scale alone will necessarily create profitability.","B":"the business model’s unit economics are currently unsustainable unless economics improve.","C":"network effects eliminate the relevance of variable cost."},"answer":"B","explanation":"Growth destroys value when each incremental customer loses money and acquisition cost rises. Scale can help fixed-cost absorption, but cannot guarantee profitability without improved unit economics, pricing, retention, or variable cost."}],"traps":[{"id":1,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Public limited company does not necessarily mean publicly traded","trap":"Assuming that every public limited company is exchange-listed.","definition":"'Public limited company' is a legal form; 'publicly traded' describes whether its shares trade on a public market. A public limited company can remain unlisted."},{"id":2,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Shareholders do not normally appoint the CEO directly","trap":"Saying that shareholders manage the company or select senior executives directly.","definition":"Shareholders elect the board of directors; the board appoints and oversees senior management, including the CEO."},{"id":3,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"A sole proprietorship has unlimited personal liability","trap":"Focusing on simplicity and control while overlooking creditor recourse against the owner's personal assets.","definition":"The business and owner are generally not separate legal persons. The owner receives the profits but is personally responsible for business obligations."},{"id":4,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"General partners can have unlimited liability","trap":"Assuming each general partner is responsible only for a proportional share of partnership debt.","definition":"General partners may be personally liable for all partnership obligations, subject to the applicable jurisdiction."},{"id":5,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"General partners and limited partners do not have the same rights and risks","trap":"Treating every partner in a limited partnership as having limited liability and equal management authority.","definition":"The general partner normally manages the business and has unlimited liability. Limited partners generally have limited liability and restricted management participation."},{"id":6,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"A limited partnership is not the same as an LLP","trap":"Using limited partnership and limited liability partnership interchangeably.","definition":"A limited partnership normally has at least one general partner with unlimited liability. In an LLP, partners generally receive liability protection while retaining management participation, subject to local law."},{"id":7,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Pass-through taxation can apply without a cash distribution","trap":"Assuming owners are taxed only when the entity distributes cash.","definition":"Income may be allocated to owners and taxed at the owner level even when the business retains the cash."},{"id":8,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Corporate double taxation is a two-level concept","trap":"Saying every dollar of corporate income is automatically taxed twice at the same moment.","definition":"The corporation may pay tax on income, and shareholders may later pay tax on dividends. The second layer generally arises when after-tax income is distributed."},{"id":9,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Limited liability does not protect the amount invested","trap":"Concluding that limited liability prevents shareholders from losing money.","definition":"A shareholder can lose the entire investment. Limited liability generally prevents creditors from pursuing the shareholder's other personal assets."},{"id":10,"module":"LM 1","moduleTitle":"Organizational Forms, Corporate Issuer Features, and Ownership","term":"Going public is not limited to a traditional IPO","trap":"Assuming a company can become publicly traded only by issuing new shares through an IPO.","definition":"Other routes may include a direct listing, a merger with an already public company, or a SPAC transaction. A direct listing may provide liquidity without raising new primary capital."},{"id":11,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Debt is a contractual claim; equity is a residual claim","trap":"Giving shareholders priority because they are the legal owners.","definition":"Creditors generally receive contractual interest and principal before shareholders. Equity receives the residual value after all senior claims are satisfied."},{"id":12,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Contractual payments do not make debt risk-free","trap":"Treating promised interest and principal as guaranteed cash flows.","definition":"Lenders remain exposed to default risk, recovery risk, liquidity risk, and changes in the borrower's credit quality."},{"id":13,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Lenders focus more on downside; shareholders retain more upside","trap":"Assuming lenders and shareholders always prefer the same project risk.","definition":"Lenders have limited upside but can lose principal. Shareholders have a residual claim and may prefer higher-risk projects when the upside accrues mainly to equity."},{"id":14,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Risk shifting can transfer value from creditors to shareholders","trap":"Assuming a riskier project benefits every capital provider equally.","definition":"After debt is issued, shareholders may favor high-volatility projects: they capture much of the upside, while creditors bear part of the downside through greater default risk."},{"id":15,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Large dividends can harm creditors","trap":"Treating dividend policy as relevant only to shareholders.","definition":"A large distribution removes assets from the issuer and reduces the resources available to service debt. Debt covenants may therefore restrict dividends and share repurchases."},{"id":16,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Stakeholders do not have perfectly aligned interests","trap":"Assuming a decision that benefits one stakeholder group must benefit all groups.","definition":"Employees, customers, suppliers, governments, creditors, and shareholders can have conflicting objectives regarding wages, prices, payment terms, risk, taxes, and distributions."},{"id":17,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Stakeholder theory does not require ignoring shareholders","trap":"Treating shareholder theory and stakeholder theory as mutually exclusive extremes.","definition":"Stakeholder management can support long-term shareholder value by protecting customer relationships, employee productivity, supplier continuity, and the firm's social license to operate."},{"id":18,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Negative externalities may be economically material before they appear in accounting statements","trap":"Ignoring an environmental or social cost because the company has not yet recognized a liability.","definition":"Externalities can later become fines, litigation, remediation costs, regulation, reputational damage, or lost revenue."},{"id":19,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"Physical risk and transition risk are different","trap":"Classifying every climate-related risk as a physical event.","definition":"Physical risk arises from events such as floods, fires, and storms. Transition risk arises from regulation, technology, taxes, and changing demand during the move to a lower-carbon economy."},{"id":20,"module":"LM 2","moduleTitle":"Investors and Other Stakeholders","term":"A stranded asset is not simply an old or depreciated asset","trap":"Calling any asset with a low book value a stranded asset.","definition":"A stranded asset loses economic value earlier than expected because of regulatory, technological, environmental, or market changes."},{"id":21,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Do not reverse principal and agent","trap":"Calling management the principal because managers control daily operations.","definition":"In the shareholder-manager relationship, shareholders are the principals and managers are the agents hired to act on their behalf."},{"id":22,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Separation of ownership and control creates both benefits and agency risk","trap":"Assuming professional management is either entirely beneficial or entirely harmful.","definition":"Specialized managers can improve operations, but they may pursue compensation, prestige, job security, or empire building rather than shareholder value."},{"id":23,"module":"LM 3","moduleTitle":"Corporate Governance","term":"The board oversees; management operates","trap":"Assigning daily operating decisions to the board of directors.","definition":"The board appoints and monitors management, approves major decisions, and oversees strategy and risk. Management executes the company's operations."},{"id":24,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Director independence is not determined only by share ownership","trap":"Assuming a director is independent merely because the director owns few shares.","definition":"Independence depends on the absence of material employment, family, advisory, commercial, or other relationships that could impair objective judgment."},{"id":25,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Agency conflicts can occur between controlling and minority shareholders","trap":"Assuming the only important conflict is managers versus all shareholders.","definition":"A controlling shareholder may use related-party transactions, special dividends, transfer pricing, or corporate assets to obtain private benefits at the expense of minorities."},{"id":26,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Voting control may differ from economic ownership","trap":"Assuming voting power is always proportional to the percentage of capital invested.","definition":"Dual-class structures can give one class more votes per share, allowing a founder to control the company with a smaller cash-flow ownership stake."},{"id":27,"module":"LM 3","moduleTitle":"Corporate Governance","term":"A bond indenture is broader than a covenant","trap":"Using the terms indenture and covenant as exact synonyms.","definition":"The indenture is the full legal agreement governing the bond. A covenant is a specific promise or restriction contained in that agreement."},{"id":28,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Covenants primarily protect creditors","trap":"Treating covenants as provisions designed to increase shareholder upside.","definition":"Covenants may limit additional borrowing, dividends, asset sales, mergers, or deterioration in financial ratios to protect the lender's position."},{"id":29,"module":"LM 3","moduleTitle":"Corporate Governance","term":"A tender offer is made directly to shareholders","trap":"Describing a tender offer as an offer submitted only to the target company's board.","definition":"A bidder offers to purchase shares from the target's shareholders, commonly at a stated price and subject to specified conditions."},{"id":30,"module":"LM 3","moduleTitle":"Corporate Governance","term":"A poison pill can protect value or entrench management","trap":"Classifying every takeover defense as automatically good or automatically bad.","definition":"A poison pill may improve negotiating leverage against an inadequate bid, but it can also block a value-enhancing acquisition and protect ineffective managers."},{"id":31,"module":"LM 3","moduleTitle":"Corporate Governance","term":"Equity-based compensation does not eliminate agency problems","trap":"Assuming stock options or restricted shares perfectly align managers with long-term shareholders.","definition":"Equity compensation can encourage excessive risk, metric manipulation, short-term price management, or opportunistic timing. Design and oversight still matter."},{"id":32,"module":"LM 4","moduleTitle":"Working Capita
