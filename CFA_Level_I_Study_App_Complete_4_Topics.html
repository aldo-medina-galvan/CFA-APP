 = $5.0 million. Total = $7.5 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":32,"difficulty":"advanced","question":"Using the facts in Question 31, if the performance fee is calculated net of the management fee, total manager fees are closest to:","options":{"A":"$7.0 million.","B":"$7.5 million.","C":"$8.0 million."},"answer":"A","explanation":"Management fee = $2.5 million. Net value before incentive fee = 125 x 0.98 = 122.5. Performance fee = (122.5 - 100) x 20% = $4.5 million. Total = $7.0 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":33,"difficulty":"advanced","question":"A fund begins with $100 million and ends before fees at $125 million. It charges a 2% management fee on year-end AUM, a 20% performance fee calculated net of management fees, and an 8% hard hurdle. Total fees are closest to:","options":{"A":"$4.0 million.","B":"$5.4 million.","C":"$7.0 million."},"answer":"B","explanation":"Management fee = 125 x 2% = 2.5. Net value before incentive = 125 x 0.98 = 122.5. Hurdle value = 100 x 1.08 = 108. Excess = 14.5. Performance fee = 14.5 x 20% = 2.9. Total fees = 2.5 + 2.9 = $5.4 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":34,"difficulty":"advanced","question":"A hedge fund’s investor-specific high-water mark is $110 million. The fund’s current gross value is $118 million. It charges a 1% management fee on year-end value and a 20% performance fee calculated after the management fee. Total fees are closest to:","options":{"A":"$1.18 million.","B":"$2.54 million.","C":"$2.78 million."},"answer":"B","explanation":"Management fee = 118 x 1% = 1.18. Value after management fee = 116.82. New value above HWM = 116.82 - 110 = 6.82. Performance fee = 6.82 x 20% = 1.364. Total = 1.18 + 1.364 = $2.544 million.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":35,"difficulty":"advanced","question":"A private fund makes a $100 million investment and receives cash flows of $30 million, $40 million, and $50 million at the ends of Years 1, 2, and 3, respectively. The IRR is closest to:","options":{"A":"5.7%.","B":"8.9%.","C":"12.0%."},"answer":"B","explanation":"Enter CF0 = -100, C01 = 30, C02 = 40, and C03 = 50 in the BA II Plus Professional cash flow worksheet. IRR CPT gives approximately 8.90%.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":36,"difficulty":"advanced","question":"An investor contributes $120 million and borrows $60 million at 5%. The combined portfolio earns 11% before financing cost. The investor’s leveraged return is closest to:","options":{"A":"11%.","B":"14%.","C":"17%."},"answer":"B","explanation":"Leveraged return = 11% + (60 / 120) × (11% − 5%) = 14%.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":37,"difficulty":"advanced","question":"A private debt fund has a $78 million mortgage secured by property currently worth $96 million. The loan covenant requires a maximum LTV of 75%. The required debt paydown is closest to:","options":{"A":"$4 million.","B":"$6 million.","C":"$8 million."},"answer":"B","explanation":"Maximum permitted loan = 96 x 75% = $72 million. Required paydown = 78 - 72 = $6 million.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":38,"difficulty":"advanced","question":"A commodity has a spot price of $80. The annual continuously compounded risk-free rate is 3%, carrying costs are 4%, convenience yield is 2%, and maturity is one year. The forward price is closest to:","options":{"A":"$76.10.","B":"$80.00.","C":"$84.10."},"answer":"C","explanation":"F0=80e (0.03+0.04−0.02)=80e 0.05≈80 (1.05127)=84.10. Carry exceeds convenience yield, so the market is in contango.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":39,"difficulty":"advanced","question":"A long commodity index position earns a 9% spot return, a 3% collateral return, and a -6% roll return. Before fees, total return is closest to:","options":{"A":"0%.","B":"6%.","C":"18%."},"answer":"B","explanation":"Approximate total return = spot return + collateral return + roll return = 9% + 3% - 6% = 6%.","module":"LM 5","moduleTitle":"Natural Resources"},{"id":40,"difficulty":"advanced","question":"A real estate fund invests $100 million and sells its only property one year later for $150 million. The waterfall provides an 8% soft hurdle, 20% carried interest, and a full catch-up. Ignoring management fees, the GP distribution is:","options":{"A":"$8.4 million.","B":"$10.0 million.","C":"$12.5 million."},"answer":"B","explanation":"LP first receives $100 million capital and $8 million preferred return. GP receives a $2 million catch-up so it owns 20% of the first $10 million of profit. Remaining proceeds are $40 million, split 80/20, giving another $8 million to GP. Total GP = $10 million, equal to 20% of the $50 million total profit.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":41,"difficulty":"advanced","question":"Using the facts in Question 40, assume instead an 8% hard hurdle with no catch-up. The GP distribution is:","options":{"A":"$8.4 million.","B":"$10.0 million.","C":"$12.0 million."},"answer":"A","explanation":"After $100 million capital and $8 million hurdle, excess profit is $42 million. GP receives 20% x 42 = $8.4 million.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":42,"difficulty":"advanced","question":"A deal-by-deal private equity fund earns a $15 million profit on its first investment and pays the GP 20% carry. A second investment later loses $11 million. Ignoring other terms, the whole-fund carry should be $0.8 million. The clawback amount is closest to:","options":{"A":"$0.8 million.","B":"$2.2 million.","C":"$3.0 million."},"answer":"B","explanation":"Initial carry = 15 x 20% = $3.0 million. Aggregate profit = 15 - 11 = $4 million. Correct whole-fund carry = 4 x 20% = $0.8 million. Clawback = 3.0 - 0.8 = $2.2 million.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"},{"id":43,"difficulty":"advanced","question":"An investor can invest directly in a hedge fund earning 18% before fees under a “2 and 20” structure, with both fees independently calculated on beginning AUM and profit. Alternatively, a fund of funds invests in that hedge fund and charges an additional “1 and 10” on beginning AUM and its net profit. The investor’s return through the fund of funds is closest to:","options":{"A":"10.16%.","B":"12.40%.","C":"14.40%."},"answer":"A","explanation":"Underlying hedge fund net return = 18% - 2% - (18% x 20%) = 12.4%. Fund of funds fees = 1% + (12.4% x 10%) = 2.24%. Investor return = 12.4% - 2.24% = 10.16%.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":44,"difficulty":"advanced","question":"A private company has negative free cash flow but expects another equity financing round within 12 months. It wants to extend its runway without issuing common shares today. The most appropriate financing is:","options":{"A":"Venture debt.","B":"Senior syndicated investment-grade bonds.","C":"A dividend recapitalization."},"answer":"A","explanation":"Venture debt is designed for young companies that need interim financing and want to postpone equity dilution. It usually relies on future financing or business progress for repayment.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":45,"difficulty":"advanced","question":"An infrastructure investor wants the lowest demand risk. Which asset is most appropriate?","options":{"A":"A greenfield toll road paid solely from traffic volume","B":"A completed hospital receiving government availability payments","C":"An uncontracted merchant power plant"},"answer":"B","explanation":"Availability payments depend on making the facility available and meeting performance standards, not on end-user volume. Construction is already complete, further reducing risk.","module":"LM 4","moduleTitle":"Real Estate and Infrastructure"},{"id":46,"difficulty":"advanced","question":"A venture investor expects a company to move toward an IPO and wants downside priority while preserving the ability to participate in upside. The most suitable security is:","options":{"A":"Convertible preferred stock.","B":"Unsecured trade credit.","C":"Nonconvertible senior bank debt."},"answer":"A","explanation":"Convertible preferred stock combines liquidation preference and contractual protections with the option to convert into common equity.","module":"LM 3","moduleTitle":"Private Capital: Equity and Debt"},{"id":47,"difficulty":"advanced","question":"A hedge fund has 140% long exposure and 90% short exposure. Its gross and net exposures are, respectively:","options":{"A":"50% and 230%.","B":"230% and 50%.","C":"140% and 90%."},"answer":"B","explanation":"Gross exposure = 140% + 90% = 230%. Net exposure = 140% - 90% = 50% long.","module":"LM 6","moduleTitle":"Hedge Funds"},{"id":48,"difficulty":"advanced","question":"Two investors enter the same hedge fund at different dates. The fund has a high-water-mark provision. Compared with the earlier investor, the new investor most likely:","options":{"A":"Automatically inherits the earlier investor’s lower high-water mark.","B":"Has an investor-specific high-water mark based on the new entry value.","C":"Is exempt from all performance fees until the fund’s liquidation."},"answer":"B","explanation":"High-water marks are investor-specific. A new investor generally begins with a high- water mark related to the entry NAV and may therefore pay incentive fees while an older investor remains below a higher prior peak.","module":"LM 2","moduleTitle":"Performance and Returns"},{"id":49,"difficulty":"advanced","question":"A stablecoin is fully backed by short-term securities, but investors cannot verify reserve ownership and redemptions are temporarily suspended. The most immediate risks are:","options":{"A":"Reserve transparency and liquidity risk.","B":"Biological growth and harvest risk.","C":"Merger completion and short-squeeze risk."},"answer":"A","explanation":"Even apparently high-quality reserves do not protect holders if ownership, custody, reporting, and redemption mechanisms are uncertain.","module":"LM 7","moduleTitle":"Digital Assets"},{"id":50,"difficulty":"advanced","question":"A large pension fund has extensive private-market staff. It wants to retain a diversified primary fund relationship but invest additional capital only in selected transactions at reduced fees. The most appropriate method is:","options":{"A":"Co-investment.","B":"A public index fund.","C":"A complete replacement of the fund relationship with an unmanaged direct portfolio."},"answer":"A","explanation":"Co-investment allows an experienced LP to invest directly alongside the GP in selected assets, often with lower fees, while maintaining the diversified fund relationship.","module":"LM 1","moduleTitle":"Features, Methods, and Structures"}],"traps":[{"id":1,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Alternative investments are not defined only by low correlation","trap":"Treating every asset with low historical correlation to stocks and bonds as an alternative investment.","definition":"Alternative investments are identified by their structures, markets, liquidity, valuation methods, and return drivers. Low correlation may be a benefit, but it is not the definition."},{"id":2,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"The alternative-investment categories are not interchangeable","trap":"Using private capital, real assets, hedge funds, and digital assets as if they have the same risks and cash-flow patterns.","definition":"Each category has distinct ownership structures, liquidity, valuation methods, and sources of return. The exam often tests the distinguishing feature, not merely whether an asset is 'alternative.'"},{"id":3,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Fund investing does not give the investor direct control","trap":"Assuming that an investor in an alternative investment fund selects or manages the fund's underlying assets.","definition":"The fund manager identifies, selects, manages, and exits the investments. A fund investor normally decides only whether to invest in the fund and has limited influence over individual holdings."},{"id":4,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Direct investing is not automatically the cheapest or safest method","trap":"Choosing direct investment solely because it avoids fund-level fees.","definition":"Direct investing can reduce external management fees and increase control, but it requires greater expertise, due diligence, monitoring resources, and tolerance for concentration and execution risk."},{"id":5,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Co-investing is not the same as investing in a second diversified fund","trap":"Assuming that a co-investment automatically adds diversification because it is made outside the main fund.","definition":"A co-investment is a direct investment alongside the fund in a specific deal. It may reduce fees and build experience, but it can increase deal concentration and oversight requirements."},{"id":6,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Lower co-investment fees do not mean lower total risk","trap":"Equating lower management or performance fees with a superior risk-adjusted investment.","definition":"Co-investors receive more control and often pay lower fees, but they must evaluate the asset directly and bear greater selection, monitoring, and concentration risk."},{"id":7,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Committed capital is not the same as invested capital","trap":"Treating the full capital commitment as if it were immediately contributed and invested on the commitment date.","definition":"A commitment is the maximum amount the investor agrees to provide. Capital is drawn over time through capital calls, so paid-in capital and invested capital can be far below committed capital early in the fund's life."},{"id":8,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Limited partners are passive investors","trap":"Assuming limited partners participate in day-to-day fund management because they provide most of the capital.","definition":"The general partner controls investment and operating decisions. Limited partners generally remain passive to preserve limited liability, although they may receive advisory or co-investment rights."},{"id":9,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"The GP and LP do not bear the same legal and economic responsibilities","trap":"Treating the general partner and limited partners as equivalent owners of the fund.","definition":"The GP manages the fund and earns management and performance compensation. LPs contribute capital, have limited control, and normally have liability limited to their commitments, subject to the governing structure."},{"id":10,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Alternative funds are not mutual funds with different assets","trap":"Assuming alternative funds offer the same liquidity, transparency, valuation frequency, and redemption flexibility as traditional mutual funds or ETFs.","definition":"Alternative funds commonly involve capital commitments, lockups, infrequent valuations, limited transparency, complex fees, and restrictions on transfers or redemptions."},{"id":11,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"The management-fee base depends on the vehicle","trap":"Applying a single fee base to every alternative investment fund.","definition":"Private equity management fees are commonly based on committed capital during the investment period, while hedge funds and many REIT structures commonly charge fees based on assets under management or net asset value. Always use the fee base stated in the question."},{"id":12,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Performance fee, incentive fee, and carried interest can refer to the same economic concept","trap":"Treating these labels as three unrelated charges.","definition":"They generally describe compensation linked to investment performance. The applicable calculation still depends on the hurdle, high-water mark, catch-up, waterfall, and fee base specified in the fund terms."},{"id":13,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"A hurdle rate is not a high-water mark","trap":"Using the terms interchangeably because both restrict performance fees.","definition":"A hurdle is a minimum return threshold for earning a performance fee. A high-water mark is the previous peak value, net of fees, that must be exceeded before a manager can charge a new performance fee."},{"id":14,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"Hard and soft hurdles produce different fees","trap":"Calculating the performance fee only on the return above the hurdle in every case.","definition":"With a hard hurdle, the performance fee applies only to return above the hurdle. With a soft hurdle, once the hurdle is exceeded, the performance fee can apply to the entire return, often through a catch-up mechanism."},{"id":15,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"A catch-up clause favors the GP after the preferred return is met","trap":"Treating a catch-up as an additional preferred return paid to limited partners.","definition":"After LPs receive the stated preferred return, the catch-up directs distributions to the GP until the GP reaches the agreed share of profits, after which residual profits are split according to the carried-interest ratio."},{"id":16,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"A high-water mark prevents double charging; it does not refund prior fees","trap":"Assuming that a decline below the high-water mark requires the manager to return incentive fees already paid.","definition":"The manager simply cannot charge a new performance fee until the fund value exceeds the previous high-water mark. A refund of prior fees requires a clawback or another explicit provision."},{"id":17,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"A clawback is different from a high-water mark","trap":"Choosing a high-water mark when the question asks which provision allows LPs to reclaim previously paid performance compensation.","definition":"A clawback requires the GP to return excess carried interest or performance fees, typically when early profitable exits are followed by later losses that reduce aggregate fund profits."},{"id":18,"module":"LM 1","moduleTitle":"Alternative Investment Features, Methods, and Structures","term":"American and European waterfalls favor different parties","trap":"Assuming a deal-by-deal waterfall and a whole-of-fund waterfall distribute carried interest at the same time.","definition":"A deal-by-deal, or American, waterfall can pay the GP carried interest after each profitable realization and is more GP-friendly. A whole-of-fund, or European, waterfall delays GP participation until LPs recover aggregate contributed capital and the required return, making it more LP-friendly."},{"id":19,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Positive cash flow usually arrives in the distribution phase","trap":"Expecting positive investor cash flow during the commitment or deployment phase merely because the underlying assets may appreciate.","definition":"The commitment and deployment phases are generally dominated by fees, capital calls, and investment outflows. Material positive cash flow usually appears during the distribution or harvesting phase."},{"id":20,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"The J-curve does not necessarily indicate a failed investment","trap":"Interpreting negative early returns as proof that the manager selected poor assets.","definition":"Early negative performance can result from management fees, organizational expenses, conservative valuations, and capital being deployed before exits occur. Returns may improve later as assets mature and are realized."},{"id":21,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"IRR is timing-sensitive","trap":"Using IRR as if it measures only the total amount of profit earned.","definition":"IRR incorporates the timing and size of cash flows. Earlier distributions can materially increase IRR even when the total profit or ending value is unchanged."},{"id":22,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"MOIC ignores the timing of cash flows","trap":"Treating a 2.0x MOIC earned in three years as economically equivalent to a 2.0x MOIC earned in ten years.","definition":"MOIC measures value created relative to invested capital, but it does not reflect how long the capital was invested. IRR is needed to incorporate timing."},{"id":23,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"IRR and MOIC can rank investments differently","trap":"Assuming the investment with the higher IRR must also have the higher money multiple.","definition":"A fast exit can generate a high IRR but a modest MOIC, while a slower investment can generate a larger MOIC but a lower IRR. The two measures answer different questions."},{"id":24,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Interim private-market returns depend on appraisals","trap":"Treating reported interim NAV changes as continuously observed market returns.","definition":"Illiquid assets are often valued periodically using models or appraisals. Stale or smoothed valuations can understate volatility, delay recognition of market changes, and distort correlations."},{"id":25,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Leverage magnifies losses as well as gains","trap":"Attributing higher alternative-investment returns entirely to manager skill when the strategy uses significant leverage.","definition":"Leverage amplifies the effect of asset-price changes and can increase liquidity, refinancing, and forced-sale risk. Performance should be interpreted in light of leverage."},{"id":26,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Alternative-investment returns are often non-normal","trap":"Relying only on mean return and standard deviation when evaluating strategies with leverage, illiquidity, options, or asymmetric payoffs.","definition":"Alternative returns may be skewed, fat-tailed, and exposed to infrequent large losses. Standard deviation can therefore understate relevant downside and tail risk."},{"id":27,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Gross return is not the investor's return","trap":"Comparing a manager's gross return directly with a traditional benchmark reported net of fees.","definition":"The investor earns the return remaining after management fees, performance fees, fund expenses, and any additional vehicle-level fees. Comparisons must use consistent gross or net conventions."},{"id":28,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Fee calculations depend on the stated timing and base","trap":"Automatically calculating the management fee on beginning-of-period assets or initial capital.","definition":"Questions may specify beginning NAV, ending NAV, average NAV, committed capital, or invested capital. Use the exact base and calculation sequence provided."},{"id":29,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Performance fees may be calculated before or after management fees","trap":"Assuming the incentive fee is always based on gross profit.","definition":"The governing terms may calculate the performance fee independently from the management fee or on return net of the management fee. The sequence changes both total fees and the investor's net return."},{"id":30,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"A hard hurdle applies only to excess return","trap":"Charging the performance fee on the entire fund return after a hard hurdle is exceeded.","definition":"Under a hard hurdle, the performance fee is calculated only on return above the hurdle, after applying any specified management-fee adjustment."},{"id":31,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"A soft hurdle can expose the entire return to carried interest","trap":"Calculating a soft-hurdle fee in the same way as a hard-hurdle fee.","definition":"Once the soft hurdle is achieved, the GP may earn its carried-interest percentage on the entire profit, commonly through a catch-up followed by the residual profit split."},{"id":32,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Full catch-up targets the GP's agreed percentage of total profit","trap":"Stopping the GP distribution immediately after the preferred return is paid to LPs.","definition":"With full catch-up, distributions then go to the GP until the GP has caught up to the contractual carried-interest share of profits generated to that point."},{"id":33,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Do not compound a preferred return unless the question says to","trap":"Automatically compounding a multi-year preferred return because the rate is stated per annum.","definition":"CFA examples commonly treat the preferred return as a simple annual amount unless the terms explicitly state compounding. Follow the wording of the problem."},{"id":34,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"High-water marks can be investor-specific","trap":"Assuming every investor in the same hedge fund necessarily earns the same periodic net return.","definition":"Different entry dates, share classes, fee arrangements, and investor-specific high-water marks can produce different net returns for investors in the same underlying portfolio."},{"id":35,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Lockup, notice period, gate, and redemption fee are different restrictions","trap":"Using one liquidity term as a substitute for another.","definition":"A lockup prohibits redemption for a minimum period; a notice period requires advance notice; a gate limits the amount redeemed; and a redemption fee discourages withdrawals by imposing a charge."},{"id":36,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Liquidity terms should match the liquidity of the assets","trap":"Viewing restrictive redemption terms only as unfavorable to investors.","definition":"Restrictions can protect remaining investors by reducing forced sales of illiquid positions. A fund offering highly liquid redemptions against illiquid assets creates liquidity-mismatch risk."},{"id":37,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Funds of funds create a second layer of fees","trap":"Calculating only the fees charged by the underlying hedge funds.","definition":"The investor typically pays underlying fund fees and additional fund-of-funds fees. The structure may still be worthwhile for diversification, due diligence, access, and lower minimum investment requirements."},{"id":38,"module":"LM 2","moduleTitle":"Alternative Investment Performance and Returns","term":"Hedge fund indexes are vulnerable to survivorship and backfill bias","trap":"Treating a hedge fund index as a complete record of all funds that existed during the measurement period.","definition":"Survivorship bias excludes failed or closed funds, while backfill bias adds prior returns of funds only after successful performance. Both tend to overstate historical average returns."},{"id":39,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Venture capital is a category of private equity","trap":"Treating venture capital and private equity as unrelated asset classes.","definition":"Private equity is the broader category. Venture capital finances early-stage and growth companies, while other private equity strategies include growth equity and leveraged buyouts."},{"id":40,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"A leveraged buyout is a going-private transaction","trap":"Assuming an LBO increases the amount of publicly traded equity in the target company.","definition":"An LBO commonly acquires a public company and substantially removes its shares from public trading. The acquisition is financed with a significant amount of debt."},{"id":41,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"A buyout target does not have to be distressed","trap":"Equating every highly leveraged acquisition with distressed investing.","definition":"Buyout investors may target stable companies with predictable cash flow and operational-improvement potential. Distressed investing focuses on firms experiencing financial or operational difficulty."},{"id":42,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Growth equity is not the same as venture capital or a control buyout","trap":"Classifying all minority investments in expanding private companies as venture capital.","definition":"Growth equity generally finances more established companies seeking expansion capital, often with less leverage and less control than a buyout and less early-stage risk than venture capital."},{"id":43,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Financing instruments change across the company life cycle","trap":"Assuming the same security is most appropriate at every venture stage.","definition":"Common equity and convertible instruments are often used at early stages, while preferred equity becomes more common in later-stage venture financing because it provides greater investor protection as the company approaches exit."},{"id":44,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Private equity returns are not only market beta","trap":"Explaining PE outperformance solely as exposure to public equity markets.","definition":"Private equity returns may come from revenue growth, margin improvement, governance and operational changes, leverage, and changes in exit valuation multiples. These sources also introduce execution and financing risk."},{"id":45,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"An IPO is an exit route, but not always immediate liquidity","trap":"Assuming a public listing instantly converts the entire PE position into cash.","definition":"An IPO or SPAC transaction can create a public market for the shares, but lockups, staged sales, market capacity, and price risk may delay complete realization."},{"id":46,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"A recapitalization can distribute cash while increasing risk","trap":"Treating a dividend recapitalization as a risk-free return of capital.","definition":"A recapitalization can allow owners to receive a distribution without selling the company, but the new debt increases leverage, fixed obligations, and financial-distress risk."},{"id":47,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Direct lending is not simply public bond investing without an exchange","trap":"Ignoring the negotiated structure of a private loan.","definition":"Direct lending commonly involves privately negotiated senior loans, scheduled interest and principal payments, collateral, covenants, and less liquidity than public debt."},{"id":48,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Venture debt reduces dilution but does not eliminate financing risk","trap":"Viewing venture debt as free capital because it avoids issuing additional equity.","definition":"Venture debt preserves ownership percentages, but it adds interest, maturity, and covenant obligations to companies that may have uncertain or negative cash flow."},{"id":49,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Mezzanine debt is subordinated and often equity-linked","trap":"Classifying mezzanine debt as low-risk senior secured lending.","definition":"Mezzanine financing sits below senior debt, generally carries a higher required return, and often includes warrants or conversion rights that give the lender equity participation."},{"id":50,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Distressed debt is not automatically cheap and safe","trap":"Assuming a large discount to par guarantees a high return.","definition":"The discount reflects a meaningful probability of default, restructuring, or low recovery. Returns depend on enterprise value, legal priority, restructuring outcomes, and the investor's ability to influence or analyze the process."},{"id":51,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Unitranche debt blends senior and subordinated risk","trap":"Treating a unitranche loan as entirely senior secured debt because it is documented as one facility.","definition":"Unitranche financing combines senior and junior exposures into a single loan with a blended interest rate that generally lies between secured senior and unsecured or subordinated borrowing rates."},{"id":52,"module":"LM 3","moduleTitle":"Investments in Private Capital: Equity and Debt","term":"Vintage diversification is essential in private capital","trap":"Diversifying only by manager or industry while committing all capital in one market environment.","definition":"Private-capital outcomes are strongly influenced by entry valuations, credit conditions, and the business cycle in the fund's vintage year. Committing across multiple vintage years reduces timing concentration, although it does not eliminate illiquidity or market risk."},{"id":53,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Raw land, farmland, and timberland are not developed real estate","trap":"Classifying every investment in land as real estate.","definition":"Developed residential and commercial property are real estate investments. Raw land, agricultural land, and timberland are generally treated as natural-resource investments."},{"id":54,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Real estate is heterogeneous and location-specific","trap":"Assuming two properties with similar size and use are perfect substitutes.","definition":"Properties differ by location, age, quality, tenants, lease terms, and physical characteristics. Heterogeneity, fragmentation, and costly transactions make price discovery slower than in public securities."},{"id":55,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Real estate exposure can be debt or equity, direct or indirect, public or private","trap":"Treating real estate investing as synonymous with directly owning buildings.","definition":"Investors can own property directly, invest through private funds or partnerships, buy listed REIT shares, or provide mortgage and securitized debt financing. Each form has different liquidity and risk."},{"id":56,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Equity, mortgage, and hybrid REITs have different exposures","trap":"Assuming every REIT primarily owns income-producing property.","definition":"Equity REITs own property, mortgage REITs provide or invest in real estate debt, and hybrid REITs combine both. Their sensitivity to property income, credit spreads, and interest rates therefore differs. REIT pass-through treatment can reduce entity-level double taxation, but investors still face applicable taxes."},{"id":57,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Listed REITs improve liquidity but behave more like public equities in stress","trap":"Assuming a listed REIT has the same low measured correlation as appraisal-based private real estate.","definition":"REITs offer transparency and exchange liquidity, but their market prices can become highly correlated with public equity markets, particularly during sharp declines. Private real estate may show lower measured volatility partly because infrequent appraisals smooth returns and correlations."},{"id":58,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Income is usually the more stable component of real estate return","trap":"Assuming capital appreciation is the dominant and most predictable source of commercial real estate performance.","definition":"Real estate return consists of property income and price appreciation. Lease income is generally more consistent through the cycle, while appreciation is more volatile."},{"id":59,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Real estate can produce bond-like or equity-like returns","trap":"Applying one risk profile to every property strategy.","definition":"Stabilized properties with strong tenants and long leases can generate bond-like cash flows. Development, redevelopment, repositioning, and speculative appreciation create more equity-like risk."},{"id":60,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"The real estate risk ladder runs from core to opportunistic","trap":"Ranking core-plus or value-add strategies as less risky than stabilized core property.","definition":"Core strategies emphasize stable, high-quality, income-producing assets. Core-plus adds modest improvement risk, value-add requires more substantial change, and opportunistic strategies have the greatest development, leasing, and market risk."},{"id":61,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"LTV can rise even while the loan amortizes","trap":"Assuming a declining loan balance guarantees a declining loan-to-value ratio.","definition":"LTV equals loan balance divided by property value. Amortization reduces the numerator, but a sufficiently large decline in property value can still increase LTV and trigger collateral or covenant requirements."},{"id":62,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Infrastructure is essential and long-lived, not risk-free","trap":"Treating essential public use as a guarantee of investment performance.","definition":"Infrastructure assets are capital intensive and provide essential services, but investors still face construction, demand, operating, regulatory, political, financing, and concession risk."},{"id":63,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Economic and social infrastructure generate cash flow differently","trap":"Assuming all infrastructure revenue comes directly from end-user fees.","definition":"Economic infrastructure includes transportation, utilities, and energy and may earn usage-based revenue. Social infrastructure includes schools, hospitals, and public facilities and often relies on lease-like or availability payments."},{"id":64,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Greenfield, secondary-stage, and brownfield are development stages","trap":"Using these labels as synonyms for infrastructure sectors.","definition":"Greenfield involves new development, secondary-stage assets are operational and generally require little additional investment, and brownfield investments involve established assets that may be expanded, improved, or redeveloped."},{"id":65,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Greenfield has the highest risk; secondary stage generally has the lowest","trap":"Ranking brownfield as automatically safer than fully operational secondary-stage infrastructure.","definition":"Greenfield bears construction and ramp-up uncertainty and has the highest expected risk and return. Operational secondary-stage assets generally have the lowest. Brownfield typically lies between them because it has operating history but may require additional capital or changes."},{"id":66,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"BOT and PPP structures allocate risk; they do not remove it","trap":"Assuming a build-operate-transfer or public-private partnership makes the government responsible for every project risk.","definition":"The private party may build and operate the asset before transferring it to the public entity. Contracts allocate construction, operating, demand, inflation, and regulatory risks, and the allocation must be analyzed explicitly."},{"id":67,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Infrastructure inflation protection depends on the contract","trap":"Assuming all infrastructure revenue automatically increases one-for-one with inflation.","definition":"Some assets have regulated tariffs, contractual escalators, or revenues linked to nominal economic activity. Others have fixed prices, political constraints, or volume risk, so inflation protection is not universal."},{"id":68,"module":"LM 4","moduleTitle":"Real Estate and Infrastructure","term":"Direct infrastructure remains illiquid even when the service is indispensable","trap":"Equating essential demand with a liquid secondary market.","definition":"Direct assets are unique, large, and difficult to transact. Publicly traded infrastructure securities improve liquidity and diversification but introduce public-market price volatility."},{"id":69,"module":"LM 5","moduleTitle":"Natural Resources","term":"Natural-resource land differs from developed property","trap":"Applying the same return drivers to farmland, timberland, raw land, and a stabilized commercial building.","definition":"Natural-resource land depends on biological growth, commodity prices, environmental conditions, and land appreciation. Developed real estate relies more heavily on leases, occupancy, and property operations."},{"id":70,"module":"LM 5","moduleTitle":"Natural Resources","term":"Farmland return has more than one source","trap":"Treating farmland performance as only a bet on land prices.","definition":"Returns may come from crop or livestock operations, lease income, and appreciation of the land. Weather, input costs, crop prices, water access, and operating efficiency affect the outcome."},{"id":71,"module":"LM 5","moduleTitle":"Natural Resources","term":"Timber biological growth creates a harvest-timing option","trap":"Assuming timber must be harvested at a fixed maturity date regardless of market prices.","definition":"Trees continue to grow while standing, so owners can often defer harvest when prices are weak. This flexibility can reduce forced selling, although fire, disease, storm, and regulatory risks remain."},{"id":72,"module":"LM 5","moduleTitle":"Natural Resources","term":"Stable appraised values do not eliminate farmland and timberland risk","trap":"Concluding that low reported volatility means these assets have low economic uncertainty.","definition":"Illiquidity and infrequent appraisals can smooth returns. Biological, climate, operational, local-market, and environmental risks can be substantial."},{"id":73,"module":"LM 5","moduleTitle":"Natural Resources","term":"A commodity does not produce an income stream merely by being held","trap":"Treating commodities like stocks that pay dividends or bonds that pay coupons.","definition":"Commodity exposure generally depends on changes in spot or futures prices. Physical holdings may generate no cash flow and can require storage, insurance, transportation, and financing."},{"id":74,"module":"LM 5","moduleTitle":"Natural Resources","term":"Direct physical commodity ownership has carrying costs","trap":"Using the spot-price change as the complete return from owning a physical commodity.","definition":"Storage, insurance, spoilage, transportation, financing, and transaction costs reduce the investor's net return. Some physical users also receive a convenience yield from immediate access to inventory."},{"id":75,"module":"LM 5","moduleTitle":"Natural Resources","term":"Commodity-futures return is not just the spot-price return","trap":"Comparing a commodity futures index directly with the change in the commodity's spot price.","definition":"A collateralized futures position can earn spot return, collateral yield, and roll yield. Differences between futures and spot performance often arise from the shape of the futures curve and contract replacement."},{"id":76,"module":"LM 5","moduleTitle":"Natural Resources","term":"Contango is generally unfavorable to a long rolling position","trap":"Assuming an upward-sloping futures curve creates a positive roll return for a long investor.","definition":"In contango, the expiring contract is generally replaced with a higher-priced longer-dated contract. Holding spot prices constant, this produces negative roll yield for a long position."},{"id":77,"module":"LM 5","moduleTitle":"Natural Resources","term":"Backwardation is generally favorable to a long rolling position","trap":"Assuming a downward-sloping futures curve reduces the return to a long investor.","definition":"In backwardation, the investor generally sells the expiring contract and buys a lower-priced longer-dated contract. Holding other factors constant, this produces positive roll yield."},{"id":78,"module":"LM 5","moduleTitle":"Natural Resources","term":"A futures price is not necessarily the market's forecast of the future spot price","trap":"Interpreting contango as proof that the commodity's spot price is expected to rise.","definition":"Futures prices reflect spot price, financing and storage costs, income or benefits from holding the asset, and convenience yield. The curve is an arbitrage relationship, not a pure forecast."},{"id":79,"module":"LM 5","moduleTitle":"Natural Resources","term":"Convenience yield lowers the theoretical futures price","trap":"Adding convenience yield to carrying costs when calculating the cost of carry.","definition":"Convenience yield is the non-cash benefit of having the physical commodity available. It offsets storage and financing costs and therefore reduces the futures price relative to an otherwise identical asset."},{"id":80,"module":"LM 5","moduleTitle":"Natural Resources","term":"Commodity inflation hedging and diversification are not guaranteed in every period","trap":"Assuming commodities will always rise whenever inflation increases and will always have low correlation with financial assets.","definition":"Commodities can provide useful inflation sensitivity and diversification, but outcomes depend on the source of inflation, the commodity, the futures curve, currency effects, and the investment horizon."},{"id":81,"module":"LM 6","moduleTitle":"Hedge Funds","term":"A hedge fund does not necessarily hedge market risk","trap":"Assuming the word 'hedge' means the fund must maintain a market-neutral portfolio.","definition":"Hedge funds may use long and short positions, derivatives, leverage, and concentrated directional exposures. The strategy, not the vehicle's name, determines net market risk."},{"id":82,"module":"LM 6","moduleTitle":"Hedge Funds","term":"Long/short equity is not automatically market neutral","trap":"Assuming that holding both long and short positions creates zero equity beta.","definition":"A long/short fund may remain net long or net short. Market-neutral strategies specifically seek to offset systematic exposure, while fundamental growth, value, and long/short strategies may retain material beta."},{"id":83,"module":"LM 6","moduleTitle":"Hedge Funds","term":"Merger arbitrage earns a spread because the deal can fail","trap":"Treating the difference between the target price and the announced acquisition price as a near-risk-free return.","definition":"The spread compensates investors for regulatory, financing, shareholder, timing, and deal-break risk. If the transaction fails, the target's price can fall sharply."},{"id":84,"module":"LM 6","moduleTitle":"Hedge Funds","term":"Relative-value trades can have small normal gains and large tail losses","trap":"Using low historical volatility as evidence that a convergence strategy is low risk.","definition":"Relative-value strategies often use leverage to profit from small pricing discrepancies. A widening spread, liquidity shock, or financing withdrawal can create large losses before convergence occurs."},{"id":85,"module":"LM 6","moduleTitle":"Hedge Funds","term":"Global macro is a directional strategy","trap":"Classifying global macro as a market-neutral relative-value strategy.","definition":"Global macro managers take discretionary or systematic positions in currencies, rates, equity indexes, commodities, and other markets based on broad economic and political views."},{"id":86,"module":"LM 6","moduleTitle":"Hedge Funds","term":"Managed futures are not limited to commodity speculation","trap":"Assuming commodity trading adviser or managed-futures strategies invest only in physical commodities.","definition":"They commonly trade futures across equity indexes, fixed income, currencies, and commodities, often using systematic trend-following models."},{"id":87,"module":"LM 6","moduleTitle":"Hedge Funds","term":"A fund of hedge funds trades lower concentration for double fees","trap":"Ignoring the additional fee layer because the underlying managers already charge management and incentive fees.","definition":"The fund of funds adds its own fees, but it may provide manager diversification, due diligence, access to closed funds, and operational oversight."},{"id":88,"module":"LM 6","moduleTitle":"Hedge Funds","term":"A master-feeder structure is not a side pocket","trap":"Using the terms as alternative names for the same hedge fund vehicle.","definition":"A master-feeder structure pools capital from different feeder vehicles into one trading portfolio, often to accommodate investor tax or regulatory differences. A side pocket segregates illiquid or hard-to-value assets from the redeemable portfolio."},{"id":89,"module":"LM 6","moduleTitle":"Hedge Funds","term":"A gate limits redemptions; a lockup prohibits them for a minimum period","trap":"Selecting a gate when the fund terms state that no investor can redeem for the first year.","definition":"The first-year restriction is a lockup. A gate is imposed to cap or delay the amount redeemed during a period, while notice periods and redemption fees address timing and cost."},{"id":90,"module":"LM 6","moduleTitle":"Hedge Funds","term":"Reported hedge fund risk can be understated","trap":"Relying on smooth monthly returns and low measured correlation without examining leverage, short exposure, valuation frequency, and liquidity.","definition":"Illiquid pricing can create serial correlation and artificially low volatility. Leverage and short selling can magnify losses, and correlations among strategies may rise during market stress."},{"id":91,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Blockchain is a form of distributed ledger technology, not a synonym for every DLT","trap":"Assuming all distributed ledgers must organize data in a public chain of blocks.","definition":"DLT is the broader concept of a shared, synchronized record across participants. Blockchain is one implementation that records validated transactions in linked blocks."},{"id":92,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Permissioned and permissionless describe access and governance","trap":"Equating a permissioned network with proof of stake and a permissionless network with proof of work.","definition":"Permissioned networks restrict participation or validation to approved parties. Permissionless networks allow broad participation. Either network design can use different consensus mechanisms."},{"id":93,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Proof of work and proof of stake are consensus mechanisms","trap":"Treating PoW and PoS as types of digital assets.","definition":"PoW generally relies on computational work by miners, while PoS relies on validators that commit or stake assets. Both are methods for validating transactions and maintaining agreement on the ledger."},{"id":94,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"A native cryptocurrency coin is not the same as a token","trap":"Calling every digital asset issued on a blockchain a cryptocurrency coin.","definition":"A coin is native to its own blockchain, such as bitcoin on Bitcoin. A token is created on an existing blockchain and can represent utility, governance rights, securities, collectables, or claims on assets."},{"id":95,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Security, utility, and governance tokens have different economic rights","trap":"Assuming all tokens give the holder an ownership claim and dividend rights.","definition":"Security tokens can represent investment or ownership claims; utility tokens provide access or services within a network; governance tokens provide voting rights over network decisions. Legal classification depends on the facts and jurisdiction."},{"id":96,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Stablecoins are not automatically stable or redeemable at par","trap":"Treating the word 'stable' as a guarantee of value preservation.","definition":"Collateralized or securitized stablecoins depend on the quality, custody, liquidity, and transparency of reserves. Algorithmic stablecoins rely on mechanisms and linked tokens that can fail under stress."},{"id":97,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"An NFT or asset-backed token does not automatically convey every legal right to the underlying asset","trap":"Assuming possession of the token necessarily transfers copyright, physical possession, or an enforceable claim.","definition":"The token records a digital claim or identifier, but the legal rights depend on the governing contract, custody arrangement, jurisdiction, and linkage between the token and the off-chain asset."},{"id":98,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Tokenization can improve divisibility without eliminating underlying risk","trap":"Assuming fractional ownership turns an illiquid or risky asset into a liquid, low-risk investment.","definition":"Tokenization can reduce minimum investment size and facilitate transfer, but investors still face the asset's economic risk plus platform, smart-contract, legal, market, and custody risk."},{"id":99,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Cryptocurrencies lack the conventional cash-flow anchor used for stocks and bonds","trap":"Applying a dividend discount model or bond present-value model directly to a cryptocurrency with no contractual cash flow.","definition":"Many cryptocurrencies have no claim on earnings, dividends, interest, or assets. Their valuation can depend heavily on adoption, scarcity, network utility, sentiment, regulation, and speculative demand."},{"id":100,"module":"LM 7","moduleTitle":"Introduction to Digital Assets","term":"Direct and indirect digital-asset exposure are not equivalent","trap":"Treating a wallet-held cryptocurrency, a coin trust, an ETF, and a futures-based fund as identical investments.","definition":"Direct ownership introduces private-key, wallet, exchange, and custody risk. Indirect vehicles add fees, tracking error, counterparty or structure risk, and, for futures-based products, leverage and roll effects."}]}},"ethics":{"label":"Ethics","shortLabel":"Ethics","subtitle":"CFA Level I 2027 · Ethics","data":{"formula":[{"id":1,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"Universal Ethical Decision Framework","definition":"Identify: relevant facts, stakeholders, duties, applicable laws and Standards, and conflicts.\n\nConsider: situational pressures, missing facts, guidance, alternatives, and consequences.\n\nDecide and act: implement the most ethical permissible action.\n\nReflect: compare the outcome with the intended result and improve the process.\n\nPriority principle: identify every Standard that may apply."},{"id":2,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Applicable-Law Rule — Standard I(A)","definition":"Applicable requirement = the most restrictive applicable requirement.\n\nIf local law is stricter, follow local law. If the Code and Standards are stricter, follow them. If no law applies, follow the Code and Standards. For an ongoing violation, do not participate or assist and dissociate."},{"id":3,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"Material Nonpublic Information Decision Rule","definition":"Public information: may analyze and trade, whether material or nonmaterial.\n\nNonpublic and nonmaterial information: may analyze and may use as part of a mosaic, provided the conclusion is not based on material nonpublic information.\n\nMaterial nonpublic information: do not act or cause others to act."},{"id":4,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Gifts, Compensation, and Referral Fees","definition":"Lavish third-party benefit that could compromise objectivity: refuse; disclosure alone may not cure the issue.\n\nToken third-party gift: generally acceptable if immaterial and not intended to influence.\n\nAdditional compensation or outside work that may conflict: obtain written consent from all parties before accepting.\n\nReferral fee: disclose its nature and value, as appropriate, before the formal engagement."},{"id":5,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"Priority of Interests and Transactions","definition":"Market integrity and law cannot be overridden by a client instruction.\n\nSubject to that constraint, general priority is: client interests, employer interests in employment matters, then personal interests.\n\nTrade priority under VI(B): client and employer transactions before transactions in which the member or candidate is a beneficial owner."},{"id":6,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Fair Dealing and Trade Allocation","definition":"Fair does not mean identical. Give affected clients a fair opportunity to act.\n\nDifferent disclosed service levels are permitted if they do not create an unfair trading advantage.\n\nUse a pre-established, objective allocation method for oversubscribed or partially filled trades. Personal beneficial accounts must not receive scarce allocations ahead of clients."},{"id":7,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Suitability Decision Rule — Standard III(C)","definition":"Advisory relationship: obtain and update client information; assess objectives, constraints, risk tolerance, and suitability in total-portfolio context and against the IPS.\n\nStated mandate or strategy: invest consistently with the mandate.\n\nUnsolicited unsuitable request: explain and document the conflict. If immaterial, execution may be considered under firm policy; if material, update the IPS or decline the trade."},{"id":8,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Confidentiality Decision Rule — Standard III(E)","definition":"Preserve confidentiality unless the information concerns illegal client activity, disclosure is required by law, or the client or prospective client permits disclosure.\n\nFollow stricter applicable law and share information internally only with people who have a legitimate need to know."},{"id":9,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"Leaving an Employer — Standard IV(A)","definition":"Permitted before departure: financial and logistical preparation, leasing office space, forming a company, arranging financing, and accepting another position.\n\nProhibited before departure: soliciting clients, taking client lists or proprietary work, diverting opportunities, reducing service, or misusing confidential information.\n\nAfter departure, general skill, experience, and public information may be used."},{"id":10,"module":"LM 7","moduleTitle":"Standard V: Investment Analysis, Recommendations, and Actions","term":"Research, Communication, and Records","definition":"V(A): investigate thoroughly; understand third-party research and model assumptions; a bad outcome is not itself a violation.\n\nV(B): disclose services and costs, the basic process, material risks and limitations, and significant changes; distinguish fact from opinion.\n\nV(C): maintain supporting records. If no stricter rule applies, CFA Institute recommends at least seven years."},{"id":11,"module":"LM 8","moduleTitle":"Standard VI: Conflicts of Interest","term":"Conflict Disclosure Rule — Standard VI(A)","definition":"Best practice is to avoid a conflict. If avoidance is not reasonable, make full and fair disclosure that is prominent, specific, in plain language, timely, effective, and updated when circumstances change.\n\nDisclosure does not legitimize conduct that must be avoided, such as fraud, market manipulation, misuse of MNPI, or a benefit that compromises objectivity."},{"id":12,"module":"LM 9","moduleTitle":"Standard VII: Responsibilities as a CFA Institute Member or CFA Candidate","term":"CFA Program and Designation Rules","definition":"Acceptable: “Jane Doe, CFA” while active; “Passed Level I of the CFA Program”; “Candidate in the CFA Program” only when accurately enrolled or awaiting results.\n\nNot acceptable: using CFA as a noun or altered designation, claiming a partial designation, implying superior performance, or revealing specific questions, formulas, or broad topic coverage from an exam."},{"id":13,"module":"LM 10","moduleTitle":"Introduction to GIPS","term":"GIPS Quick Rules","definition":"Compliance is voluntary, but any claim requires complete, firmwide compliance—never partial compliance.\n\nA composite groups portfolios managed to a similar strategy, objective, or mandate. Assign portfolios before performance is known.\n\nVerification is optional, independent, and firmwide; it does not guarantee every number. Only investment management firms managing actual assets may claim compliance."},{"id":14,"module":"LM 11","moduleTitle":"Application of the Code and Standards","term":"Most-Tested Numbers and Words","definition":"7 years: recommended record-retention period when no stricter requirement exists.\n\nWritten consent from all parties: additional compensation arrangements.\n\nBefore engagement: referral-fee disclosure.\n\nMost restrictive: law-versus-Standards rule.\n\nIntent to mislead: central to market manipulation.\n\nFirmwide and fully compliant: valid GIPS claim."}],"flashcards":[{"id":1,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What is ethics?","definition":"Ethics is a set of shared beliefs about acceptable behavior and the study of how to make good choices based on moral principles."},{"id":2,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What distinguishes a profession from an ordinary occupation?","definition":"A profession has specialized knowledge, high entry standards, ethical and professional standards, continuing education, monitoring of conduct, and a commitment to serve clients and society."},{"id":3,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"Why are high ethical standards especially important in investment management?","definition":"Investment services are intangible and clients entrust professionals with wealth. Trust supports capital formation, lowers financing costs, and improves the allocation of capital."},{"id":4,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"How does a code of ethics differ from standards of conduct?","definition":"A code states broad ethical principles. Standards of conduct translate those principles into minimum requirements and guidance for specific professional behavior."},{"id":5,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"Which situational influences commonly challenge ethical behavior?","definition":"Social pressure, loyalty to colleagues or supervisors, large financial rewards, prestige, short-term incentives, and a rules-only compliance culture."},{"id":6,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What is ethical overconfidence?","definition":"People tend to overrate the ethical quality of their own behavior and overemphasize personal character while underestimating situational pressures."},{"id":7,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"How do ethical standards compare with legal standards?","definition":"Ethical standards often require more judgment and may be stricter than law. An action can be legal but unethical, and in limited cases an illegal act may be viewed as ethical."},{"id":8,"module":"LM 1","moduleTitle":"Ethics and Trust","term":"What are the four phases of the ethical decision-making framework?","definition":"Identify relevant facts, stakeholders, duties, principles, and conflicts; consider situational influences, guidance, and alternatives; decide and act; then reflect on the outcome and lessons learned."},{"id":9,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What are the first three principles of the CFA Institute Code of Ethics?","definition":"Act with integrity, competence, diligence, respect, and ethics; place the integrity of the profession and client interests above personal interests; use reasonable care and independent professional judgment."},{"id":10,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What are the final three principles of the CFA Institute Code of Ethics?","definition":"Practice and encourage ethical professionalism; promote the integrity and viability of global capital markets for society; maintain and improve personal and industry competence."},{"id":11,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What are the seven Standards of Professional Conduct?","definition":"I Professionalism; II Integrity of Capital Markets; III Duties to Clients; IV Duties to Employers; V Investment Analysis, Recommendations, and Actions; VI Conflicts of Interest; VII Responsibilities as a CFA Institute Member or CFA Candidate."},{"id":12,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"Who is responsible for the Professional Conduct Program?","definition":"The CFA Institute Board of Governors has overall responsibility. Professional Conduct staff investigate cases, and the Disciplinary Review Committee and its panels review and enforce contested or agreed matters."},{"id":13,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What can trigger a Professional Conduct inquiry?","definition":"Self-disclosure; a written complaint; public information such as media or regulatory notices; testing-center or proctor reports; and CFA Institute analysis of exam scores/materials or online and social media activity."},{"id":14,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What can happen after a Professional Conduct inquiry begins?","definition":"Staff may request a written explanation, interview the subject and third parties, and collect records. The matter may close without sanction, end with a cautionary letter, or proceed to discipline."},{"id":15,"module":"LM 2","moduleTitle":"Code of Ethics and Professional Conduct Program","term":"What sanctions may CFA Institute impose?","definition":"Public censure; suspension of membership and use of the CFA designation; revocation of membership and the right to use the designation; or suspension/prohibition from further CFA Program participation."},{"id":16,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Under Standard I(A), which rule applies when requirements conflict?","definition":"Follow the strictest applicable requirement among relevant law, regulation, professional rules, and the Code and Standards. When no law applies, follow the Code and Standards."},{"id":17,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"What must a member or candidate do after discovering an ongoing violation?","definition":"Do not participate or assist, and dissociate from the activity. Internal reporting is usually appropriate and external reporting may be required by law, but the Standard's mandatory action is dissociation."},{"id":18,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"How are gifts from clients treated?","definition":"A gift for past performance may be accepted if it does not compromise objectivity and is disclosed to the employer. Compensation tied to future performance requires prior written consent under Standard IV(B)."},{"id":19,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"How are gifts or benefits from issuers, brokers, or other third parties treated?","definition":"Refuse anything that reasonably could compromise independence or objectivity. Modest customary items may be acceptable, but lavish gifts, entertainment, or favorable arrangements create a serious threat."},{"id":20,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Who should pay travel expenses for issuer-sponsored research?","definition":"Best practice is for the analyst's firm to pay. Issuer-paid travel may be acceptable only when arrangements are modest, necessary, and unlikely to impair objectivity."},{"id":21,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Can an omission constitute misrepresentation?","definition":"Yes. Knowingly omitting a material fact, presenting stale information as current, or leaving out information needed to avoid a misleading impression violates Standard I(C)."},{"id":22,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"What is plagiarism, and what attribution exception commonly appears on the exam?","definition":"Plagiarism is using another person's ideas, words, charts, or work without attribution. Factual data from recognized financial or statistical reporting services may generally be used without citation."},{"id":23,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Can a member guarantee investment results or imply that past performance will repeat?","definition":"No. Guarantees, certainty claims, or statements that past results will necessarily recur are misrepresentations unless the result is contractually guaranteed by a reliable third party and fully explained."},{"id":24,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"Can conduct outside work violate Standard I(D) Misconduct?","definition":"Yes, if it involves dishonesty, fraud, deceit, or otherwise reflects adversely on professional reputation, integrity, or competence. Minor unrelated offenses, such as an ordinary speeding ticket, usually do not."},{"id":25,"module":"LM 3","moduleTitle":"Standard I: Professionalism","term":"What does Standard I(E) Competence require?","definition":"Members and candidates must act with and maintain the knowledge, skills, and abilities needed for their professional responsibilities, including when roles, products, methods, or supervisory duties change."},{"id":26,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"When is information material?","definition":"When its disclosure would likely affect a security's price or when a reasonable investor would consider it important in making an investment decision."},{"id":27,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"When is information considered public?","definition":"After it has been disseminated broadly enough that the market has a reasonable opportunity to receive and act on it, such as through an official filing, press release, or widely available news source."},{"id":28,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"What is the mosaic theory?","definition":"An analyst may combine public information with nonmaterial nonpublic information to reach an investment conclusion. Acting on material nonpublic information remains prohibited."},{"id":29,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"What is transaction-based market manipulation?","definition":"Trades or orders intended to distort prices or artificially inflate volume, such as wash trades, matched orders, marking the close, or creating false liquidity."},{"id":30,"module":"LM 4","moduleTitle":"Standard II: Integrity of Capital Markets","term":"What is information-based market manipulation?","definition":"Spreading false or misleading information, rumors, or projections with the intent to mislead market participants and affect prices or trading volume."},{"id":31,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Does Standard III(A) make every member or candidate a legal fiduciary?","definition":"No. Legal fiduciary status depends on law and the relationship. The Standard nevertheless requires loyalty, prudence, care, and work in the client's best interest regardless of job title."},{"id":32,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"To whom is loyalty owed when managing a pension plan or pooled fund?","definition":"For a pension plan, generally to the beneficiaries rather than the sponsor's management. For a pooled fund, the manager follows the fund's stated mandate rather than the objectives of an individual investor."},{"id":33,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"When may client brokerage or soft commissions be used?","definition":"Only when the purchased research or service benefits the client whose brokerage generated the commission and the arrangement is consistent with best execution and applicable law."},{"id":34,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"Does fair dealing require identical treatment of every client?","definition":"No. It requires fair and objective treatment. Different service levels are permitted if disclosed, available on fair terms, and not used to disadvantage other clients."},{"id":35,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How should limited investment opportunities, such as oversubscribed IPOs, be allocated?","definition":"Use a fair, objective, and consistently applied allocation process. Do not favor personal, family, or selected client accounts, and document the allocation method."},{"id":36,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How often must client objectives and the IPS be updated?","definition":"Regularly and whenever material changes in client circumstances occur. The Standard does not impose a universal once-a-year rule."},{"id":37,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How is suitability evaluated for an advisory client?","definition":"Gather and update investment experience, objectives, risk tolerance, and constraints; judge the investment in the context of the total portfolio; and confirm consistency with the written IPS."},{"id":38,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"How should an unsolicited unsuitable trade request be handled?","definition":"Explain why it conflicts with the IPS. If the portfolio impact is immaterial, follow firm policy and document the client's acknowledgment. If material, update the IPS, use a separate client-directed account if permitted, or reconsider the relationship."},{"id":39,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"What does Standard III(D) require for performance presentations?","definition":"Make reasonable efforts to ensure performance is fair, accurate, and complete. GIPS compliance is the best method, but it is not mandatory for compliance with the Standard."},{"id":40,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"When may confidential client information be disclosed?","definition":"When it concerns illegal client activity, disclosure is required by law, or the client or prospective client permits it. The duty extends to current, former, and prospective clients."},{"id":41,"module":"LM 5","moduleTitle":"Standard III: Duties to Clients","term":"What are two recurring duties under loyalty, prudence, and care besides selecting investments?","definition":"Seek best execution and vote material proxies in the clients' best interests, considering costs and benefits. Follow governing documents and client instructions."},{"id":42,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"May an employee prepare to leave a firm before resigning?","definition":"Yes. The employee may make logistical preparations, but may not solicit current clients, misuse confidential information, divert business, or otherwise compete with the employer before the relationship ends."},{"id":43,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"Who owns models, research, client lists, and records created for an employer?","definition":"Generally the employer. A departing employee may use general knowledge and experience but may not take records, files, or proprietary work without permission."},{"id":44,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"When may a member undertake outside work or compete with an employer?","definition":"Only after disclosing the activity and obtaining the employer's consent when the activity could compete, create a conflict, use employer resources, or interfere with job responsibilities."},{"id":45,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"What is required before accepting additional compensation tied to future performance?","definition":"Obtain written consent from all parties involved before entering the arrangement, including the employer and the party offering the compensation."},{"id":46,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"What should a prospective supervisor do if compliance procedures are inadequate?","definition":"Raise the deficiency with management and decline supervisory responsibility in writing until adequate procedures are adopted, if the role cannot otherwise be performed properly."},{"id":47,"module":"LM 6","moduleTitle":"Standard IV: Duties to Employers","term":"What must a supervisor do after detecting a possible violation?","definition":"Investigate promptly and take steps to prevent further harm, such as restricting the employee's activities or increasing monitoring. Merely repo
